<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0E7C86" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1F29" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="./icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Viagem Disney">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Planejador Disney — Miami e Orlando · Ago/Set 2026</title>

<style>
:root{
  --paper:#FFF3E0; --surface:#FFFCF7; --surface-2:#FBF0DC; --surface-3:#F0E2C6;
  --fg:#1B2141; --fg-dim:#4C5375; --fg-faint:#5E6486;
  --line:#E4D2B2; --line-soft:#F2E6D0;
  --accent:#1064C8; --accent-soft:#D7E8FF; --on-accent:#FFFFFF;
  --ok:#1C7A46; --warn:#8A5300; --crit:#C42132;
  --ok-bg:#E2F6E7; --warn-bg:#FBE8C0; --crit-bg:#FCDCDC;
  --mk:#B4356B; --ak:#3F7A3A; --hs:#AE5114; --ue:#4F46C4; --ds:#82662A; --mia:#3D5AB5; --gen:#546A72;
  /* sombra sólida: um degrau de cor, não borrão */
  --shadow:0 2px 0 #E8D6B6, 0 10px 18px -14px rgba(27,33,65,.45);

  --font-display:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Avenir Next Rounded",Avenir,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-ui:"Seravek","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-data:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;

  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#101A33; --surface:#1A2444; --surface-2:#232E54; --surface-3:#2E3A66;
    --fg:#F3EEE3; --fg-dim:#BCC4DF; --fg-faint:#A6AFCF;
    --line:#39456F; --line-soft:#2A3560;
    --accent:#7BB8FF; --accent-soft:#1B2F5C; --on-accent:#08152E;
    --ok:#5FD08C; --warn:#F0BC4A; --crit:#FF8E7C;
    --ok-bg:#123A28; --warn-bg:#3A2E10; --crit-bg:#3C201E;
    --mk:#EE7BA6; --ak:#79BE6F; --hs:#EE9A5C; --ue:#9A93F0; --ds:#D4B267; --mia:#8B9FEE; --gen:#8FA5AC;
    --shadow:0 2px 0 #0B1226, 0 12px 22px -16px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --paper:#101A33; --surface:#1A2444; --surface-2:#232E54; --surface-3:#2E3A66;
  --fg:#F3EEE3; --fg-dim:#BCC4DF; --fg-faint:#A6AFCF;
  --line:#39456F; --line-soft:#2A3560;
  --accent:#7BB8FF; --accent-soft:#1B2F5C; --on-accent:#08152E;
  --ok:#5FD08C; --warn:#F0BC4A; --crit:#FF8E7C;
  --ok-bg:#123A28; --warn-bg:#3A2E10; --crit-bg:#3C201E;
  --mk:#EE7BA6; --ak:#79BE6F; --hs:#EE9A5C; --ue:#9A93F0; --ds:#D4B267; --mia:#8B9FEE; --gen:#8FA5AC;
  --shadow:0 2px 0 #0B1226, 0 12px 22px -16px rgba(0,0,0,.85);
}
:root[data-theme="light"]{
  --paper:#FFF3E0; --surface:#FFFCF7; --surface-2:#FBF0DC; --surface-3:#F0E2C6;
  --fg:#1B2141; --fg-dim:#4C5375; --fg-faint:#5E6486;
  --line:#E4D2B2; --line-soft:#F2E6D0;
  --accent:#1064C8; --accent-soft:#D7E8FF; --on-accent:#FFFFFF;
  --ok:#1C7A46; --warn:#8A5300; --crit:#C42132;
  --ok-bg:#E2F6E7; --warn-bg:#FBE8C0; --crit-bg:#FCDCDC;
  --mk:#B4356B; --ak:#3F7A3A; --hs:#AE5114; --ue:#4F46C4; --ds:#82662A; --mia:#3D5AB5; --gen:#546A72;
  --shadow:0 2px 0 #E8D6B6, 0 10px 18px -14px rgba(27,33,65,.45);
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.brand b{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
.brand span{font-family:var(--font-data);font-size:11px;color:var(--fg-dim);letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;padding:9px 11px;border-radius:8px;cursor:pointer;color:var(--fg-dim);font-family:var(--font-display);font-size:14.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.nav .cnt{font-family:var(--font-data);font-size:11px;letter-spacing:0;opacity:.75;font-weight:400;text-transform:none}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px}
.themebtn{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px;cursor:pointer;font-size:12.5px;color:var(--fg-dim)}
.themebtn:hover{border-color:var(--accent);color:var(--fg)}
.syncbtn{font-family:var(--font-display);letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--fg)}
.syncbtn.pend{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button[disabled]{opacity:.45;cursor:not-allowed}
code{font-family:var(--font-data);font-size:.88em;background:var(--surface-3);padding:1px 5px;border-radius:4px;word-break:break-all}

main{padding:26px 30px 90px;max-width:1120px;width:100%}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,3.6vw,36px);letter-spacing:.03em;text-transform:uppercase;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--fg-dim);margin:0 0 22px;font-size:14.5px;max-width:66ch}
h2{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.07em;text-transform:uppercase;margin:0}
.eyebrow{font-family:var(--font-data);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-faint)}

/* ---------- card / stub ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card-hd{position:relative;padding:14px 16px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-hd::after{content:"";position:absolute;left:16px;right:16px;bottom:0;border-bottom:2px dashed var(--line)}
.card-hd::before{content:"";position:absolute;left:-8px;right:-8px;bottom:-8px;height:16px;background:
   radial-gradient(circle 8px at 0 50%, var(--paper) 98%, transparent 100%),
   radial-gradient(circle 8px at 100% 50%, var(--paper) 98%, transparent 100%);
  pointer-events:none}
.card-bd{padding:14px 16px 16px}
.grid{display:grid;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ---------- inputs ---------- */
input[type=text],input[type=date],input[type=number],select,textarea{
  background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
input[type=number]{font-family:var(--font-data);text-align:right;font-variant-numeric:tabular-nums}
textarea{resize:vertical;font-size:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--fg-dim);min-width:0}
label.f>span{font-family:var(--font-data);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:7px;padding:8px 14px;cursor:pointer;font-family:var(--font-display);font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface-2);color:var(--fg-dim);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--fg);border-color:var(--accent);filter:none}
.btn.sm{padding:5px 10px;font-size:12px}
.del{background:none;border:0;color:var(--fg-faint);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:15px;line-height:1}
.del:hover{color:var(--crit);background:var(--crit-bg)}

/* ---------- checkbox item ---------- */
.item{display:flex;gap:11px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line-soft)}
.item:last-child{border-bottom:0}
.item input[type=checkbox]{appearance:none;flex:0 0 19px;width:19px;height:19px;margin-top:2px;border:2px solid var(--line);border-radius:5px;background:var(--surface-2);cursor:pointer;position:relative;transition:background .15s,border-color .15s}
.item input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.item input[type=checkbox]:checked::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
.item .txt{flex:1;min-width:0}
.item .txt b{font-weight:600;font-size:14.5px}
.item .txt p{margin:2px 0 0;font-size:13px;color:var(--fg-dim);text-wrap:pretty}
.item.done .txt b,.item.done .txt p{text-decoration:line-through;color:var(--fg-faint)}
.item.done input[type=checkbox]+.txt{opacity:.62}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-data);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2.5px 7px;border-radius:999px;border:1px solid;white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.pill.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.pill.crit{color:var(--crit);border-color:var(--crit);background:var(--crit-bg)}
.pill.neutral{color:var(--fg-dim);border-color:var(--line);background:var(--surface-2)}
.pill.accent{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.linkpill{text-decoration:none;cursor:pointer}
.linkpill:hover{color:var(--accent);border-color:var(--accent)}

.zonemap{width:100%;max-width:420px;display:block;margin:0 auto;font-family:var(--font-display)}
.zonebubble{cursor:pointer}
.zonebubble circle:first-of-type{fill:var(--c);fill-opacity:.14;stroke:var(--c);stroke-width:1.5;transition:fill-opacity .15s}
.zonebubble:hover circle:first-of-type,.zonebubble:focus-visible circle:first-of-type{fill-opacity:.32}
.zonecount{text-anchor:middle;dominant-baseline:middle;fill:var(--c);font-size:15px;font-weight:700}
.zonelabel{text-anchor:middle;fill:var(--fg-dim);font-size:9.5px;letter-spacing:.03em;text-transform:uppercase}
.zonebubble:focus-visible{outline:none}
.zonebubble:focus-visible circle:first-of-type{stroke-width:3}

.mapembed-wrap{margin-top:4px}
.mapembed{width:100%;border:1px solid var(--line);border-radius:8px;display:block;background:var(--surface-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) iframe.mapembed{filter:invert(92%) hue-rotate(180deg) contrast(90%)}}
:root[data-theme="dark"] iframe.mapembed{filter:invert(92%) hue-rotate(180deg) contrast(90%)}
.mapembed-empty{display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-size:12.5px;color:var(--fg-dim);text-wrap:pretty}
.mapembed-empty > span{display:block}
.mapembed-empty b{color:var(--fg)}

/* ---------- park color coding ---------- */
.pk{--c:var(--gen)}
.pk-mk{--c:var(--mk)} .pk-ak{--c:var(--ak)} .pk-hs{--c:var(--hs)} .pk-ue{--c:var(--ue)}
.pk-ds{--c:var(--ds)} .pk-mia{--c:var(--mia)} .pk-off{--c:var(--gen)} .pk-none{--c:var(--gen)}
.parktag{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--c)}
.parktag::before{content:"";width:11px;height:11px;border-radius:3px;background:var(--c);flex:none}
.parkbar{height:5px;background:var(--c)}

.parkicon{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;
  background:var(--surface);border:1.5px solid var(--line-soft);color:var(--c)}
.parkicon svg{width:60%;height:60%;display:block}
.parkicon.xs{width:20px;height:20px;border-width:1px}
.parkicon.sm{width:28px;height:28px}
.parkicon.lg{width:58px;height:58px;border-width:2px;box-shadow:var(--shadow)}
.chip.pkchip{display:inline-flex;align-items:center;gap:7px}
.chip.pkchip[aria-pressed="true"] .parkicon{background:rgba(255,255,255,.22);border-color:transparent;color:inherit}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow)}
.stat .k{font-family:var(--font-data);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--fg-faint)}
.stat .v{font-family:var(--font-display);font-size:29px;font-weight:700;letter-spacing:.01em;line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .n{font-size:12.5px;color:var(--fg-dim);margin-top:1px}
.bar{height:7px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.bar.c-ok i{background:var(--ok)} .bar.c-warn i{background:var(--warn)} .bar.c-crit i{background:var(--crit)}

/* ---------- tables ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-family:var(--font-data);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-faint);text-align:left;padding:7px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap;font-weight:400}
td{padding:6px 8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
td.num,th.num{text-align:right;font-family:var(--font-data);font-variant-numeric:tabular-nums}
tfoot td{border-bottom:0;border-top:2px solid var(--line);font-weight:700;padding-top:10px}
tbody tr.done td{opacity:.5}
table input[type=text]{background:transparent;border:1px solid transparent;padding:4px 6px}
table input[type=text]:hover{border-color:var(--line-soft)}
table input[type=text]:focus{background:var(--surface-2);border-color:var(--line)}
table input[type=number]{background:transparent;border:1px solid transparent;padding:4px 6px;max-width:104px}
table input[type=number]:hover{border-color:var(--line-soft)}
table input[type=number]:focus{background:var(--surface-2);border-color:var(--line)}
table select{background:transparent;border:1px solid transparent;padding:4px 4px;font-size:13px}
table select:hover{border-color:var(--line-soft)}

/* ---------- filters ---------- */
.filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;font-family:var(--font-display);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-dim)}
.chip:hover{border-color:var(--accent);color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--paper);border-color:var(--fg)}
.chip.pkchip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
:root[data-theme="dark"] .chip.pkchip[aria-pressed="true"],
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0F1F29}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0F1F29}}

/* ---------- day cards ---------- */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:13px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.day-hd{padding:11px 13px 9px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.day-hd .dt{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.day-hd .wd{font-family:var(--font-data);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--fg-faint)}
.day-bd{padding:0 13px 13px;display:flex;flex-direction:column;gap:9px}
.day-bd select{font-family:var(--font-display);letter-spacing:.05em;text-transform:uppercase;font-size:13px;color:var(--c);font-weight:600}

.dayitems{display:flex;flex-direction:column;gap:6px}
.dayitem{display:grid;grid-template-columns:84px 1fr 26px;gap:6px;align-items:center}
.dayitem input[type=time]{font-family:var(--font-data);font-size:12.5px;padding:6px 5px;text-align:center}
.dayitem input[type=text]{font-size:13px;padding:6px 8px}
.dayitem-add{margin-top:2px}
.dayitem-add input,.dayitem-add .btn{opacity:.85}
.dayitem-dining{background:var(--accent-soft);border-radius:6px;padding:0 0 0 2px}
.dayitem-name{font-size:13px;padding:6px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayitem-add .btn{padding:6px 0;font-size:15px;line-height:1}

/* ---------- attractions ---------- */
.attr{display:flex;gap:11px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line-soft)}
.attr:last-child{border-bottom:0}
.attr .txt{flex:1;min-width:0}
.attr .txt b{font-size:14.5px;font-weight:600}
.attr .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.attr .land{font-family:var(--font-data);font-size:11px;color:var(--fg-faint);letter-spacing:.03em}
.attr.done .txt b{text-decoration:line-through;color:var(--fg-faint)}
.attr input[type=checkbox]{appearance:none;flex:0 0 19px;width:19px;height:19px;margin-top:2px;border:2px solid var(--line);border-radius:5px;background:var(--surface-2);cursor:pointer;position:relative}
.attr input[type=checkbox]:checked{background:var(--c);border-color:var(--c)}
.attr input[type=checkbox]:checked::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}

.note{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px;font-size:13.5px;color:var(--fg);text-wrap:pretty}
.note b{font-family:var(--font-display);letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.warnbox{background:var(--warn-bg);border:1px solid var(--warn);border-radius:var(--r);padding:12px 14px;font-size:13.5px;text-wrap:pretty}
.warnbox b{font-family:var(--font-display);letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--warn)}

.bottomnav{display:none}

/* ---------- capa ---------- */
.capa{position:relative;border-radius:var(--r);overflow:hidden;margin:0 0 18px;box-shadow:var(--shadow)}
.capa svg{display:block;width:100%;height:clamp(196px,48vw,290px)}
/* Degradê atrás da contagem: sem ele o texto claro cai em cima do gramado
   claro e some. A ilustração mantém as cores próprias nos dois temas. */
.capa::after{
  content:"";position:absolute;inset:auto 0 0 0;height:58%;pointer-events:none;
  background:linear-gradient(to top, rgba(18,12,38,.82) 0%, rgba(18,12,38,.45) 45%, rgba(18,12,38,0) 100%);
}
/* Alinhado à direita de propósito: à esquerda a contagem cobria a família,
   que é justamente a parte da ilustração que interessa. */
.capa-txt{
  position:absolute;left:18px;right:18px;bottom:15px;z-index:1;
  display:flex;flex-direction:column;align-items:flex-end;text-align:right;
  line-height:1;color:#FFF6E8;text-shadow:0 1px 6px rgba(20,15,40,.5);
}
.capa-n{font-family:var(--font-display);font-size:clamp(40px,11vw,60px);font-weight:700;letter-spacing:-.02em}
.capa-l{font-size:13px;font-weight:600;margin-top:5px;opacity:.95}

/* ---------- ícones das abas ---------- */
.ico{width:20px;height:20px;flex:0 0 auto;fill:currentColor}
.nav button .lbl{display:flex;align-items:center;gap:9px}
.bottomnav button{display:flex;flex-direction:column;align-items:center;gap:2px}
.bottomnav .ico{width:22px;height:22px}

/* ---------- linha de reserva ---------- */
.dinrow{display:grid;gap:6px;grid-template-columns:1fr 1fr;align-items:center}
.dinrow .wide{grid-column:1/-1}
@media (max-width:700px){
  /* dois campos por linha num iPhone truncam tudo: uma coluna só */
  .dinrow{grid-template-columns:1fr}
  .dinrow .wide{grid-column:auto}
}

/* ---------- tabela vira card no celular ----------
   Abaixo de 700px a tabela de 8 colunas não cabe num iPhone de 390px: cada
   linha vira um cartão com rótulo por campo, e o scroll lateral acaba. Os
   data-* e os handlers não mudam — só o desenho. */
@media (max-width:700px){
  .tw{overflow-x:visible}
  table{min-width:0;display:block}
  thead{display:none}
  tbody,tfoot{display:block}
  tbody tr{
    display:grid;grid-template-columns:84px minmax(0,1fr);gap:3px 10px;align-items:center;
    padding:11px 38px 11px 13px;margin-bottom:9px;position:relative;
    background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r);
  }
  tbody td{display:contents}
  tbody td::before{
    content:attr(data-l);
    font-family:var(--font-data);font-size:10px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--fg-faint);line-height:1.25;
  }
  tbody td > *{width:100%;min-width:0}
  /* valor colado no rótulo, não jogado na borda oposta do cartão */
  tbody td.num,
  tbody td.num input,
  tbody td.num select{text-align:left}
  tbody td input[type=text],
  tbody td input[type=number],
  tbody td select{border-color:var(--line-soft);background:var(--surface);padding:6px 8px}
  /* a célula sem rótulo é o botão de apagar: vai para o canto do cartão em vez
     de ocupar uma linha inteira */
  tbody td:not([data-l]){display:block;position:absolute;top:8px;right:8px;width:auto}
  tbody td:not([data-l])::before{content:none}
  tbody td:not([data-l]) > *{width:auto}
  tbody tr.done{opacity:1}
  tbody tr.done td[data-l="Item"] > *{opacity:.5;text-decoration:line-through}
  tfoot tr{display:flex;justify-content:space-between;gap:10px;padding:11px 13px}
  tfoot td{border:0;padding:0}
  table input[type=number]{max-width:none}
}

/* ---------- mobile ---------- */
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  main{padding:18px 15px 96px}
  .bottomnav{display:block;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav .inner{display:flex;gap:2px;padding:5px 6px}
  .bottomnav button{flex:1 1 0;min-width:0;background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--fg-dim);font-family:var(--font-display);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
  .bottomnav button[aria-current="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
  .mobhd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
  .mobhd .brand b{font-size:17px}
}
@media (min-width:861px){.mobhd{display:none}}

/* Roteiro real: voo (e chegada) fixam os dois primeiros dias e o embarque de
   volta fixa os dois últimos; só o miolo em Orlando é distribuído. Função pura
   (não toca em S) para poder rodar tanto no seed() quanto no botão da tela,
   e ser testável sem estado global. Retorna null se a janela for curta demais.
   Depende só de daysRange/d/iso (declaradas mais abaixo, mas hoisted) e de
   PARKS acima — nunca de S, que ainda não existe quando o seed() chama isto. */
function sugerirRoteiro(trip){
  const days = daysRange(trip.start, trip.end);
  const n = days.length;
  if(n < 6) return null;

  const plano = {};
  plano[days[0]] = {park:"none",
    notes:"Voo internacional (madrugada, saindo do Brasil). Sem compromisso na Flórida ainda — dia de embarque."};
  plano[days[1]] = {park:"off",
    notes:"Pouso em Miami às 7h. Retirar o carro alugado, instalar as cadeirinhas e seguir direto para Orlando (~3h40 de estrada). Chegando: check-in, mercado e descanso — sem parque hoje."};

  const backIdx = n-3, miamiIdx = n-2, lastIdx = n-1;
  plano[days[backIdx]] = {park:"off",
    notes:"Orlando → Miami (~3h40 de estrada). Devolver o carro ou deixar para o dia seguinte, conforme a reserva."};
  plano[days[miamiIdx]] = {park:"mia",
    notes:"Dia inteiro em Miami — praia e descanso, sem pressa nenhuma."};
  plano[days[lastIdx]] = {park:"mia",
    notes:"Voo de volta às 19h. Aproveitem a manhã em Miami e saiam para o aeroporto com pelo menos 3h de folga — voo internacional pede check-in antecipado."};

  /* Os quatro parques espalhados pelos dias de Orlando; o que sobra vira
     descanso. Posicional em vez de ciclo fixo: um ciclo pode deixar o Epic
     Universe de fora dependendo de quantos dias cabem no miolo. */
  const PARQUES = ["mk","hs","ak","ue"];
  const orlandoIdx = [];
  for(let i = 2; i < backIdx; i++) orlandoIdx.push(i);
  const m = orlandoIdx.length;
  const cabem = Math.min(PARQUES.length, m);

  const parkNaPos = {};
  for(let i = 0; i < cabem; i++){
    const pos = cabem === 1 ? 0 : Math.round(i * (m-1) / (cabem-1));
    parkNaPos[pos] = PARQUES[i];
  }

  const folga = ["none","ds"];
  let f = 0;
  orlandoIdx.forEach((idx, pos) => {
    const p = parkNaPos[pos] || folga[f++ % folga.length];
    plano[days[idx]] = {park:p, notes:ROTEIRO_NOTAS[p] || ""};
  });

  const foraDoRoteiro = PARQUES.slice(cabem);
  if(foraDoRoteiro.length){
    plano[days[lastIdx]].notes += ` ATENÇÃO: não coube no roteiro — ${foraDoRoteiro.map(p => PARKS[p].n).join(", ")}. Adicione mais dias em Orlando.`;
  }

  return plano;
}

let S;
try{
  const raw = localStorage.getItem(KEY);
  S = raw ? Object.assign(seed(), JSON.parse(raw)) : seed();
}catch(e){ S = seed(); }

if(!S.device) S.device = navigator.platform && /iphone|ipad|android/i.test(navigator.userAgent) ? "Celular" : "Computador";

let saveTimer;
/* bump=false para mudanças só de interface (aba, filtro): não conta como
   alteração de dado e portanto não dispara conflito de sincronização. */
function save(bump){
  if(bump !== false){
    /* Carimba comparando com o retrato tirado antes do handler rodar. Um lugar
       só em vez de 25: pega também aplicarSugestao, limparRoteiro e reset, que
       trocam o state em bloco. */
    if(retratoAntes) carimbar(retratoAntes);
    S.updatedAt = Date.now();
  }
  clearTimeout(saveTimer);
  const el = document.getElementById("saveState");
  if(el) el.textContent = "salvando…";
  saveTimer = setTimeout(() => {
    try{
      localStorage.setItem(KEY, JSON.stringify(S));
      if(el) el.textContent = rotuloSalvo();
    }catch(e){ if(el) el.textContent = "erro ao salvar"; }
  }, 300);
}

const pendente = () => !!S.sync.url && S.updatedAt > (S.lastSync||0);

/* ---------- rede e rótulo de estado (F3) ----------
   O mesmo arquivo abre no navegador do computador, então tudo que é nativo
   passa por esta guarda e degrada para o comportamento web. */
const NATIVE = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());

let comRede = navigator.onLine !== false;

/* Quatro estados, sempre com texto além da cor. */
function rotuloSalvo(){
  if(sincronizando) return "sincronizando…";
  if(!pendente())   return "salvo";
  return comRede ? "salvo · sync pendente" : "salvo · offline";
}
function rotuloBotao(curto){
  if(!S.sync.url) return curto ? "Sync" : "Configurar sync";
  if(sincronizando) return curto ? "Sync…" : "Sincronizando…";
  if(!comRede && pendente()) return curto ? "Off •" : "Offline •";
  if(!comRede) return curto ? "Off" : "Offline";
  return pendente() ? (curto ? "Sync •" : "Sincronizar •") : (curto ? "Sync" : "Sincronizar");
}

function d(iso){ const [y,m,dd] = iso.split("-").map(Number); return new Date(y, m-1, dd); }
function iso(dt){ return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); }
function today(){ const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function diffDays(a,b){ return Math.round((b-a)/86400000); }

function daysRange(startIso, endIso){
  const out = [];
  const a = d(startIso), b = d(endIso);
  if(isNaN(a) || isNaN(b) || b < a) return out;
  for(let cur = new Date(a); cur <= b && out.length < 60; cur.setDate(cur.getDate()+1)) out.push(iso(cur));
  return out;
}

function tripDays(){
  return daysRange(S.trip.start, S.trip.end);
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* Busca em vez de link direto: com 130+ atrações, um endereço oficial
   inventado ou desatualizado é pior que nenhum link. Isto sempre resolve. */
function attrLink(nome, parqueNome){
  return "https://www.google.com/search?q=" + encodeURIComponent(nome + " " + parqueNome + " Orlando");
}

/* Link universal do Google Maps: abre o app no celular, o site no PC —
   sem chave de API. Mesma lógica dos links de "saiba mais". */
function mapUrl(query){ return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(query); }

/* Mapa embutido de verdade — Maps Embed API oficial do Google, que exige
   uma chave (gratuita, com cota generosa). O truque antigo sem chave
   (output=embed) foi bloqueado pelo Google ("This content is blocked") e
   não é mais confiável. A chave fica só neste aparelho (aba Backup), igual
   à chave do sync — nunca entra no payload nem no código de transferência.
   Um único local vira um pino (endpoint /place); dois ou mais viram uma
   rota com pino em cada parada (endpoint /directions). Confirmado pelo
   console do navegador: o Artifact publicado no claude.ai barra QUALQUER
   iframe externo — "frame-src 'self' blob: data:" — então o mapa nunca
   vai aparecer ali, com chave válida ou não; isso não tem conserto por
   configuração de chave, só hospedando o arquivo fora do claude.ai. Por
   isso todo embed vem com um link "abrir no Maps" sem chave, que funciona
   sempre — dentro ou fora do Artifact. O checklist de configuração da
   chave (aba Backup) só se aplica quando já se está fora do claude.ai. */
const MAX_MAP_STOPS = 9;

function mapEmbedUrl(stops, key){
  if(!key) return "";
  const base = "https://www.google.com/maps/embed/v1/";
  if(stops.length === 1){
    return base + "place?key=" + encodeURIComponent(key) + "&q=" + encodeURIComponent(stops[0]);
  }
  const meio = stops.slice(1, -1);
  return base + "directions?key=" + encodeURIComponent(key) +
    "&origin=" + encodeURIComponent(stops[0]) +
    "&destination=" + encodeURIComponent(stops[stops.length-1]) +
    (meio.length ? "&waypoints=" + meio.map(encodeURIComponent).join("|") : "");
}
function mapDirLinkFromStops(stops){
  if(stops.length === 1) return mapUrl(stops[0]);
  const meio = stops.slice(1, -1);
  return "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(stops[0]) +
    "&destination=" + encodeURIComponent(stops[stops.length-1]) +
    (meio.length ? "&waypoints=" + meio.map(encodeURIComponent).join("|") : "");
}
function mapEmbedBlock(stopsIn, opts){
  const stops = stopsIn.filter(Boolean);
  if(!stops.length) return "";
  const cortadas = Math.max(0, stops.length - MAX_MAP_STOPS);
  const usaveis = cortadas ? stops.slice(0, MAX_MAP_STOPS) : stops;
  const height = (opts && opts.height) || 220;
  const label = (opts && opts.label) || "mapa";
  const key = S.mapsKey;
  return `<div class="mapembed-wrap">
    ${key
      ? `<iframe class="mapembed" style="height:${height}px" src="${mapEmbedUrl(usaveis, key)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="${esc(label)}"></iframe>`
      : `<div class="mapembed mapembed-empty" style="height:${Math.min(height,110)}px"><span>Configure sua chave gratuita do Google Maps em <b>Ajustes</b> para ver o mapa aqui. Enquanto isso, use o link “abrir no Google Maps” logo abaixo — ele não depende de chave nenhuma.</span></div>`}
    <div class="row" style="margin-top:7px;gap:8px">
      <a class="pill neutral linkpill" href="${mapDirLinkFromStops(stops)}" target="_blank" rel="noopener noreferrer">abrir no Google Maps ↗</a>
      <span class="eyebrow">se o mapa não aparecer acima, use este link — no claude.ai publicado, é sempre o caminho certo</span>
    </div>
    ${cortadas ? `<p style="font-size:12px;color:var(--fg-faint);margin:6px 0 0">+${cortadas} local(is) marcados não coube${cortadas===1?"":"ram"} no mapa (limite do link de rota) — continuam na lista abaixo.</p>` : ""}
  </div>`;
}

/* Locais marcados (checkbox) dentro de um parque/pseudo-parque, formatados
   para busca no Maps. Reaproveitado pelo mapa do dia e pelo mapa do parque. */
function checkedStops(pk){
  const list = ATTR[pk] || [];
  const sufixo = (pk === "mia" || pk === "off") ? ", FL" : " Orlando FL";
  return list.filter((a,i) => S.checks[attrId(pk,i,a[0])]).map(a => a[0] + " " + PARKS[pk].n + sufixo);
}

/* Paradas do dia para o mapa do roteiro: hotel da cidade certa, o próprio
   parque, e os itens que a família cadastrou para o dia — em ordem de
   horário, que é o "alinhados" que faz o mapa desenhar a rota do dia na
   sequência certa. Nos dias de estrada, os itens vêm depois da rota
   Miami↔Orlando; no dia de voo, só os itens contam (não há base fixa). */
function dayItemsSorted(items){
  return (items||[]).filter(i => i.nome && i.nome.trim())
    .slice().sort((a,b) => (a.hora||"99:99").localeCompare(b.hora||"99:99"));
}
function dayStops(pk, notes, items){
  const nomes = dayItemsSorted(items);
  if(pk === "off"){
    const base = [];
    if(/Orlando\s*→\s*Miami/.test(notes)) base.push("Orlando, FL", "Miami International Airport, FL");
    else if(/para Orlando/.test(notes)) base.push("Miami International Airport, FL", "Orlando, FL");
    return base.concat(nomes.map(i => i.nome + " Orlando FL"));
  }
  if(pk === "none") return nomes.map(i => i.nome);

  const stops = [];
  const cidade = pk === "mia" ? "miami" : "orlando";
  const hotel = S.hotels.find(h => (h.cidade||"").toLowerCase().includes(cidade));
  if(hotel && (hotel.endereco || hotel.nome)) stops.push(hotel.endereco || (hotel.nome + " " + hotel.cidade));
  stops.push(PARKS[pk].n + (pk === "mia" ? ", FL" : " Orlando FL"));
  const sufixo = pk === "mia" ? " Miami FL" : " Orlando FL";
  stops.push(...nomes.map(i => i.nome + sufixo));
  return stops;
}

/* Ponte entre Restaurantes e o roteiro: uma reserva com dia atribuído
   entra sozinha na programação daquele dia, lado a lado com os itens
   manuais — sem duplicar cadastro em dois lugares. */
function diningForDay(dt){
  return S.dining.filter(r => r.dia === dt && r.nome && r.nome.trim());
}
function mergedDayItems(dt, day){
  const manuais = (day.items || []).map(it => ({id:it.id, hora:it.hora, nome:it.nome, fonte:"item"}));
  const reservas = diningForDay(dt).map(r => ({id:r.id, hora:r.hora, nome:r.nome, fonte:"dining"}));
  return dayItemsSorted(manuais.concat(reservas));
}

function landId(pk, land){ return "land-" + pk + "-" + land.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-"); }

/* Mapa esquemático das áreas de um parque — bolhas ligadas ao centro,
   não uma planta real (não temos coordenadas oficiais e não vamos fingir
   que temos). O raio de cada bolha cresce com o número de atrações. */
function zoneMap(pk){
  const list = ATTR[pk];
  const lands = [];
  list.forEach(a => { if(!lands.includes(a[1])) lands.push(a[1]); });
  const n = lands.length;
  const cx = 180, cy = 130, R = n <= 4 ? 74 : 96;
  const nodes = lands.map((land, i) => {
    const count = list.filter(a => a[1] === land).length;
    const ang = (i / n) * Math.PI * 2 - Math.PI / 2;
    return { land, count, x: cx + R * Math.cos(ang), y: cy + R * Math.sin(ang), r: 15 + Math.min(13, count * 1.4) };
  });
  const lines = nodes.map(nd => `<line x1="${cx}" y1="${cy}" x2="${nd.x.toFixed(1)}" y2="${nd.y.toFixed(1)}" stroke="var(--line)" stroke-width="2"/>`).join("");
  const hub = `<circle cx="${cx}" cy="${cy}" r="15" fill="var(--c)" opacity=".16"/><circle cx="${cx}" cy="${cy}" r="5" fill="var(--c)"/>`;
  const bubbles = nodes.map(nd => `
    <g class="zonebubble" tabindex="0" role="button" data-act="gotoLand" data-park="${pk}" data-land="${landId(pk, nd.land)}">
      <title>${esc(nd.land)} — ${nd.count} atraç${nd.count===1?"ão":"ões"}</title>
      <circle cx="${nd.x.toFixed(1)}" cy="${nd.y.toFixed(1)}" r="${nd.r}"/>
      <text x="${nd.x.toFixed(1)}" y="${nd.y.toFixed(1)}" class="zonecount">${nd.count}</text>
      <text x="${nd.x.toFixed(1)}" y="${(nd.y + nd.r + 13).toFixed(1)}" class="zonelabel">${esc(nd.land)}</text>
    </g>`).join("");
  return `<svg viewBox="0 0 360 235" class="zonemap">${lines}${hub}${bubbles}</svg>`;
}

function checkId(kind, a, b){ return kind + "|" + a + "|" + b; }

function allCheckItems(){
  return CHECK.map((c,i) => ({id:checkId("ck", i, c[1]), grupo:c[0], titulo:c[1], det:c[2], custom:false}))
    .concat(S.extraCheck.map(x => ({id:x.id, grupo:x.grupo, titulo:x.titulo, det:"", custom:true})));
}

function progress(ids){
  const done = ids.filter(i => S.checks[i]).length;
  return {done, total:ids.length, pct: ids.length ? Math.round(done/ids.length*100) : 0};
}

function attrId(pk, i, nome){ return checkId("at", pk + i, nome); }

const kids = () => S.family.filter(f => f.tipo !== "adulto");

/* Retorna estado de altura para uma atração: null (livre) ou lista por criança */
function heightInfo(minCm){
  if(!minCm) return null;
  return kids().map(k => ({nome:k.nome, ok:(k.altura||0) >= minCm, falta: Math.max(0, minCm - (k.altura||0))}));
}

      <div class="stat">
        <div class="k">Dias de parque</div>
        <div class="v">${parkDays}<span style="font-size:18px">/4</span></div>
        <div class="n">de ${days.length} dias de viagem</div>
      </div>
      <div class="stat">
        <div class="k">Orçamento previsto</div>
        <div class="v" style="font-size:23px">${brl(orcBRL)}</div>
        <div class="n">gasto lançado: ${brl(realBRL)}</div>
      </div>
    </div>

    ${urgente ? `<div class="warnbox">
      <b>Faltam ${falta} dias — prioridade agora</b>
      <p style="margin:6px 0 0">${docNow.length ? `<b style="color:inherit;font-family:inherit;text-transform:none;letter-spacing:0">${docNow.length} item(ns) de documento</b> ainda em aberto. ` : ""}${planNow.length ? `<b style="color:inherit;font-family:inherit;text-transform:none;letter-spacing:0">${planNow.length} item(ns) de janela de tempo da Disney</b> pendentes — alguns têm prazo fixo (Lightning Lane, check-in do hotel, check-in do voo).` : ""}</p>
    </div>` : ""}

    <div class="note">
      <b>Por que este roteiro alterna parque e descanso</b>
      <p style="margin:6px 0 0">Fim de agosto na Flórida é calor alto com umidade e chuva quase todo fim de tarde. Com 4 anos e 1a10m o que funciona é: entrar na abertura, sair por volta das 13h, dormir e piscina no hotel, e voltar à noite só se ainda houver energia. Tentar ficar o dia inteiro derruba a família no dia seguinte. Some a isso os dois trechos de estrada entre Miami e Orlando, que consomem um dia cada, e sobram quatro dias de parque em dez de viagem — que é exatamente o desenho do roteiro sugerido.</p>
    </div>

  </div>`;
}

function viewChecklist(){
  const items = allCheckItems();
  const grupos = [];
  items.forEach(i => { if(!grupos.includes(i.grupo)) grupos.push(i.grupo); });

  return `
  <h1>Checklist pré-viagem</h1>
  <p class="sub">Organizado por natureza da tarefa, não por data — mas os itens de <b>janela de tempo da Disney</b> têm prazo fixo e são os que travam a viagem se passarem.</p>

  <div class="stack">
  ${grupos.map(g => {
    const its = items.filter(i => i.grupo === g);
    const p = progress(its.map(i => i.id));
    const cls = p.pct === 100 ? "ok" : p.pct >= 50 ? "warn" : "crit";
    return `
    <div class="card">
      <div class="card-hd">
        <h2>${esc(g)}</h2>
        <span class="pill ${cls}">${p.done}/${p.total}</span>
      </div>
      <div class="card-bd">
        <div class="bar c-${cls}" style="margin:0 0 8px"><i style="width:${p.pct}%"></i></div>
        ${its.map(i => `
          <label class="item ${S.checks[i.id]?"done":""}">
            <input type="checkbox" data-check="${esc(i.id)}" ${S.checks[i.id]?"checked":""}>
            <span class="txt">
              <b>${esc(i.titulo)}</b>
              ${i.det ? `<p>${esc(i.det)}</p>` : ""}
            </span>
            ${i.custom ? `<button class="del" type="button" data-act="delCheck" data-id="${esc(i.id)}" aria-label="Remover">×</button>` : ""}

        <div class="row" style="margin-top:12px">

function viewRoteiro(){
  const days = tripDays();
  if(!days.length) return `<h1>Roteiro</h1><p class="sub">Defina as datas de ida e volta em <b>Ajustes › Viagem</b>.</p>`;
  const marcadas = S.dining.filter(r => r.done).length;
  const cab = `<h1>Roteiro</h1>` + barraSeg("roteiro", {reservas: marcadas + "/" + S.dining.length});
  return cab + (segAtual("roteiro") === "reservas" ? roteiroReservas(days) : roteiroDias(days));
}

function roteiroDias(days){

  const t = iso(today());
  const opts = Object.keys(PARKS);
  return `
  <p class="sub">${days.length} dias: voo na madrugada de 23/08, pouso em Miami às 7h de 24/08 e direto para Orlando de carro, quatro parques com descanso entre eles, volta a Miami em 30/08 e voo de volta às 19h de 01/09. Clique em <b>Aplicar sugestão</b> para preencher com esse plano e depois ajuste à vontade.</p>

  <div class="row" style="margin-bottom:16px">
    <button class="btn" type="button" data-act="sugestao">Aplicar sugestão</button>
    <button class="btn ghost" type="button" data-act="limparRoteiro">Limpar roteiro</button>
  </div>

  <div class="days">
    ${days.map((dt,idx) => {
      const day = S.days[dt] || {};
      const p = parkOf(day.park || "none");
      const dd = d(dt);
      const itens = mergedDayItems(dt, day);
      const sugestoes = [...new Set([...(ATTR[p]||[]).map(a=>a[0]), ...S.dining.map(r=>r.nome)])].filter(Boolean);
      return `
      <div class="day pk ${PARKS[p].cls} ${dt===t?"today":""}">
        <div class="parkbar"></div>
        <div class="day-hd">
          <span class="row" style="gap:9px">
            <span class="parkicon sm">${parkIconSvg(p)}</span>
            <span><span class="dt" style="display:block">${String(dd.getDate()).padStart(2,"0")} ${MO[dd.getMonth()]}</span>
            <span class="wd">${WD[dd.getDay()]}${dt===t?" · hoje":""} · d${idx+1}</span></span>
          </span>
        </div>
        <div class="day-bd">
          <select data-day="${dt}" data-k="park" aria-label="Parque do dia ${dt}">
            ${opts.map(o => `<option value="${o}" ${p===o?"selected":""}>${PARKS[o].n}</option>`).join("")}
          </select>

          <div class="f"><span>Programação do dia</span>
            <datalist id="sug-${dt}">${sugestoes.map(s => `<option value="${esc(s)}">`).join("")}</datalist>
            <div class="dayitems">
              ${itens.map(it => it.fonte === "dining" ? `
                <div class="dayitem dayitem-dining">
                  <input type="time" data-din="${it.id}" data-k="hora" value="${esc(it.hora||"")}" aria-label="Horário da reserva">
                  <span class="dayitem-name"><span class="pill accent" style="margin-right:6px">restaurante</span>${esc(it.nome)}</span>
                  <button class="del" type="button" data-act="unassignDining" data-id="${it.id}" aria-label="Tirar deste dia" title="Tirar deste dia (continua em Restaurantes)">×</button>
                </div>` : `
                <div class="dayitem">
                  <input type="time" data-item="${dt}|${it.id}" data-k="hora" value="${esc(it.hora||"")}" aria-label="Horário">
                  <input type="text" data-item="${dt}|${it.id}" data-k="nome" value="${esc(it.nome)}" list="sug-${dt}" aria-label="Programa">
                  <button class="del" type="button" data-act="delItem" data-dt="${dt}" data-id="${it.id}" aria-label="Remover">×</button>
                </div>`).join("")}
              <div class="dayitem dayitem-add">
                <input type="time" data-newitemtime="${dt}" aria-label="Horário do novo item">
                <input type="text" data-newitemname="${dt}" list="sug-${dt}" placeholder="parque, atração, passeio…" aria-label="Nome do novo item">
                <button class="btn ghost sm" type="button" data-act="addItem" data-dt="${dt}">+</button>
              </div>
            </div>
            <p style="font-size:12px;color:var(--fg-faint);margin:6px 0 0">Restaurantes com dia marcado em <b>Roteiro › Reservas</b> entram aqui sozinhos.</p>
          </div>

          <label class="f"><span>Notas do dia</span>
            <textarea rows="2" data-day="${dt}" data-k="notes" placeholder="rope drop, o que levar, hora de sair…">${esc(day.notes||"")}</textarea></label>
          ${mapEmbedBlock(dayStops(p, day.notes||"", itens), {height:190, label:"Mapa do dia " + (idx+1)})}
        </div>
      </div>`;
    }).join("")}
  </div>

  `;
}

      ${mapEmbedBlock(S.dining.filter(r => r.nome).map(r => r.nome + " " + (r.local||"") + " Orlando FL"), {height:230, label:"Todos os restaurantes"})}

        <div class="item ${r.done?"done":""}" style="align-items:center">
          <input type="checkbox" data-dinchk="${r.id}" ${r.done?"checked":""} aria-label="Reservado">

            </select>
            <input type="time" data-din="${r.id}" data-k="hora" value="${esc(r.hora||"")}" aria-label="Horário da reserva" style="font-family:var(--font-data)">
            <input type="text" data-din="${r.id}" data-k="nota" value="${esc(r.nota)}" placeholder="Nota — quem indicou, preferências…" class="wide">

    <div class="card-bd">
      <p style="font-size:13.5px;color:var(--fg-dim);margin:0 0 10px">Gera um arquivo do Calendário com <b>${construirAgenda(S, Date.now()).length} lembretes</b>: o resumo do dia às 7h em cada dia de viagem, o aviso de abertura da janela de 60 dias, e um alerta 1h antes de cada reserva com horário marcado. Quem toca o alarme é o Calendário do aparelho — funciona sem internet, dentro do parque.</p>
      <p style="font-size:12.5px;color:var(--fg-faint);margin:0">Mande o arquivo para o resto da família no WhatsApp: cada um importa no próprio celular, sem instalar nada. <b>Mudou o roteiro ou o horário de uma reserva? Exporte de novo</b> — reimportar substitui os lembretes antigos em vez de duplicar.</p>
      <p id="icsMsg" style="font-size:13px;margin:10px 0 0"></p>

`;

function viewParques(){
  const pk = ATTR[S.parkFilter] ? S.parkFilter : "mk";
  const list = ATTR[pk];
  const cls = PARKS[pk].cls;

  const filtered = list.filter((a,i) => {
    if(S.onlyPlan && !a[3].includes("P")) return false;
    if(S.onlyKid){
      const hs = heightInfo(a[2]);
      if(hs && !hs.some(h => h.ok)) return false;
    }
    return true;
  });

  const ids = list.map((a,i) => attrId(pk,i,a[0]));
  const p = progress(ids);

  const lands = [];
  filtered.forEach(a => { if(!lands.includes(a[1])) lands.push(a[1]); });

  const planTotal = Object.keys(ATTR).reduce((t,k) =>
    t + ATTR[k].filter(a => a[3].includes("P")).length, 0);

  return `
  <h1>Parques e atrações</h1>
  <p class="sub">Marque o que a família quer fazer. As etiquetas <span class="pill accent">planejar antes</span> são as ${planTotal} coisas que não se resolvem na hora — exigem reserva, compra de fila ou fila virtual no app.</p>

  <div class="filters">
    ${Object.keys(PARKS).filter(k => ATTR[k]).map(k =>
      `<button class="chip pkchip pk ${PARKS[k].cls}" type="button" data-park="${k}" aria-pressed="${pk===k}">
        <span class="parkicon xs">${parkIconSvg(k)}</span>${PARKS[k].n}</button>`).join("")}
  </div>
  <div class="filters">
    <button class="chip" type="button" data-act="tgPlan" aria-pressed="${S.onlyPlan}">Só o que precisa planejar</button>
    <button class="chip" type="button" data-act="tgKid" aria-pressed="${S.onlyKid}">Só o que as crianças pegam</button>
  </div>

  <div class="card pk ${cls}" style="margin-bottom:16px">
    <div class="parkbar"></div>
    <div class="card-hd">
      <span class="row" style="gap:12px"><span class="parkicon sm">${parkIconSvg(pk)}</span><h2>Áreas do parque</h2></span>
      <span class="eyebrow">esquemático — clique numa área</span>
    </div>
    <div class="card-bd">${zoneMap(pk)}</div>
  </div>

  <div class="card pk ${cls}" style="margin-bottom:16px">
    <div class="parkbar"></div>
    <div class="card-hd">
      <span class="row" style="gap:12px"><span class="parkicon sm">${parkIconSvg(pk)}</span><h2>Suas marcadas no mapa</h2></span>
    </div>
    <div class="card-bd">
      ${checkedStops(pk).length
        ? mapEmbedBlock(checkedStops(pk), {height:230, label:"Marcadas em " + PARKS[pk].n})
        : `<p style="color:var(--fg-dim);margin:6px 0;font-size:13.5px">Marque atrações na lista abaixo para elas aparecerem aqui como pinos no mapa.</p>`}
    </div>
  </div>

  <div class="card pk ${cls}">
    <div class="parkbar"></div>
    <div class="card-hd">
      <span class="row" style="gap:12px"><span class="parkicon lg">${parkIconSvg(pk)}</span><h2>${PARKS[pk].n}</h2></span>
      <span class="pill neutral">${p.done}/${p.total} marcadas</span>
    </div>
    <div class="card-bd">
      ${filtered.length === 0 ? `<p style="color:var(--fg-dim);margin:6px 0">Nenhuma atração com esses filtros.</p>` : ""}
      ${lands.map(land => `
        <div style="margin:14px 0 0">
          <div class="eyebrow" id="${landId(pk,land)}" style="margin-bottom:2px">${esc(land)}</div>
          ${filtered.filter(a => a[1] === land).map(a => {
            const i = list.indexOf(a);
            const id = attrId(pk,i,a[0]);
            const hs = heightInfo(a[2]);
            const tags = a[3];
            return `
            <label class="attr ${S.checks[id]?"done":""}">
              <input type="checkbox" data-check="${esc(id)}" ${S.checks[id]?"checked":""}>
              <span class="txt">
                <b>${esc(a[0])}</b>
                <span class="meta">
                  ${tags.includes("T") ? `<span class="pill neutral">imperdível</span>` : ""}
                  ${tags.includes("P") ? `<span class="pill accent">planejar antes</span>` : ""}
                  ${tags.includes("B") ? `<span class="pill ok">ok p/ bebê</span>` : ""}
                  ${tags.includes("C") ? `<span class="pill warn">confirmar status</span>` : ""}
                  ${a[2] ? `<span class="pill neutral">${a[2]} cm</span>` : ""}
                  ${hs ? hs.map(h => h.ok
                      ? `<span class="pill ok">${esc(h.nome.split(" ")[0])} passa</span>`
                      : `<span class="pill crit">${esc(h.nome.split(" ")[0])}: faltam ${h.falta} cm</span>`).join("") : ""}
                  <a class="pill neutral linkpill" href="${attrLink(a[0], PARKS[pk].n)}" target="_blank" rel="noopener noreferrer">saiba mais ↗</a>
                  <a class="pill neutral linkpill" href="${mapUrl(a[0] + " " + PARKS[pk].n + " Orlando")}" target="_blank" rel="noopener noreferrer">mapa ↗</a>
                </span>
              </span>
            </label>`;
          }).join("")}
        </div>`).join("")}
    </div>
  </div>

  <div class="note" style="margin-top:16px">
    <b>Rider Switch — o truque que salva o dia</b>
    <p style="margin:6px 0 0">Nas atrações com altura mínima, peça <i>Rider Switch</i> na entrada (a Universal chama de <i>Child Swap</i> e tem em todo brinquedo com régua). Um adulto anda enquanto o outro fica com as crianças; depois troca sem pegar a fila de novo, e pode levar mais uma pessoa junto. Na prática: o adulto e a criança de 4 anos que passar na régua andam duas vezes, enquanto o outro adulto fica com o bebê. Vale para Big Thunder, Space Mountain, Everest, Tower of Terror, Slinky Dog, Stardust Racers, Mario Kart — todas.</p>
  </div>

  ${pk === "ue" ? `<div class="warnbox" style="margin-top:14px">
    <b>Epic Universe: confirme as réguas antes de prometer</b>
    <p style="margin:6px 0 0">O parque é novo e as alturas mínimas mudaram algumas vezes desde a inauguração — as daqui são ponto de partida, não medida oficial. Confirme cada uma no app da Universal antes de montar o dia. E repare no detalhe que decide o passeio: com ${kids()[0] ? esc(kids()[0].nome) + " em " + (kids()[0].altura||0) + " cm" : "o de 4 anos"}, várias atrações ficam em cima da linha de 102 cm. Medem com o tênis calçado, na entrada, e não negociam. Se estiver a 2 ou 3 cm da régua, trate como “provavelmente não” e tenha um plano B — Super Nintendo World e Isle of Berk têm bastante coisa sem régua.</p>
  </div>` : ""}

  <div class="warnbox" style="margin-top:14px">
    <b>Sobre os itens “confirmar status”</b>
    <p style="margin:6px 0 0">Parque muda: atração fecha para reforma, área inteira é substituída, show noturno troca de nome. Antes de fechar o roteiro, confirme esses itens no app da Disney ou no da Universal — a lista aqui é ponto de partida, não horário oficial.</p>
  </div>`;
}

              <td class="num" data-l="Previsto"><input type="number" min="0" step="10" data-bud="${b.id}" data-k="plan" value="${b.plan}"></td>

function fmtWhen(ms){
  if(!ms) return "nunca";
  const dt = new Date(ms);
  const hoje = iso(today()) === iso(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()));
  const hora = String(dt.getHours()).padStart(2,"0") + ":" + String(dt.getMinutes()).padStart(2,"0");
  return hoje ? "hoje " + hora : `${String(dt.getDate()).padStart(2,"0")} ${MO[dt.getMonth()]} ${hora}`;
}

function viewListas(){
  const ck = progress(allCheckItems().map(c => c.id));
  const shopDone = S.shop.filter(s => s.done).length;
  const cab = `<h1>Listas</h1>` + barraSeg("listas", {
    checklist: ck.done + "/" + ck.total,
    compras:   shopDone + "/" + S.shop.length
  });
  const seg = segAtual("listas");
  const corpo = seg === "compras" ? viewCompras() : seg === "orcamento" ? viewOrcamento() : viewChecklist();
  /* cada view já traz o próprio h1; some, porque o cabeçalho agora é do segmento */
  return cab + corpo.replace(/^\s*<h1>[^<]*<\/h1>/, "");
}

/* sugerirRoteiro() e ROTEIRO_NOTAS ficam na seção 1 — o seed() precisa deles
   antes de S existir, e const não é hoisted como function declaration. */

function aplicarSugestao(){
  const plano = sugerirRoteiro(S.trip);
  if(!plano){ alert("O roteiro sugerido precisa de pelo menos 6 dias. Ajuste as datas na aba Início."); return; }

  /* Itens já cadastrados no dia não se perdem ao reaplicar a sugestão. */
  Object.keys(plano).forEach(dt => { plano[dt].items = (S.days[dt] && S.days[dt].items) || []; });

  S.days = plano;
}

/* ---------- sincronização ----------
   Merge por registro: docs/specs/F2-sync-offline.md · ADR 0003.
   Espelho de build/merge.js, que roda os mesmos testes fora do navegador. */

/* Coleções sincronizáveis. Arrays com id casam por id; mapas são LWW por chave. */
const COLS = ["family","hotels","shop","budget","dining","extraCheck"];
const MAPS = ["checks","attrNotes"];

/* u e del PRECISAM viajar, senão o merge não existe entre aparelhos.
   photos e version ficam (ADR 0005 e token do servidor é por aparelho). */
const LOCAL_ONLY = ["tab","parkFilter","onlyPlan","onlyKid","sync","device",
                    "lastSync","version","seg","photos","mapsKey"];
/* `seg` já está aí de propósito: qual segmento está aberto é preferência
   deste aparelho, não algo para sincronizar. */

const clone = (v) => v === undefined ? undefined : JSON.parse(JSON.stringify(v));

/* Todo caminho sincronizável presente no state. */
function caminhos(S){
  const out = [];
  for(const k of Object.keys(S.trip || {})) out.push("trip:" + k);
  for(const c of COLS) for(const r of S[c] || []) if(r && r.id) out.push(c + ":" + r.id);
  for(const m of MAPS) for(const k of Object.keys(S[m] || {})) out.push(m + ":" + k);
  for(const isoD of Object.keys(S.days || {})){
    const dia = S.days[isoD] || {};
    for(const k of Object.keys(dia)) if(k !== "items") out.push("days:" + isoD + ":" + k);
    for(const it of dia.items || []) if(it && it.id) out.push("days:" + isoD + ":items:" + it.id);
  }
  return out;
}

/* Corta só nos separadores estruturais: id de check tem "|" e pode ter o que quiser. */
function parse(p){
  const i = p.indexOf(":");
  const raiz = p.slice(0, i), resto = p.slice(i + 1);
  if(raiz !== "days") return {raiz, id:resto};
  const j = resto.indexOf(":");
  const campo = resto.slice(j + 1);
  return campo.slice(0, 6) === "items:"
    ? {raiz, iso:resto.slice(0, j), item:campo.slice(6)}
    : {raiz, iso:resto.slice(0, j), campo};
}

function ler(S, p){
  const q = parse(p);
  if(q.raiz === "trip") return (S.trip || {})[q.id];
  if(COLS.includes(q.raiz)) return (S[q.raiz] || []).find(r => r && r.id === q.id);
  if(MAPS.includes(q.raiz)) return (S[q.raiz] || {})[q.id];
  if(q.raiz === "days"){
    const dia = (S.days || {})[q.iso];
    if(!dia) return undefined;
    return q.item ? (dia.items || []).find(it => it && it.id === q.item) : dia[q.campo];
  }
  return undefined;
}

function escrever(S, p, v){
  const q = parse(p);
  if(q.raiz === "trip"){ (S.trip = S.trip || {})[q.id] = v; return; }
  if(COLS.includes(q.raiz)){ porId(S[q.raiz] = S[q.raiz] || [], q.id, v); return; }
  if(MAPS.includes(q.raiz)){ (S[q.raiz] = S[q.raiz] || {})[q.id] = v; return; }
  if(q.raiz === "days"){
    S.days = S.days || {};
    const dia = S.days[q.iso] = S.days[q.iso] || {};
    if(q.item) porId(dia.items = dia.items || [], q.item, v);
    else dia[q.campo] = v;
  }
}

function apagar(S, p){
  const q = parse(p);
  if(q.raiz === "trip"){ if(S.trip) delete S.trip[q.id]; return; }
  if(COLS.includes(q.raiz)){ semId(S[q.raiz], q.id); return; }
  if(MAPS.includes(q.raiz)){ if(S[q.raiz]) delete S[q.raiz][q.id]; return; }
  if(q.raiz === "days"){
    const dia = (S.days || {})[q.iso];
    if(!dia) return;
    if(q.item) semId(dia.items, q.item); else delete dia[q.campo];
  }
}

function porId(arr, id, v){
  const i = arr.findIndex(r => r && r.id === id);
  if(i >= 0) arr[i] = v; else arr.push(v);
}
function semId(arr, id){
  if(!arr) return;
  const i = arr.findIndex(r => r && r.id === id);
  if(i >= 0) arr.splice(i, 1);
}

const carimbo = (x, p) => Math.max(((x.u || {})[p]) || 0, ((x.del || {})[p]) || 0);

/* Pura: nada de I/O, Date.now() nem variável global. Empate vai para "a" (o local),
   que é determinístico e evita ping-pong entre dois aparelhos. */
function merge(a, b){
  const R = clone(a);
  R.u = R.u || {}; R.del = R.del || {};
  const todos = new Set([].concat(
    caminhos(a), caminhos(b),
    Object.keys(a.u || {}), Object.keys(a.del || {}),
    Object.keys(b.u || {}), Object.keys(b.del || {})
  ));
  for(const p of todos){
    const ca = carimbo(a, p), cb = carimbo(b, p);

    /* Sem carimbo nenhum nos dois lados = dado anterior a esta fase. Preserva. */
    if(!ca && !cb){
      const v = ler(a, p) !== undefined ? ler(a, p) : ler(b, p);
      if(v !== undefined) escrever(R, p, clone(v));
      continue;
    }

    const vence = ca >= cb ? a : b, perde = vence === a ? b : a;
    const morto = (vence.del || {})[p] !== undefined;
    /* Se o vencedor não tem lápide mas também não tem o dado, cai para o outro lado:
       só lápide apaga registro, ausência não. */
    const v = morto ? undefined
            : (ler(vence, p) !== undefined ? ler(vence, p) : ler(perde, p));

    if(v === undefined){
      apagar(R, p); delete R.u[p]; R.del[p] = Math.max(ca, cb);
    }else{
      escrever(R, p, clone(v)); delete R.del[p]; R.u[p] = Math.max(ca, cb);
    }
  }
  R.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  return R;
}

/* Retrato dos caminhos antes de um handler mexer no state. Em captura, então
   roda antes de qualquer listener de bolha. */
let retratoAntes = null;

function retrato(){
  const m = {};
  for(const p of caminhos(S)) m[p] = JSON.stringify(ler(S, p));
  return m;
}

/* Diferença entre o retrato e o agora vira carimbo (mudou) ou lápide (sumiu). */
function carimbar(antes){
  const agora = Date.now();
  const depois = retrato();
  S.u = S.u || {}; S.del = S.del || {};
  for(const p in depois){
    if(antes[p] !== depois[p]){ S.u[p] = agora; delete S.del[p]; }
  }
  for(const p in antes){
    if(!(p in depois)){ S.del[p] = agora; delete S.u[p]; }
  }
}

["click","change","input"].forEach(ev =>
  document.addEventListener(ev, () => { retratoAntes = retrato(); }, true));

function payload(){
  const p = {};
  Object.keys(S).forEach(k => { if(!LOCAL_ONLY.includes(k)) p[k] = S[k]; });
  p.updatedAt = S.updatedAt;
  p.updatedBy = S.device;
  return p;
}

function syncUrls(){
  const base = S.sync.url.replace(/\/+$/,"");
  if(S.sync.provider === "jsonbin"){
    return { read: base + "/latest", write: base,
             headers: {"X-Master-Key": S.sync.token, "X-Bin-Meta":"false"} };
  }
  const h = {};
  if(S.sync.token) h[S.sync.header || "Authorization"] = S.sync.token;
  /* O contrato (docs/API.md) é GET/PUT em /trip. Aceita a URL base ou já com o
     caminho, para não depender de o usuário lembrar de colar o final certo. */
  const alvo = /\/trip$/.test(base) ? base : base + "/trip";
  return { read: alvo, write: alvo, headers: h };
}

function syncMsg(txt, tone){
  const el = document.getElementById("syncMsg");
  if(!el) return;
  el.textContent = txt;
  el.style.color = tone === "ok" ? "var(--ok)" : tone === "err" ? "var(--crit)" : "var(--fg-dim)";
}

/* Traduz a falha para algo acionável em vez de "Failed to fetch". */
function syncErro(e, res){
  if(res){
    if(res.status === 401 || res.status === 403) return "Chave recusada pelo servidor. Confira a X-Master-Key.";
    if(res.status === 404) return "Endereço não encontrado. Confira o Bin ID na URL.";
    if(res.status === 429) return "Muitas requisições seguidas. Espere um minuto e tente de novo.";
    return `O servidor respondeu ${res.status}.`;
  }
  return "Não foi possível falar com o servidor. Se você está na página publicada no claude.ai, o sync não funciona lá — ela bloqueia chamadas externas. Hospede o arquivo ou abra-o do computador.";
}

let sincronizando = false;

/* Merge no cliente + version opaca do servidor. Não existe "forçar": com merge
   por registro, forçar é justamente a maneira de perder dado (ADR 0003). */
async function syncNow(){
  if(sincronizando) return;
  if(!S.sync.url){ syncMsg("Configure a URL do servidor primeiro.", "err"); return; }
  if(!comRede){ syncMsg("Sem rede agora. Suas alterações estão salvas e sobem sozinhas quando a conexão voltar.", "err"); return; }
  sincronizando = true;
  renderNav();

  const u = syncUrls();
  const jb = S.sync.provider === "jsonbin";

  try{
    for(let tentativa = 1; tentativa <= 3; tentativa++){
      syncMsg(tentativa === 1 ? "Sincronizando…" : `Alguém gravou antes — remesclando (${tentativa}/3)…`);

      /* 1 · lê o remoto */
      let remoto = null, versaoRemota = null, res = null;
      try{
        res = await fetch(u.read, {headers: u.headers, cache:"no-store"});
      }catch(e){ syncMsg(syncErro(e, null), "err"); return; }

      if(res.status === 404){
        remoto = null;                       /* servidor vazio: primeiro envio */
      }else if(!res.ok){
        syncMsg(syncErro(null, res), "err"); return;
      }else{
        let body;
        try{ body = await res.json(); }
        catch(e){ syncMsg("O servidor respondeu algo que não é JSON válido.", "err"); return; }
        if(jb){
          remoto = (body && body.record !== undefined) ? body.record : body;
        }else{
          remoto = body ? body.data : null;
          versaoRemota = body ? body.version : null;
        }
        if(!remoto || typeof remoto !== "object" || !remoto.trip) remoto = null;
      }

      /* 2 · mescla (função pura, testada em build/merge.js) */
      const local = payload();
      const junto = remoto ? merge(local, remoto) : local;

      /* 3 · grava, respeitando a version que acabamos de ler */
      const envio = jb ? junto : {version: versaoRemota, data: junto};
      let put;
      try{
        put = await fetch(u.write, {
          method:"PUT",
          headers: Object.assign({"Content-Type":"application/json"}, u.headers),
          body: JSON.stringify(envio)
        });
      }catch(e){ syncMsg(syncErro(e, null), "err"); return; }

      if(put.status === 409){ continue; }        /* corrida: relê e remescla */
      if(!put.ok){ syncMsg(syncErro(null, put), "err"); return; }

      let resp = null;
      try{ resp = await put.json(); }catch(e){}
      S.version = (resp && resp.version) || null;

      aplicarMerge(junto);
      const quantos = remoto ? Object.keys(remoto.u || {}).length : 0;
      syncMsg(remoto
        ? `Sincronizado. Nada se perdeu — os dois lados foram combinados.`
        : `Enviado. O servidor agora tem a versão deste aparelho (${S.device}).`, "ok");
      return;
    }
    syncMsg("Outro aparelho gravou três vezes seguidas durante a sincronização. Tente de novo em alguns segundos.", "err");
  }finally{
    sincronizando = false;
    renderNav();
  }
}

/* ---------- gatilhos de sincronização (F3) ----------
   Não existe fila de operações: S.u e S.del já SÃO a fila, e o merge resolve o
   resto. O que falta é só o gatilho. */

let redeTimer;

/* Debounce de 3s: entrar e sair de Wi-Fi dispara o listener várias vezes
   seguidas, e a trava `sincronizando` sozinha não evita a rajada. */
function agendarSync(){
  clearTimeout(redeTimer);
  redeTimer = setTimeout(() => {
    if(comRede && pendente() && !sincronizando) syncNow();
  }, 3000);
}

function marcarRede(ligada){
  const mudou = comRede !== ligada;
  comRede = ligada;
  if(mudou) renderNav();
  if(ligada) agendarSync();
}

if(NATIVE && Capacitor.Plugins && Capacitor.Plugins.Network){
  const Rede = Capacitor.Plugins.Network;
  Rede.getStatus().then(st => marcarRede(!!st.connected)).catch(() => {});
  Rede.addListener("networkStatusChange", st => marcarRede(!!st.connected));
}else{
  addEventListener("online",  () => marcarRede(true));
  addEventListener("offline", () => marcarRede(false));
}

/* App voltando do segundo plano. Sem retry agressivo: se falhar, espera o
   próximo evento de rede — com 4 aparelhos e o botão manual à mão, o próximo
   evento é backoff suficiente. */
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible") agendarSync();
});

/* Aplica o resultado do merge sem carimbar de novo: os carimbos já vieram
   prontos de dentro do merge, e recarimbar aqui marcaria tudo como local. */
function aplicarMerge(junto){
  const manter = {};
  LOCAL_ONLY.forEach(k => manter[k] = S[k]);
  S = Object.assign(seed(), junto, manter);
  S.lastSync = S.updatedAt = junto.updatedAt || Date.now();
  retratoAntes = null;
  save(false);
  render();
}

/* ============================== 8b. AGENDA E CALENDÁRIO ==============================
   Lembretes viram arquivo .ics e quem dispara é o Calendário do aparelho
   (ADR 0009). Espelho de build/agenda.js, que roda os mesmos 13 asserts fora
   do navegador. */

const PARQUE = {
  mk:"Magic Kingdom", ak:"Animal Kingdom", hs:"Hollywood Studios",
  ue:"Epic Universe", ds:"Disney Springs", mia:"Miami",
  off:"Estrada / compras", none:"Descanso"
};

const partes = (isoDia) => isoDia.split("-").map(Number);
const ddmm = (isoDia) => { const [,m,dd] = partes(isoDia); return String(dd).padStart(2,"0")+"/"+String(m).padStart(2,"0"); };

/* Dias da viagem, inclusive nas duas pontas. Teto de 60 pelo mesmo motivo do
   daysRange do app: viagem digitada errada não vira loop infinito. */
function diasDaViagem(trip){
  const out = [];
  if(!trip || !trip.start || !trip.end) return out;
  const [ay,am,ad] = partes(trip.start);
  const [by,bm,bd] = partes(trip.end);
  const fim = new Date(by, bm-1, bd);
  for(let cur = new Date(ay, am-1, ad); cur <= fim && out.length < 60; cur.setDate(cur.getDate()+1)){
    out.push(cur.getFullYear()+"-"+String(cur.getMonth()+1).padStart(2,"0")+"-"+String(cur.getDate()).padStart(2,"0"));
  }
  return out;
}

function construirAgenda(S, agora){
  const out = [];
  const t = agora instanceof Date ? agora.getTime() : Number(agora);
  const dining = (S && S.dining) || [];
  const days = (S && S.days) || {};

  /* 1 · briefing das 07h, um por dia de viagem. Dia sem parque não toca. */
  diasDaViagem(S && S.trip).forEach(isoDia => {
    const dia = days[isoDia];
    if(!dia || dia.park === "none") return;
    const [y,m,dd] = partes(isoDia);
    const itens = (dia.items || []).length;
    const reservas = dining.filter(r => r.dia === isoDia && r.hora)
      .map(r => "Reserva " + r.hora + " " + r.nome);
    const linha = [];
    if(itens) linha.push(itens + (itens === 1 ? " programa" : " programas"));
    linha.push(...reservas);
    out.push({
      id:"briefing:" + isoDia,
      at:new Date(y, m-1, dd, 7, 0, 0, 0),
      titulo:"Hoje: " + (PARQUE[dia.park] || "Dia livre"),
      corpo:linha.length ? linha.join(" · ") : String(dia.notes || "").trim()
    });
  });

  dining.forEach(r => {
    if(!r.dia) return;
    const [y,m,dd] = partes(r.dia);

    /* 2 · abertura da janela de 60 dias, 06:50 — dez minutos antes da Disney
       abrir. Só para o que ainda não está reservado, e só se ainda não passou:
       a janela que abriu em junho não adianta lembrar. */
    if(!r.done){
      const at = new Date(y, m-1, dd-60, 6, 50, 0, 0);
      if(at.getTime() > t) out.push({
        id:"janela:" + r.id,
        at,
        titulo:"Abre hoje: " + r.nome,
        corpo:"Reserva para " + ddmm(r.dia) + " libera às 7h. Abra o app da Disney."
      });
    }

    /* 3 · uma hora antes da reserva, reservada ou não. Hora negativa cai no
       dia anterior sozinha — é o que se quer para reserva às 00:30. */
    if(r.hora){
      const [hh,mi] = r.hora.split(":").map(Number);
      out.push({
        id:"antes:" + r.id,
        at:new Date(y, m-1, dd, hh-1, mi, 0, 0),
        titulo:"Em 1h: " + r.nome,
        corpo:r.hora + (r.local ? " · " + r.local : "")
      });
    }
  });

  out.sort((a,b) => a.at - b.at || (a.id < b.id ? -1 : 1));
  return out;
}

/* ---------- .ics (RFC 5545) ---------- */

/* Ponto e vírgula, vírgula, barra e quebra de linha são estruturais no formato. */
function icsEsc(t){
  return String(t == null ? "" : t)
    .replace(/\\/g, "\\\\").replace(/;/g, "\\;")
    .replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
}

/* Hora FLUTUANTE de propósito: sem Z e sem TZID, o alarme toca às 7h de onde o
   aparelho estiver. A viagem cruza BRT → EDT e é isso que se quer. */
function icsData(dt){
  const p = (n) => String(n).padStart(2, "0");
  return dt.getFullYear() + p(dt.getMonth()+1) + p(dt.getDate())
       + "T" + p(dt.getHours()) + p(dt.getMinutes()) + "00";
}

/* O formato limita a linha a 75 octetos; continuação começa com espaço. */
function icsDobra(linha){
  const b = [];
  let atual = "";
  for(const ch of linha){
    const cand = atual + ch;
    if(new TextEncoder().encode(cand).length > 73){ b.push(atual); atual = " " + ch; }
    else atual = cand;
  }
  b.push(atual);
  return b.join("\r\n");
}

function gerarIcs(){
  const ag = construirAgenda(S, Date.now());
  const carimbo = icsData(new Date());
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Viagem Disney//PT",
             "CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Viagem Disney"];
  ag.forEach(x => {
    const fim = new Date(x.at.getTime() + 15*60000);
    L.push("BEGIN:VEVENT");
    /* UID estável: reimportar substitui em vez de duplicar. */
    L.push(icsDobra("UID:" + x.id.replace(/[^a-zA-Z0-9:_-]/g, "-") + "@disneytrip"));
    L.push("DTSTAMP:" + carimbo + "Z");
    L.push("DTSTART:" + icsData(x.at));
    L.push("DTEND:" + icsData(fim));
    L.push(icsDobra("SUMMARY:" + icsEsc(x.titulo)));
    if(x.corpo) L.push(icsDobra("DESCRIPTION:" + icsEsc(x.corpo)));
    L.push("BEGIN:VALARM","TRIGGER:PT0S","ACTION:DISPLAY",
           icsDobra("DESCRIPTION:" + icsEsc(x.titulo)),"END:VALARM");
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return {texto: L.join("\r\n") + "\r\n", total: ag.length};
}

async function baixarIcs(){
  const msg = document.getElementById("icsMsg");
  const diz = (t,c) => { if(msg){ msg.textContent = t; msg.style.color = c; } };
  const {texto, total} = gerarIcs();

  if(!total){ diz("Nada para exportar ainda. Defina os dias do roteiro e o horário das reservas.", "var(--warn)"); return; }

  const nome = "viagem-disney.ics";
  const arq = new File([texto], nome, {type:"text/calendar"});

  /* No iOS o compartilhamento é o caminho que chega ao Calendário; o link com
     download só funciona bem no computador. Tenta o nativo e cai para o link. */
  if(navigator.canShare && navigator.canShare({files:[arq]})){
    try{
      await navigator.share({files:[arq], title:"Viagem Disney"});
      diz(total + " lembretes exportados. Escolha “Calendário” para importar.", "var(--ok)");
      return;
    }catch(e){ if(e && e.name === "AbortError"){ diz("Exportação cancelada.", "var(--fg-dim)"); return; } }
  }
  try{
    const url = URL.createObjectURL(new Blob([texto], {type:"text/calendar"}));
    const a = document.createElement("a");
    a.href = url; a.download = nome; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    diz(total + " lembretes salvos em " + nome + ". Abra o arquivo para importar no Calendário.", "var(--ok)");
  }catch(e){ diz("Este navegador não deixou baixar o arquivo.", "var(--crit)"); }
}
