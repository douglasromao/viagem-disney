<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0E7C86" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1F29" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="./icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Viagem Disney">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Planejador Disney — Miami e Orlando · Ago/Set 2026</title>

<style>
:root{
  --paper:#FFF3E0; --surface:#FFFCF7; --surface-2:#FBF0DC; --surface-3:#F0E2C6;
  --fg:#1B2141; --fg-dim:#4C5375; --fg-faint:#5E6486;
  --line:#E4D2B2; --line-soft:#F2E6D0;
  --accent:#1064C8; --accent-soft:#D7E8FF; --on-accent:#FFFFFF;
  --ok:#1C7A46; --warn:#8A5300; --crit:#C42132;
  --ok-bg:#E2F6E7; --warn-bg:#FBE8C0; --crit-bg:#FCDCDC;
  --mk:#B4356B; --ak:#3F7A3A; --hs:#AE5114; --ue:#4F46C4; --ds:#82662A; --mia:#3D5AB5; --gen:#546A72;
  /* sombra sólida: um degrau de cor, não borrão */
  --shadow:0 2px 0 #E8D6B6, 0 10px 18px -14px rgba(27,33,65,.45);

  --font-display:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Avenir Next Rounded",Avenir,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-ui:"Seravek","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-data:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;

  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#101A33; --surface:#1A2444; --surface-2:#232E54; --surface-3:#2E3A66;
    --fg:#F3EEE3; --fg-dim:#BCC4DF; --fg-faint:#A6AFCF;
    --line:#39456F; --line-soft:#2A3560;
    --accent:#7BB8FF; --accent-soft:#1B2F5C; --on-accent:#08152E;
    --ok:#5FD08C; --warn:#F0BC4A; --crit:#FF8E7C;
    --ok-bg:#123A28; --warn-bg:#3A2E10; --crit-bg:#3C201E;
    --mk:#EE7BA6; --ak:#79BE6F; --hs:#EE9A5C; --ue:#9A93F0; --ds:#D4B267; --mia:#8B9FEE; --gen:#8FA5AC;
    --shadow:0 2px 0 #0B1226, 0 12px 22px -16px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --paper:#101A33; --surface:#1A2444; --surface-2:#232E54; --surface-3:#2E3A66;
  --fg:#F3EEE3; --fg-dim:#BCC4DF; --fg-faint:#A6AFCF;
  --line:#39456F; --line-soft:#2A3560;
  --accent:#7BB8FF; --accent-soft:#1B2F5C; --on-accent:#08152E;
  --ok:#5FD08C; --warn:#F0BC4A; --crit:#FF8E7C;
  --ok-bg:#123A28; --warn-bg:#3A2E10; --crit-bg:#3C201E;
  --mk:#EE7BA6; --ak:#79BE6F; --hs:#EE9A5C; --ue:#9A93F0; --ds:#D4B267; --mia:#8B9FEE; --gen:#8FA5AC;
  --shadow:0 2px 0 #0B1226, 0 12px 22px -16px rgba(0,0,0,.85);
}
:root[data-theme="light"]{
  --paper:#FFF3E0; --surface:#FFFCF7; --surface-2:#FBF0DC; --surface-3:#F0E2C6;
  --fg:#1B2141; --fg-dim:#4C5375; --fg-faint:#5E6486;
  --line:#E4D2B2; --line-soft:#F2E6D0;
  --accent:#1064C8; --accent-soft:#D7E8FF; --on-accent:#FFFFFF;
  --ok:#1C7A46; --warn:#8A5300; --crit:#C42132;
  --ok-bg:#E2F6E7; --warn-bg:#FBE8C0; --crit-bg:#FCDCDC;
  --mk:#B4356B; --ak:#3F7A3A; --hs:#AE5114; --ue:#4F46C4; --ds:#82662A; --mia:#3D5AB5; --gen:#546A72;
  --shadow:0 2px 0 #E8D6B6, 0 10px 18px -14px rgba(27,33,65,.45);
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- casca: cabeçalho fixo, conteúdo, barra de ações ---------- */
.topo{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 9px) 12px 9px;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.topo-menu{
  background:none;border:0;padding:7px;margin:-7px 0 -7px -4px;border-radius:9px;
  cursor:pointer;color:var(--fg);display:flex;flex:0 0 auto;
}
.topo-menu:hover{background:var(--surface-3)}
.topo-menu .ico{width:22px;height:22px}
.topo-logo{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.topo-marca{width:27px;height:27px;flex:0 0 auto;color:var(--accent)}
.topo-logo > span{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.topo-logo b{font-family:var(--font-display);font-size:16px;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo-logo span span{font-family:var(--font-data);font-size:10.5px;color:var(--fg-faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo-acoes{display:flex;gap:6px;flex:0 0 auto}
.topo-acoes .themebtn{white-space:nowrap;padding:6px 9px;font-size:11px}
@media (max-width:400px){
  .topo-logo span span{display:none}          /* datas saem antes do título */
  .topo-acoes .themebtn{padding:6px 8px}
}
.themebtn{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;
  padding:6px 11px;cursor:pointer;font-family:var(--font-display);font-size:11.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--fg-dim)}
.themebtn:hover{border-color:var(--accent);color:var(--fg)}
.syncbtn.pend{border-color:var(--warn);color:var(--warn)}

.shell{min-height:60vh}
main{padding:18px 15px calc(78px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto;width:100%;min-width:0}
main:focus{outline:none}
@media (min-width:861px){
  main{padding:26px 30px 96px}
  .topo{padding-left:22px;padding-right:22px}
}

/* ---------- gaveta ---------- */
.gaveta{position:fixed;inset:0;z-index:80}
.gaveta[hidden]{display:none}
.gaveta-fundo{position:absolute;inset:0;background:rgba(10,16,26,.5)}
.gaveta-pane{
  position:absolute;left:0;top:0;bottom:0;width:min(300px,86vw);
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 6px) 0 env(safe-area-inset-bottom);
  box-shadow:6px 0 26px -12px rgba(10,16,26,.5);
}
.gaveta-hd{display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px 12px;border-bottom:1px solid var(--line-soft)}
.gaveta-hd b{font-family:var(--font-display);font-size:13px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--fg-faint)}
#nav{flex:1;overflow-y:auto;padding:8px}
#nav button{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  background:none;border:0;text-align:left;padding:11px 12px;border-radius:11px;
  cursor:pointer;color:var(--fg-dim);
}
#nav button:hover{background:var(--surface-2);color:var(--fg)}
#nav button[aria-current="true"]{background:var(--accent);color:var(--on-accent)}
#nav .lbl{display:flex;align-items:center;gap:11px;min-width:0}
#nav .lbl > span{display:flex;flex-direction:column;line-height:1.2;min-width:0}
#nav .lbl b{font-family:var(--font-display);font-size:15px}
#nav .lbl span span{font-size:11.5px;opacity:.8}
#nav .cnt{font-family:var(--font-data);font-size:10.5px;opacity:.8;flex:0 0 auto}
.gaveta-foot{padding:10px 16px;border-top:1px solid var(--line-soft)}

/* ---------- barra de ações ---------- */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.bottomnav .inner{display:flex;max-width:520px;margin:0 auto}
.bottomnav button{
  flex:1 1 0;min-width:0;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:0;padding:9px 6px;cursor:pointer;color:var(--fg-dim);
  font-family:var(--font-display);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;
}
.bottomnav button[aria-current="true"]{color:var(--accent)}
.bottomnav .ico{width:23px;height:23px}
.bottomnav .cnt{position:absolute;top:4px;right:calc(50% - 24px);
  font-family:var(--font-data);font-size:9.5px;line-height:1;
  background:var(--accent);color:var(--on-accent);border-radius:999px;padding:2px 5px}
.bottomnav button[aria-current="true"] .cnt{background:var(--fg);color:var(--paper)}

/* ---------- card / stub ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card-hd{position:relative;padding:14px 16px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-hd::after{content:"";position:absolute;left:16px;right:16px;bottom:0;border-bottom:2px dashed var(--line)}
.card-hd::before{content:"";position:absolute;left:-8px;right:-8px;bottom:-8px;height:16px;background:
   radial-gradient(circle 8px at 0 50%, var(--paper) 98%, transparent 100%),
   radial-gradient(circle 8px at 100% 50%, var(--paper) 98%, transparent 100%);
  pointer-events:none}
.card-bd{padding:14px 16px 16px}
.grid{display:grid;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ---------- inputs ---------- */
input[type=text],input[type=date],input[type=number],select,textarea{
  background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
input[type=number]{font-family:var(--font-data);text-align:right;font-variant-numeric:tabular-nums}
textarea{resize:vertical;font-size:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--fg-dim);min-width:0}
label.f>span{font-family:var(--font-data);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:7px;padding:8px 14px;cursor:pointer;font-family:var(--font-display);font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface-2);color:var(--fg-dim);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--fg);border-color:var(--accent);filter:none}
.btn.sm{padding:5px 10px;font-size:12px}
.del{background:none;border:0;color:var(--fg-faint);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:15px;line-height:1}
.del:hover{color:var(--crit);background:var(--crit-bg)}

/* ---------- checkbox item ---------- */
.item{display:flex;gap:11px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line-soft)}
.item:last-child{border-bottom:0}
.item input[type=checkbox]{appearance:none;flex:0 0 19px;width:19px;height:19px;margin-top:2px;border:2px solid var(--line);border-radius:5px;background:var(--surface-2);cursor:pointer;position:relative;transition:background .15s,border-color .15s}
.item input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.item input[type=checkbox]:checked::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
.item .txt{flex:1;min-width:0}
.item .txt b{font-weight:600;font-size:14.5px}
.item .txt p{margin:2px 0 0;font-size:13px;color:var(--fg-dim);text-wrap:pretty}
.item.done .txt b,.item.done .txt p{text-decoration:line-through;color:var(--fg-faint)}
.item.done input[type=checkbox]+.txt{opacity:.62}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-data);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2.5px 7px;border-radius:999px;border:1px solid;white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.pill.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.pill.crit{color:var(--crit);border-color:var(--crit);background:var(--crit-bg)}
.pill.neutral{color:var(--fg-dim);border-color:var(--line);background:var(--surface-2)}
.pill.accent{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.linkpill{text-decoration:none;cursor:pointer}
.linkpill:hover{color:var(--accent);border-color:var(--accent)}


.mapembed-wrap{margin-top:4px}
.mapembed{width:100%;border:1px solid var(--line);border-radius:8px;display:block;background:var(--surface-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) iframe.mapembed{filter:invert(92%) hue-rotate(180deg) contrast(90%)}}
:root[data-theme="dark"] iframe.mapembed{filter:invert(92%) hue-rotate(180deg) contrast(90%)}
.mapembed-empty{display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-size:12.5px;color:var(--fg-dim);text-wrap:pretty}
.mapembed-empty > span{display:block}
.mapembed-empty b{color:var(--fg)}

/* ---------- park color coding ---------- */
.pk{--c:var(--gen)}
.pk-mk{--c:var(--mk)} .pk-ak{--c:var(--ak)} .pk-hs{--c:var(--hs)} .pk-ue{--c:var(--ue)}
.pk-ds{--c:var(--ds)} .pk-mia{--c:var(--mia)} .pk-off{--c:var(--gen)} .pk-none{--c:var(--gen)}
.parkbar{height:5px;background:var(--c)}

.parkicon{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;
  background:var(--surface);border:1.5px solid var(--line-soft);color:var(--c)}
.parkicon svg{width:60%;height:60%;display:block}
.parkicon.xs{width:20px;height:20px;border-width:1px}
.parkicon.sm{width:28px;height:28px}
.parkicon.lg{width:58px;height:58px;border-width:2px;box-shadow:var(--shadow)}
.chip.pkchip{display:inline-flex;align-items:center;gap:7px}
.chip.pkchip[aria-pressed="true"] .parkicon{background:rgba(255,255,255,.22);border-color:transparent;color:inherit}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow)}
.stat .k{font-family:var(--font-data);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--fg-faint)}
.stat .v{font-family:var(--font-display);font-size:29px;font-weight:700;letter-spacing:.01em;line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .n{font-size:12.5px;color:var(--fg-dim);margin-top:1px}
.bar{height:7px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.bar.c-ok i{background:var(--ok)} .bar.c-warn i{background:var(--warn)} .bar.c-crit i{background:var(--crit)}

/* ---------- tables ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-family:var(--font-data);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-faint);text-align:left;padding:7px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap;font-weight:400}
td{padding:6px 8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
td.num,th.num{text-align:right;font-family:var(--font-data);font-variant-numeric:tabular-nums}
tfoot td{border-bottom:0;border-top:2px solid var(--line);font-weight:700;padding-top:10px}
tbody tr.done td{opacity:.5}
table input[type=text]{background:transparent;border:1px solid transparent;padding:4px 6px}
table input[type=text]:hover{border-color:var(--line-soft)}
table input[type=text]:focus{background:var(--surface-2);border-color:var(--line)}
table input[type=number]{background:transparent;border:1px solid transparent;padding:4px 6px;max-width:104px}
table input[type=number]:hover{border-color:var(--line-soft)}
table input[type=number]:focus{background:var(--surface-2);border-color:var(--line)}
table select{background:transparent;border:1px solid transparent;padding:4px 4px;font-size:13px}
table select:hover{border-color:var(--line-soft)}

/* ---------- filters ---------- */
.filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;font-family:var(--font-display);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-dim)}
.chip:hover{border-color:var(--accent);color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--paper);border-color:var(--fg)}
.chip.pkchip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
:root[data-theme="dark"] .chip.pkchip[aria-pressed="true"],
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0F1F29}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0F1F29}}

/* ---------- day cards ---------- */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:13px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.day-hd{padding:11px 13px 9px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.day-hd .dt{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.day-hd .wd{font-family:var(--font-data);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--fg-faint)}
.day-bd{padding:0 13px 13px;display:flex;flex-direction:column;gap:9px}
.day-bd select{font-family:var(--font-display);letter-spacing:.05em;text-transform:uppercase;font-size:13px;color:var(--c);font-weight:600}

.dayitems{display:flex;flex-direction:column;gap:6px}
.dayitem{display:grid;grid-template-columns:22px minmax(0,1fr) 26px 26px;gap:6px;align-items:center}
.dayitem-dining{grid-template-columns:22px 84px minmax(0,1fr) 26px}
.dayitem .pin{
  background:none;border:0;cursor:pointer;padding:2px;border-radius:6px;
  font-size:14px;line-height:1;filter:grayscale(1);opacity:.45;
}
.dayitem .pin:hover,.dayitem .pin[aria-expanded="true"]{filter:none;opacity:1;background:var(--surface-3)}
.dayitem .pin.tem{filter:none;opacity:1}
.dayitem-add .pin{visibility:hidden}

.itemlocal{
  background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;
  padding:11px 12px;margin:2px 0 8px 28px;
}
.itemlocal p{font-size:12px;color:var(--fg-dim);margin:8px 0 10px;text-wrap:pretty}
.itemlocal p b{color:var(--fg);font-weight:600}
/* item que veio de Parques: filete na lateral, sem gastar largura com etiqueta */
.dayitem-attr input[type=text]{border-left:3px solid var(--accent)}
.dayitem input[type=time]{font-family:var(--font-data);font-size:12.5px;padding:6px 5px;text-align:center}
.dayitem input[type=text]{font-size:13px;padding:6px 8px}
.dayitem-add{margin-top:2px}
.dayitem-add input,.dayitem-add .btn{opacity:.85}
.dayitem-dining{background:var(--accent-soft);border-radius:6px;padding:0 0 0 2px}
.dayitem-name{font-size:13px;padding:6px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayitem-add .btn{padding:6px 0;font-size:15px;line-height:1}

/* ---------- attractions ---------- */
.attr{display:flex;gap:11px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line-soft)}
.attr:last-child{border-bottom:0}
.attr .txt{flex:1;min-width:0}
.attr .txt b{font-size:14.5px;font-weight:600}
.attr .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.attr .land{font-family:var(--font-data);font-size:11px;color:var(--fg-faint);letter-spacing:.03em}
.attr.done .txt b{text-decoration:line-through;color:var(--fg-faint)}
.attr input[type=checkbox]{appearance:none;flex:0 0 19px;width:19px;height:19px;margin-top:2px;border:2px solid var(--line);border-radius:5px;background:var(--surface-2);cursor:pointer;position:relative}
.attr input[type=checkbox]:checked{background:var(--c);border-color:var(--c)}
.attr input[type=checkbox]:checked::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}

.note{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px;font-size:13.5px;color:var(--fg);text-wrap:pretty}
.note b{font-family:var(--font-display);letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.warnbox{background:var(--warn-bg);border:1px solid var(--warn);border-radius:var(--r);padding:12px 14px;font-size:13.5px;text-wrap:pretty}
.warnbox b{font-family:var(--font-display);letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--warn)}

/* Rótulo pequeno. A classe já era usada em 8 lugares e nunca teve regra
   nenhuma: todos eles vinham saindo como texto corrido. */
.eyebrow{font-family:var(--font-data);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--fg-faint)}

/* ponto de saída do dia */
.saida{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 0;font-size:13.5px;
  background:var(--ok-bg);border:1px solid var(--ok);border-radius:var(--r);padding:9px 12px}
.saida span:not(.eyebrow){color:var(--fg-dim);font-size:12.5px}
.saida-vazia{background:var(--warn-bg);border-color:var(--warn);color:var(--fg)}
.saida-chega{background:var(--accent-soft);border-color:var(--accent)}
.semmapa{display:flex;align-items:flex-start;gap:8px;margin-top:10px;font-size:12.5px;color:var(--fg-dim);cursor:pointer}
.semmapa input{margin-top:2px;flex:0 0 auto}


/* ---------- capa ---------- */
.capa{position:relative;border-radius:var(--r);overflow:hidden;margin:0 0 18px;box-shadow:var(--shadow)}
.capa svg{display:block;width:100%;height:clamp(196px,48vw,290px)}
/* A família fica ancorada na base, à esquerda do castelo, e por cima do
   degradê — senão o escurecimento cai em cima dos rostos. */
.capa-fam{
  position:absolute;left:2%;bottom:0;z-index:2;
  height:88%;width:auto;max-width:62%;object-fit:contain;object-position:bottom;
  filter:drop-shadow(0 6px 14px rgba(15,10,35,.45));
}
/* Degradê atrás da contagem: sem ele o texto claro cai em cima do gramado
   claro e some. A ilustração mantém as cores próprias nos dois temas. */
.capa::after{
  content:"";position:absolute;inset:auto 0 0 0;height:58%;pointer-events:none;
  background:linear-gradient(to top, rgba(18,12,38,.82) 0%, rgba(18,12,38,.45) 45%, rgba(18,12,38,0) 100%);
}
/* Alinhado à direita de propósito: à esquerda a contagem cobria a família,
   que é justamente a parte da ilustração que interessa. */
.capa-txt{
  position:absolute;left:18px;right:18px;bottom:15px;z-index:3;
  display:flex;flex-direction:column;align-items:flex-end;text-align:right;
  line-height:1;color:#FFF6E8;text-shadow:0 1px 6px rgba(20,15,40,.5);
}
.capa-n{font-family:var(--font-display);font-size:clamp(40px,11vw,60px);font-weight:700;letter-spacing:-.02em}
.capa-l{font-size:13px;font-weight:600;margin-top:5px;opacity:.95}

/* ---------- ícones das abas ---------- */
.ico{width:20px;height:20px;flex:0 0 auto;fill:currentColor}

/* ---------- grupos recolhíveis ---------- */
.grupo-hd{
  width:100%;background:none;border:0;text-align:left;cursor:pointer;font:inherit;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.grupo-hd:hover h2{color:var(--accent)}
.grupo-seta{width:15px;height:15px;flex:0 0 auto;color:var(--fg-faint);
  transform:rotate(90deg);transition:transform .18s ease}
.grupo.fechado .grupo-seta{transform:rotate(0deg)}
.grupo.fechado .grupo-bd{display:none}
.grupo.fechado .card-hd{border-bottom:0;padding-bottom:2px}
@media (prefers-reduced-motion:reduce){.grupo-seta{transition:none}}

/* ---------- listas próprias ---------- */
.chip-mais{border-style:dashed;color:var(--accent)}
.lista-nome{
  font-family:var(--font-display);font-size:19px;font-weight:600;
  background:none;border:1px solid transparent;padding:2px 6px;border-radius:7px;
  min-width:0;flex:1;
}
.lista-nome:hover{border-color:var(--line-soft)}
.lista-nome:focus{background:var(--surface-2);border-color:var(--line)}
.lista-item{background:none;border:1px solid transparent;padding:3px 6px;width:100%;font-size:14px}
.lista-item:hover{border-color:var(--line-soft)}
.lista-item:focus{background:var(--surface-2);border-color:var(--line)}
.item.done .lista-item{text-decoration:line-through;opacity:.55}

/* ---------- contagem no calendário ---------- */
.capa{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;text-align:left;font:inherit}
/* No topo, não no rodapé: embaixo colidia com "dias para embarcar". */
.capa-toque{
  position:absolute;left:14px;top:12px;z-index:3;
  font-size:10.5px;letter-spacing:.04em;color:#FFF6E8;
  background:rgba(18,12,38,.5);border-radius:999px;padding:4px 10px;
  backdrop-filter:blur(2px);
}
.folha-cal .folha-bd{padding-bottom:22px}
.cal-dica{font-size:12.5px;color:var(--fg-dim);margin:0 0 12px;text-wrap:pretty}
.cal-sem{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
.cal-sem span{text-align:center;font-family:var(--font-data);font-size:9.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--fg-faint)}
.cal-grade{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-c{
  position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;
  display:grid;place-items:center;padding:0;
  border:1px solid var(--line-soft);background:var(--surface-2);
  cursor:pointer;font:inherit;color:var(--fg-dim);
}
.cal-vazia{background:none;border-color:transparent;cursor:default}
.cal-n{font-family:var(--font-data);font-size:12px;line-height:1;z-index:1}
.cal-c.hoje{border-color:var(--accent);border-width:2px}
.cal-c.passou{opacity:.55}

/* o X é desenhado, não aparece pronto: riscar é o ritual */
.cal-x{position:absolute;inset:12%;width:76%;height:76%;pointer-events:none}
.cal-x path{fill:none;stroke:var(--crit);stroke-width:4;stroke-linecap:round;
  stroke-dasharray:32;stroke-dashoffset:32}
.cal-conta.risca .cal-x path{animation:risca .26s ease-out forwards}
.cal-conta.risca .cal-x path:nth-child(2){animation-delay:.13s}
.cal-conta.risca{background:var(--crit-bg);border-color:var(--crit)}
.cal-conta.risca .cal-n{opacity:.45}
@keyframes risca{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
  .cal-conta.risca .cal-x path{animation:none;stroke-dashoffset:0}
}

/* --c vem da classe .pk-xx; --c-soft não existe na paleta, então o fundo fica
   neutro e a cor do parque aparece na borda, no número e no ícone. */
.cal-viagem{background:var(--surface-2);border-color:var(--c,var(--accent));border-style:dashed}
.cal-viagem .cal-pico{position:absolute;inset:0;display:grid;place-items:center;color:var(--c,var(--accent));opacity:.55}
.cal-viagem .cal-pico svg{width:60%;height:60%}
.cal-viagem .cal-n{position:absolute;top:3px;left:5px;color:var(--c,var(--accent));font-weight:700;z-index:2}
.cal-viagem.tem{border-style:solid}
.cal-viagem img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cal-viagem.tem .cal-n{color:#FFF6E8;text-shadow:0 1px 4px rgba(15,10,35,.8);z-index:2}

.cal-marca{
  position:absolute;width:54%;height:54%;
  background:var(--c,var(--accent));opacity:.6;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;
  -webkit-mask-size:contain;mask-size:contain;
}
.cal-viagem.tem .cal-marca{display:none}
.cal-marca-cfg{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cal-marca-cfg p{flex:1 0 100%;font-size:11.5px;color:var(--fg-faint);margin:6px 0 0;text-wrap:pretty}

.cal-pe{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin-top:14px;padding-top:11px;border-top:1px solid var(--line-soft);
  font-size:12px;color:var(--fg-dim)}

/* ---------- trajeto ---------- */
.rota{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.rota li{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px;position:relative}
.rota li:not(:last-child)::after{content:"";position:absolute;left:11px;top:29px;bottom:-3px;
  width:2px;background:var(--line)}
.rota li span{
  flex:0 0 auto;width:24px;height:24px;border-radius:50%;
  background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-family:var(--font-data);font-size:11px;z-index:1;
}

/* ---------- álbum de fotos ---------- */
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.foto{position:relative;margin:0;border-radius:10px;overflow:hidden;background:var(--surface-3);aspect-ratio:1}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto figcaption{
  position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;
  background:linear-gradient(to top, rgba(12,10,28,.85), rgba(12,10,28,0));
  color:#FFF6E8;display:flex;flex-direction:column;gap:1px;pointer-events:none;
}
.foto-tag{font-size:10.5px;font-weight:600;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foto-h{font-family:var(--font-data);font-size:9.5px;opacity:.85}
.foto-acoes{position:absolute;top:4px;right:4px;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.foto:hover .foto-acoes,.foto:focus-within .foto-acoes{opacity:1}
@media (hover:none){.foto-acoes{opacity:1}}
.foto-acoes button{
  background:rgba(12,10,28,.72);color:#FFF6E8;border:0;border-radius:6px;
  width:24px;height:24px;font-size:12px;line-height:1;cursor:pointer;padding:0;
}
.fotobtn{white-space:nowrap}

/* ---------- recibo ---------- */
.recibo-linha{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:12px}
.recibo-ok{font-size:12.5px;color:var(--ok);font-weight:600}

/* ---------- pré-visualização da viagem ---------- */
.simbar{background:var(--warn-bg);color:var(--fg);border:1px solid var(--warn);
  border-radius:9px;padding:7px 11px;margin:0 0 12px;font-size:12.5px}
.simbar button{background:none;border:0;padding:0;color:var(--accent);
  cursor:pointer;font:inherit;text-decoration:underline}

/* ---------- tempo de fila ---------- */
.filabar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;
  background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;
  padding:8px 10px;margin:0 0 12px;font-size:12.5px;color:var(--fg-dim)}

/* ---------- lançar gasto ---------- */

.folha-fundo{position:fixed;inset:0;background:rgba(10,16,26,.5);z-index:70}
.folha{
  position:fixed;left:0;right:0;bottom:0;z-index:71;
  background:var(--surface);border-radius:18px 18px 0 0;
  box-shadow:0 -8px 30px -10px rgba(10,16,26,.5);
  padding-bottom:env(safe-area-inset-bottom);
  max-height:88vh;overflow-y:auto;
}
@media (min-width:861px){
  .folha{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);
    width:min(420px,92vw);border-radius:16px}
}
.folha-hd{display:flex;align-items:center;justify-content:space-between;
  padding:15px 16px 10px;border-bottom:1px solid var(--line-soft)}
.folha-hd b{font-family:var(--font-display);font-size:18px}
.folha-bd{padding:14px 16px 18px}

/* ---------- hoje, durante a viagem ---------- */
.hoje-prox{background:var(--accent-soft);border-radius:9px;padding:8px 11px;margin:0 0 10px}
.hoje-prox b{display:block;font-size:14.5px;margin-top:1px}
.hoje-per{display:grid;grid-template-columns:74px 1fr;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line-soft)}
.hoje-per:last-of-type{border-bottom:0}
.hoje-per-l{font-family:var(--font-data);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-faint)}
.hoje-per-i{display:flex;flex-direction:column;gap:3px;font-size:13.5px;min-width:0}
.hoje-per-i b{font-family:var(--font-data);font-size:12.5px;color:var(--fg-dim)}
.hoje-res{color:var(--accent);font-weight:600}
.hoje-notas{font-size:12.5px;color:var(--fg-dim);margin:10px 0 0;padding-top:9px;border-top:1px solid var(--line-soft);text-wrap:pretty}

/* ---------- documentos ---------- */
.doc{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto 26px;gap:8px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line-soft)}
.doc:last-of-type{border-bottom:0}
.doc-i{font-size:17px;line-height:1}
.doc-txt{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.doc-txt b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-txt span{font-family:var(--font-data);font-size:11px;color:var(--fg-faint)}
.doc-add{display:inline-block;margin-top:10px;cursor:pointer}

/* ---------- previsão do tempo ---------- */
.clima{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;
  padding:8px 10px;margin:0 0 12px;font-size:13px;
}
.clima-i{font-size:19px;line-height:1}
.clima-t b{font-family:var(--font-display);font-size:19px}
.clima-min{color:var(--fg-dim)}
.clima-d{color:var(--fg-dim)}
.clima-upd{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--fg-faint);font-size:14px;padding:2px 4px;border-radius:6px}
.clima-upd:hover{color:var(--accent);background:var(--surface-3)}
.clima-vazio{color:var(--fg-dim);font-size:12.5px}
.diachip-c{font-size:10px;opacity:.9;margin-top:1px;white-space:nowrap}

/* ---------- abas de dia e períodos ---------- */
.diasbar{display:flex;min-width:0;max-width:100%;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 2px 10px;margin-bottom:4px;scroll-snap-type:x proximity}
.diachip{display:flex;flex-direction:column;align-items:center;gap:1px;flex:0 0 auto;padding:8px 12px;border-radius:12px;scroll-snap-align:start;line-height:1.15;position:relative}
.diachip .parkicon{margin-bottom:2px}
.diachip-d{font-family:var(--font-display);font-size:14px;letter-spacing:0;text-transform:none}
.diachip-w{font-size:10px;letter-spacing:.04em;opacity:.75;text-transform:none}
.diachip-n{position:absolute;top:3px;right:4px;font-size:9.5px;font-family:var(--font-data);
  background:var(--accent);color:var(--on-accent);border-radius:999px;padding:0 4px;min-width:14px;text-align:center}
.diachip[aria-pressed="true"] .diachip-n{background:var(--paper);color:var(--fg)}

.periodo{margin:0 0 12px}
.periodo-hd{
  display:flex;align-items:center;gap:8px;
  font-family:var(--font-data);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--fg-faint);margin:0 0 5px;
}
.periodo-hd::after{content:"";flex:1;height:1px;background:var(--line-soft);order:3}
.periodo-hd span{order:2;background:var(--surface-3);color:var(--fg-dim);border-radius:999px;padding:0 6px;font-size:10px}
.dayitem .mv{display:flex;flex-direction:column;gap:1px;flex:0 0 auto;width:22px}
.dayitem .mv button{
  background:none;border:0;cursor:pointer;color:var(--fg-faint);
  font-size:11px;line-height:1;padding:2px 0;border-radius:4px;
}
.dayitem .mv button:hover{color:var(--accent);background:var(--surface-3)}

/* ---------- linha de reserva ---------- */
.dinrow{display:grid;gap:6px;grid-template-columns:1fr 1fr;align-items:center}
.dinrow .wide{grid-column:1/-1}
@media (max-width:700px){
  /* dois campos por linha num iPhone truncam tudo: uma coluna só */
  .dinrow{grid-template-columns:1fr}
  .dinrow .wide{grid-column:auto}
}

/* ---------- tabela vira card no celular ----------
   Abaixo de 700px a tabela de 8 colunas não cabe num iPhone de 390px: cada
   linha vira um cartão com rótulo por campo, e o scroll lateral acaba. Os
   data-* e os handlers não mudam — só o desenho. */
@media (max-width:700px){
  .tw{overflow-x:visible}
  table{min-width:0;display:block}
  thead{display:none}
  tbody,tfoot{display:block}
  tbody tr{
    display:grid;grid-template-columns:84px minmax(0,1fr);gap:3px 10px;align-items:center;
    padding:11px 38px 11px 13px;margin-bottom:9px;position:relative;
    background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r);
  }
  tbody td{display:contents}
  tbody td::before{
    content:attr(data-l);
    font-family:var(--font-data);font-size:10px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--fg-faint);line-height:1.25;
  }
  tbody td > *{width:100%;min-width:0}
  /* valor colado no rótulo, não jogado na borda oposta do cartão */
  tbody td.num,
  tbody td.num input,
  tbody td.num select{text-align:left}
  tbody td input[type=text],
  tbody td input[type=number],
  tbody td select{border-color:var(--line-soft);background:var(--surface);padding:6px 8px}
  /* a célula sem rótulo é o botão de apagar: vai para o canto do cartão em vez
     de ocupar uma linha inteira */
  tbody td:not([data-l]){display:block;position:absolute;top:8px;right:8px;width:auto}
  tbody td:not([data-l])::before{content:none}
  tbody td:not([data-l]) > *{width:auto}
  tbody tr.done{opacity:1}
  tbody tr.done td[data-l="Item"] > *{opacity:.5;text-decoration:line-through}
  tfoot tr{display:flex;justify-content:space-between;gap:10px;padding:11px 13px}
  tfoot td{border:0;padding:0}
  table input[type=number]{max-width:none}
}

/* A estrutura antiga (rail + mobhd + bottomnav condicional) foi substituída
   pelo cabeçalho fixo com hambúrguer e a barra de ações, que valem em qualquer
   largura. Sobrou só o que é específico de tela estreita. */
@media (max-width:700px){
  table{min-width:0}
}

/* Roteiro real: voo (e chegada) fixam os dois primeiros dias e o embarque de
   volta fixa os dois últimos; só o miolo em Orlando é distribuído. Função pura
   (não toca em S) para poder rodar tanto no seed() quanto no botão da tela,
   e ser testável sem estado global. Retorna null se a janela for curta demais.
   Depende só de daysRange/d/iso (declaradas mais abaixo, mas hoisted) e de
   PARKS acima — nunca de S, que ainda não existe quando o seed() chama isto. */
function sugerirRoteiro(trip){
  const days = daysRange(trip.start, trip.end);
  const n = days.length;
  if(n < 6) return null;

  const plano = {};
  plano[days[0]] = {park:"none",
    notes:"Voo internacional (madrugada, saindo do Brasil). Sem compromisso na Flórida ainda — dia de embarque."};
  plano[days[1]] = {park:"off",
    notes:"Pouso em Miami às 7h. Retirar o carro alugado, instalar as cadeirinhas e seguir direto para Orlando (~3h40 de estrada). Chegando: check-in, mercado e descanso — sem parque hoje."};

  const backIdx = n-3, miamiIdx = n-2, lastIdx = n-1;
  plano[days[backIdx]] = {park:"off",
    notes:"Orlando → Miami (~3h40 de estrada). Devolver o carro ou deixar para o dia seguinte, conforme a reserva."};
  plano[days[miamiIdx]] = {park:"mia",
    notes:"Dia inteiro em Miami — praia e descanso, sem pressa nenhuma."};
  plano[days[lastIdx]] = {park:"mia",
    notes:"Voo de volta às 19h. Aproveitem a manhã em Miami e saiam para o aeroporto com pelo menos 3h de folga — voo internacional pede check-in antecipado."};

  /* Os quatro parques espalhados pelos dias de Orlando; o que sobra vira
     descanso. Posicional em vez de ciclo fixo: um ciclo pode deixar o Epic
     Universe de fora dependendo de quantos dias cabem no miolo. */
  const PARQUES = ["mk","hs","ak","ue"];
  const orlandoIdx = [];
  for(let i = 2; i < backIdx; i++) orlandoIdx.push(i);
  const m = orlandoIdx.length;
  const cabem = Math.min(PARQUES.length, m);

  const parkNaPos = {};
  for(let i = 0; i < cabem; i++){
    const pos = cabem === 1 ? 0 : Math.round(i * (m-1) / (cabem-1));
    parkNaPos[pos] = PARQUES[i];
  }

  const folga = ["none","ds"];
  let f = 0;
  orlandoIdx.forEach((idx, pos) => {
    const p = parkNaPos[pos] || folga[f++ % folga.length];
    plano[days[idx]] = {park:p, notes:ROTEIRO_NOTAS[p] || ""};
  });

  const foraDoRoteiro = PARQUES.slice(cabem);
  if(foraDoRoteiro.length){
    plano[days[lastIdx]].notes += ` ATENÇÃO: não coube no roteiro — ${foraDoRoteiro.map(p => PARKS[p].n).join(", ")}. Adicione mais dias em Orlando.`;
  }

  return plano;
}

let saveTimer;
/* bump=false para mudanças só de interface (aba, filtro): não conta como
   alteração de dado e portanto não dispara conflito de sincronização. */
function save(bump){
  if(bump !== false){
    /* Carimba comparando com o retrato tirado antes do handler rodar. Um lugar
       só em vez de 25: pega também aplicarSugestao, limparRoteiro e reset, que
       trocam o state em bloco. */
    if(retratoAntes) carimbar(retratoAntes);
    S.updatedAt = Date.now();
  }
  clearTimeout(saveTimer);
  const el = document.getElementById("saveState");
  if(el) el.textContent = "salvando…";
  saveTimer = setTimeout(() => {
    try{
      localStorage.setItem(KEY, JSON.stringify(S));
      if(el) el.textContent = rotuloSalvo();
    }catch(e){ if(el) el.textContent = "erro ao salvar"; }
  }, 300);
}

const pendente = () => !!S.sync.url && S.updatedAt > (S.lastSync||0);

/* ---------- rede e rótulo de estado (F3) ----------
   O mesmo arquivo abre no navegador do computador, então tudo que é nativo
   passa por esta guarda e degrada para o comportamento web. */
const NATIVE = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());

let comRede = navigator.onLine !== false;

/* Quatro estados, sempre com texto além da cor. */
function rotuloSalvo(){
  if(sincronizando) return "sincronizando…";
  if(!pendente())   return "salvo";
  return comRede ? "salvo · sync pendente" : "salvo · offline";
}
function rotuloBotao(curto){
  if(!S.sync.url) return curto ? "Sync ⚙" : "Configurar sync";
  if(sincronizando) return curto ? "Sync…" : "Sincronizando…";
  if(!comRede && pendente()) return curto ? "Off •" : "Offline •";
  if(!comRede) return curto ? "Off" : "Offline";
  return pendente() ? (curto ? "Sync •" : "Sincronizar •") : (curto ? "Sync" : "Sincronizar");
}

function d(iso){ const [y,m,dd] = iso.split("-").map(Number); return new Date(y, m-1, dd); }
function iso(dt){ return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); }
function today(){ const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function diffDays(a,b){ return Math.round((b-a)/86400000); }

function daysRange(startIso, endIso){
  const out = [];
  const a = d(startIso), b = d(endIso);
  if(isNaN(a) || isNaN(b) || b < a) return out;
  for(let cur = new Date(a); cur <= b && out.length < 60; cur.setDate(cur.getDate()+1)) out.push(iso(cur));
  return out;
}

function tripDays(){
  return daysRange(S.trip.start, S.trip.end);
}

/* Só http(s): um "javascript:" colado aqui viraria execução no toque seguinte,
   e o link fica salvo e sincronizado — o que o outro celular abriria também. */
function editarLinkAttr(id){
  const v = prompt("Link do mapa ou da página desta atração.\nDeixe vazio para voltar à busca no Google Maps:", linkAttr(id));
  if(v === null) return;
  const url = v.trim();
  if(url && !/^https?:\/\//i.test(url)){ alert("Só link começando com http:// ou https://"); return; }
  S.attrLinks = Object.assign({}, S.attrLinks);
  if(url) S.attrLinks[id] = url; else delete S.attrLinks[id];
  save(); render();
}

/* Mapa embutido de verdade — Maps Embed API oficial do Google, que exige
   uma chave (gratuita, com cota generosa). O truque antigo sem chave
   (output=embed) foi bloqueado pelo Google ("This content is blocked") e
   não é mais confiável. A chave fica só neste aparelho (aba Backup), igual
   à chave do sync — nunca entra no payload nem no código de transferência.
   Um único local vira um pino (endpoint /place); dois ou mais viram uma
   rota com pino em cada parada (endpoint /directions). Confirmado pelo
   console do navegador: o Artifact publicado no claude.ai barra QUALQUER
   iframe externo — "frame-src 'self' blob: data:" — então o mapa nunca
   vai aparecer ali, com chave válida ou não; isso não tem conserto por
   configuração de chave, só hospedando o arquivo fora do claude.ai. Por
   isso todo embed vem com um link "abrir no Maps" sem chave, que funciona
   sempre — dentro ou fora do Artifact. O checklist de configuração da
   chave (aba Backup) só se aplica quando já se está fora do claude.ai. */
const MAX_MAP_STOPS = 9;

function mapEmbedUrl(stops, key){
  if(!key) return "";
  const base = "https://www.google.com/maps/embed/v1/";
  if(stops.length === 1){
    return base + "place?key=" + encodeURIComponent(key) + "&q=" + encodeURIComponent(stops[0]);
  }
  const meio = stops.slice(1, -1);
  return base + "directions?key=" + encodeURIComponent(key) +
    "&origin=" + encodeURIComponent(stops[0]) +
    "&destination=" + encodeURIComponent(stops[stops.length-1]) +
    (meio.length ? "&waypoints=" + meio.map(encodeURIComponent).join("|") : "");
}
function mapDirLinkFromStops(stops){
  if(stops.length === 1) return mapUrl(stops[0]);
  const meio = stops.slice(1, -1);
  return "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(stops[0]) +
    "&destination=" + encodeURIComponent(stops[stops.length-1]) +
    (meio.length ? "&waypoints=" + meio.map(encodeURIComponent).join("|") : "");
}
function mapEmbedBlock(stopsIn, opts){
  const stops = stopsIn.filter(Boolean);
  if(!stops.length) return "";
  const cortadas = Math.max(0, stops.length - MAX_MAP_STOPS);
  const usaveis = cortadas ? stops.slice(0, MAX_MAP_STOPS) : stops;
  const height = (opts && opts.height) || 220;
  const label = (opts && opts.label) || "mapa";
  const key = S.mapsKey;
  return `<div class="mapembed-wrap">
    ${key
      ? `<iframe class="mapembed" style="height:${height}px" src="${mapEmbedUrl(usaveis, key)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="${esc(label)}"></iframe>`
      : `<div class="mapembed mapembed-empty" style="height:${Math.min(height,110)}px"><span>Configure sua chave gratuita do Google Maps em <b>Ajustes</b> para ver o mapa aqui. Enquanto isso, use o link “abrir no Google Maps” logo abaixo — ele não depende de chave nenhuma.</span></div>`}
    <div class="row" style="margin-top:7px;gap:8px">
      <a class="pill neutral linkpill" href="${mapDirLinkFromStops(stops)}" target="_blank" rel="noopener noreferrer">abrir no Google Maps ↗</a>
      <span class="eyebrow">se o mapa não aparecer acima, use este link — no claude.ai publicado, é sempre o caminho certo</span>
    </div>
    ${cortadas ? `<p style="font-size:12px;color:var(--fg-faint);margin:6px 0 0">+${cortadas} local(is) marcados não coube${cortadas===1?"":"ram"} no mapa (limite do link de rota) — continuam na lista abaixo.</p>` : ""}
  </div>`;
}

/* Locais marcados (checkbox) dentro de um parque/pseudo-parque, formatados
   para busca no Maps. Reaproveitado pelo mapa do dia e pelo mapa do parque. */
function checkedStops(pk){
  const list = ATTR[pk] || [];
  const sufixo = (pk === "mia" || pk === "off") ? ", FL" : " Orlando FL";
  return list.filter((a,i) => S.checks[attrId(pk,i,a[0])]).map(a => a[0] + " " + PARKS[pk].n + sufixo);
}

/* Paradas do dia para o mapa do roteiro: hotel da cidade certa, o próprio
   parque, e os itens que a família cadastrou para o dia — em ordem de
   horário, que é o "alinhados" que faz o mapa desenhar a rota do dia na
   sequência certa. Nos dias de estrada, os itens vêm depois da rota
   Miami↔Orlando; no dia de voo, só os itens contam (não há base fixa). */
/* Períodos do dia. A ordem do array é a ordem em que aparecem. */
const PERIODOS = [
  {id:"madrugada", label:"Madrugada", ini:0,  fim:5},
  {id:"manha",     label:"Manhã",     ini:6,  fim:11},
  {id:"tarde",     label:"Tarde",     ini:12, fim:17},
  {id:"noite",     label:"Noite",     ini:18, fim:23}
];
const PERIODO_PADRAO = "manha";
const idxPeriodo = (p) => { const i = PERIODOS.findIndex(x => x.id === p); return i < 0 ? 1 : i; };

/* Reserva tem hora de verdade e cai no período dela sozinha. */
function periodoDaHora(hora){
  const h = parseInt(String(hora||"").slice(0,2), 10);
  if(isNaN(h)) return PERIODO_PADRAO;
  return (PERIODOS.find(p => h >= p.ini && h <= p.fim) || {id:PERIODO_PADRAO}).id;
}

/* Item antigo só tem hora: o período sai dela. Sem nada, vai para a manhã. */
const periodoDoItem = (it) => it && it.periodo ? it.periodo : periodoDaHora(it && it.hora);

/* Período primeiro, depois a ordem escolhida à mão, e a hora só desempata. */
function dayItemsSorted(items){
  return (items||[]).filter(i => i.nome && i.nome.trim()).slice().sort((a,b) =>
       idxPeriodo(periodoDoItem(a)) - idxPeriodo(periodoDoItem(b))
    || (a.ord ?? 999) - (b.ord ?? 999)
    || (a.hora||"99:99").localeCompare(b.hora||"99:99")
    || String(a.nome).localeCompare(String(b.nome), "pt-BR"));
}
/* Em que cidade a família amanhece. No dia de estrada quem manda é o sentido
   escrito nas notas: "para Orlando" quer dizer que se dorme em Miami. */
function cidadeDoDia(pk, notes){
  if(pk === "mia") return "miami";
  if(pk === "off") return /para Orlando/.test(notes||"") ? "miami" : "orlando";
  return "orlando";
}

/* "Nenhum parque" cobre dias bem diferentes. No primeiro deles a família está
   chegando: o voo sai do Brasil, e não existe ponto de saída na Flórida nem
   que o check-in do hotel seja daquele mesmo dia. O último dia é o contrário
   — sai-se da hospedagem para o aeroporto — e o dia livre no meio sai da
   hospedagem como qualquer outro dia. */
function ehDiaDeChegada(dt, pk){
  if(pk !== "none") return false;
  const ds = tripDays();
  return !ds.length || dt === ds[0];
}

/* Todo dia começa de onde a família dormiu — hotel ou airbnb do período.
   As datas de entrada e saída do hotel mandam; sem datas preenchidas, cai no
   palpite pela cidade do dia, que é o que existia antes.
   O dia de chegada é a exceção que vence até as datas: com check-in marcado
   para o dia do pouso, o mapa diria que o dia começa no airbnb de Miami — e o
   dia começa num voo saindo do Brasil. */
function hospedagemDoDia(dt, pk, notes){
  if(ehDiaDeChegada(dt, pk)) return null;
  const hs = (S.hotels || []).filter(h => h && (h.endereco || (h.nome||"").trim()));

  /* Havendo qualquer data preenchida, elas mandam sozinhas — misturar com o
     palpite pela cidade daria respostas contraditórias no mesmo roteiro. */
  const comData = hs.filter(h => h.de && h.ate);
  if(comData.length){
    const cobre = comData.filter(h => dt && dt >= h.de && dt <= h.ate);
    /* Só conta a hospedagem em que se dormiu na véspera (dt depois da entrada).
       No dia do próprio check-in ela é destino, não origem: quem chega vem de
       outro lugar — do aeroporto, ou da hospedagem anterior, que aparece aqui
       por ter a saída marcada para hoje. Decidir por data, e não pela ordem da
       lista, mantém a resposta igual se a família reordenar as hospedagens. */
    return cobre.find(h => dt > h.de) || null;
  }

  const cidade = cidadeDoDia(pk, notes);
  return hs.find(h => (h.cidade||"").toLowerCase().includes(cidade)) || null;
}
const enderecoHotel = (h) => h.endereco || ((h.nome||"") + " " + (h.cidade||"")).trim();

/* Nem todo item do dia é um lugar: "Voo GRU → Miami", "Trecho Miami → Orlando"
   e "Café (a decidir)" são linha de roteiro, não parada. Marcados como semMapa,
   continuam na programação e somem da rota — antes viravam pino em cima do que
   o Google achasse com aquele texto. */
const ehLugar = (it) => !it.semMapa;

function dayStops(pk, notes, items, dt){
  const nomes = dayItemsSorted(items).filter(ehLugar);
  const h = hospedagemDoDia(dt, pk, notes);
  const saida = h ? [enderecoHotel(h)] : [];

  if(pk === "off"){
    /* Dia de estrada é uma rota de verdade: começa onde se dormiu, termina
       onde se vai dormir, e o que se para no caminho fica no meio. A cidade
       genérica só entra quando falta a hospedagem daquela ponta — ninguém sai
       de "Orlando" para "Orlando". */
    const chega = chegadaDoDia(dt);
    const destino = chega && (!h || chega.id !== h.id) ? enderecoHotel(chega) : null;
    const origem = saida.slice();
    let fim = [];
    if(/Orlando\s*→\s*Miami/.test(notes)){
      if(!origem.length) origem.push("Orlando, FL");
      fim = [destino || "Miami International Airport, FL"];
    }else if(/para Orlando/.test(notes)){
      if(!origem.length) origem.push("Miami International Airport, FL");
      fim = [destino || "Orlando, FL"];
    }
    const meio = nomes.map(i => (i.end && i.end.trim()) ? i.end.trim() : i.nome + " Orlando FL");
    return origem.concat(meio, fim);
  }
  if(pk === "none") return saida.concat(nomes.map(i => (i.end && i.end.trim()) ? i.end.trim() : i.nome));

  const stops = saida.slice();
  /* "Miami" não é destino, é a cidade inteira: como parada vira um ponto no
     meio do mapa que ninguém vai visitar. Só entra quando o dia não tem mais
     nada marcado. Parque de verdade é o contrário — ele é o destino. */
  if(pk !== "mia" || !nomes.length)
    stops.push(PARKS[pk].n + (pk === "mia" ? ", FL" : " Orlando FL"));
  const sufixo = pk === "mia" ? " Miami FL" : " Orlando FL";
  stops.push(...nomes.map(i => (i.end && i.end.trim()) ? i.end.trim() : i.nome + sufixo));
  return stops;
}

/* O ponto de saída fica escrito no dia, não só desenhado no mapa: é a
   primeira decisão da manhã e quem confere o roteiro na véspera não vai abrir
   o Google Maps para descobrir de onde sai. */
/* Hospedagem cujo check-in é justamente hoje: o dia termina nela. */
const chegadaDoDia = (dt) => (S.hotels || []).find(h => h && h.de && h.de === dt) || null;

function blocoSaida(dt, pk, notes){
  const h = hospedagemDoDia(dt, pk, notes);
  if(!h){
    if(ehDiaDeChegada(dt, pk)) return "";   /* chegando: não há de onde sair ainda */
    /* Dia de check-in vindo de fora não tem ponto de saída e também não tem
       nada faltando — avisar ali seria cobrar um cadastro que já existe. O que
       ajuda é dizer para onde o dia vai. */
    const chega = chegadaDoDia(dt);
    if(chega) return linhaSaida("chega em", chega, "saida-chega");
    return `<p class="saida saida-vazia">Sem hospedagem para este dia — cadastre em <b>Ajustes › Hospedagem</b>, com as datas de entrada e saída, e o roteiro passa a sair de lá.</p>`;
  }
  /* Dia de mudança: sai de uma e dorme na outra. As duas linhas, porque é
     justamente o dia em que se procura o endereço da próxima. */
  const chega = chegadaDoDia(dt);
  return linhaSaida("sai de", h)
    + (chega && chega.id !== h.id ? linhaSaida("chega em", chega, "saida-chega") : "");
}

function linhaSaida(rotulo, h, cls){
  return `<p class="saida ${cls||""}"><span class="eyebrow">${rotulo}</span>
    <b>${esc(h.nome || "Hospedagem")}</b>${h.endereco ? `<span> · ${esc(h.endereco)}</span>` : ""}
    <a class="pill neutral linkpill" href="${esc(mapUrl(enderecoHotel(h)))}" target="_blank" rel="noopener noreferrer">mapa ↗</a></p>`;
}

/* Ponte entre Restaurantes e o roteiro: uma reserva com dia atribuído
   entra sozinha na programação daquele dia, lado a lado com os itens
   manuais — sem duplicar cadastro em dois lugares. */
function diningForDay(dt){
  return S.dining.filter(r => r.dia === dt && r.nome && r.nome.trim());
}
function mergedDayItems(dt, day){
  const manuais = (day.items || []).map(it => ({
    id:it.id, hora:it.hora, nome:it.nome, attr:it.attr, end:it.end, semMapa:it.semMapa,
    periodo:periodoDoItem(it), ord:it.ord ?? 999, fonte:"item"
  }));
  const reservas = diningForDay(dt).map(r => ({
    id:r.id, hora:r.hora, nome:r.nome,
    periodo:periodoDaHora(r.hora), ord:-1, fonte:"dining"   /* reserva encabeça o período */
  }));
  return dayItemsSorted(manuais.concat(reservas));
}

/* Parque de um id de atração: "at|mk4|Jungle Cruise" → "mk" */
function parqueDoAttr(id){
  const m = /^at\|([a-z]+)\d+\|/.exec(String(id||""));
  return m ? m[1] : null;
}
function nomeDoAttr(id){ return String(id||"").split("|").slice(2).join("|"); }

/* Primeiro dia do roteiro marcado com aquele parque. */
function diaDoParque(pk){
  return tripDays().find(dt => (S.days[dt]||{}).park === pk) || null;
}

/* Próxima posição livre dentro do período, para o item novo entrar no fim. */
function proximaOrd(dt, periodo){
  const its = ((S.days[dt]||{}).items || []).filter(i => periodoDoItem(i) === periodo);
  return its.reduce((m,i) => Math.max(m, i.ord ?? 0), -1) + 1;
}

function landId(pk, land){ return "land-" + pk + "-" + land.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-"); }

function checkId(kind, a, b){ return kind + "|" + a + "|" + b; }

function allCheckItems(){
  return CHECK.map((c,i) => ({id:checkId("ck", i, c[1]), grupo:c[0], titulo:c[1], det:c[2], custom:false}))
    .concat(S.extraCheck.map(x => ({id:x.id, grupo:x.grupo, titulo:x.titulo, det:"", custom:true})));
}

function progress(ids){
  const done = ids.filter(i => S.checks[i]).length;
  return {done, total:ids.length, pct: ids.length ? Math.round(done/ids.length*100) : 0};
}

function attrId(pk, i, nome){ return checkId("at", pk + i, nome); }

/* O id de atração leva o índice na lista ("at|mk4|Jungle Cruise"). Uma atração
   que fecha e sai do ATTR renumera todas as seguintes, e aí a marca da família,
   a foto etiquetada e o item que veio para o roteiro apontam para um id que não
   existe mais — tudo somindo em silêncio.
   Em vez de congelar as listas, o app conserta na carga: marca cujo NOME ainda
   existe naquele parque é remapeada para o id novo. Quem realmente fechou é
   descartado, que é o que se quer. Roda em todo aparelho, então a próxima
   revisão das listas sai de graça.
   Os carimbos vão junto: sem mover u/del, o outro celular ressuscitaria o id
   velho no merge seguinte. */
function migrarIdsDeAtracao(){
  const porNome = {};
  for(const pk in ATTR)
    ATTR[pk].forEach((a,i) => { porNome[pk + "␀" + a[0]] = attrId(pk, i, a[0]); });

  /* id antigo → novo, para tudo que aponta para atração */
  const novo = (id) => {
    const pk = parqueDoAttr(id);
    if(!pk) return id;                                    /* não é id de atração */
    return porNome[pk + "␀" + nomeDoAttr(id)] || null; /* null = fechou */
  };

  let mexeu = 0;
  const agora = Date.now();
  S.u = S.u || {}; S.del = S.del || {};

  const checks = {}, links = {};
  for(const id in S.checks){
    const n = novo(id);
    if(n === id){ checks[id] = S.checks[id]; continue; }
    mexeu++;
    if(n){
      checks[n] = S.checks[id];
      S.u["checks:" + n] = S.u["checks:" + id] || agora;
      if(S.attrLinks && S.attrLinks[id]) links[n] = S.attrLinks[id];
    }
    S.del["checks:" + id] = agora; delete S.u["checks:" + id];
    if(S.attrLinks && S.attrLinks[id]){
      S.del["attrLinks:" + id] = agora; delete S.u["attrLinks:" + id];
      if(n) S.u["attrLinks:" + n] = agora;
    }
  }
  S.checks = checks;
  for(const id in S.attrLinks || {}) if(novo(id) === id) links[id] = S.attrLinks[id];
  S.attrLinks = links;

  for(const dt in S.days || {}){
    const its = (S.days[dt] || {}).items || [];
    for(const it of its){
      if(!it.attr) continue;
      const n = novo(it.attr);
      if(n === it.attr) continue;
      mexeu++;
      /* Atração que fechou não deixa o programa órfão no dia: o item fica,
         perde o vínculo e passa a ser linha escrita à mão. Apagar programa de
         dia por causa de uma lista minha seria decidir demais. */
      it.attr = n || null;
      S.u["days:" + dt + ":items:" + it.id] = agora;
    }
  }

  for(const f of S.fotos || []){
    if(!f.attr) continue;
    const n = novo(f.attr);
    if(n !== f.attr){ f.attr = n || null; mexeu++; }
  }

  return mexeu;
}

const kids = () => S.family.filter(f => f.tipo !== "adulto");

/* Retorna estado de altura para uma atração: null (livre) ou lista por criança */
function heightInfo(minCm){
  if(!minCm) return null;
  return kids().map(k => ({nome:k.nome, ok:(k.altura||0) >= minCm, falta: Math.max(0, minCm - (k.altura||0))}));
}

/* ============================== 4. NAVEGAÇÃO ============================== */

/* A barra de baixo é de AÇÃO, não de navegação: as três coisas que se faz
   dentro do parque, com o polegar, sem procurar. Planejar mora no menu. */
const TABS = [
  {id:"hoje",       label:"Hoje",       short:"Hoje"},
  {id:"fotos",      label:"Fotos",      short:"Fotos"},
  {id:"documentos", label:"Documentos", short:"Docs"},
  {id:"gastos",     label:"Gastos",     short:"Gastos"}
];

/* Hoje saiu da gaveta e foi para a barra: é a tela de volta, e voltar não pode
   custar dois toques. Nenhum id fica nos dois menus. */
const MENU = [
  {id:"roteiro", label:"Roteiro", desc:"os dias e as reservas"},
  {id:"mapa",    label:"Mapa",    desc:"trajeto do dia, parada a parada"},
  {id:"parques", label:"Parques", desc:"119 atrações, régua de altura, filas"},
  {id:"listas",  label:"Listas",  desc:"checklist, compras e orçamento"},
  {id:"ajustes", label:"Ajustes", desc:"datas, família, sync e backup"}
];

/* Segmentos dentro de Roteiro e Listas. Preferência de tela, não dado de
   viagem — por isso `seg` está em LOCAL_ONLY. */
const SEGS = {
  roteiro: [{id:"dias", label:"Dias"}, {id:"reservas", label:"Reservas"}],
  listas:  [{id:"checklist", label:"Checklist"}, {id:"compras", label:"Compras"}, {id:"orcamento", label:"Orçamento"}]
};

/* Listas ganha um segmento por lista própria, além dos três fixos. */
function segsDe(aba){
  if(aba !== "listas") return SEGS[aba];
  return SEGS.listas.concat((S.listas || []).map(l => ({id:l.id, label:l.nome || "Lista"})));
}

function segAtual(aba){
  const opts = segsDe(aba).map(x => x.id);
  const v = (S.seg || {})[aba];
  return opts.includes(v) ? v : opts[0];
}

function barraSeg(aba, extra){
  const itens = segsDe(aba).map(x =>
    `<button class="chip" type="button" data-seg="${aba}" data-segid="${x.id}" aria-pressed="${segAtual(aba)===x.id}">${esc(x.label)}${
      extra && extra[x.id] ? ` <span style="opacity:.7">${extra[x.id]}</span>` : ""}</button>`).join("");
  const mais = aba === "listas"
    ? `<button class="chip chip-mais" type="button" data-act="listaNova" title="Criar uma lista">+ lista</button>`
    : "";
  return `<div class="filters">${itens}${mais}</div>`;
}

function renderNav(){
  const ck = progress(allCheckItems().map(c => c.id));
  const shopDone = S.shop.filter(s => s.done).length;
  const counts = {
    listas: ck.done + "/" + ck.total,
    fotos: S.fotos.length || "",
    documentos: S.docs.length || "",
    gastos: S.gastos.length || ""
  };

  const ico = (id) => `<svg class="ico" aria-hidden="true"><use href="#ico-${id}"/></svg>`;

  /* Gaveta: as telas de planejar */
  document.getElementById("nav").innerHTML = MENU.map(m =>
    `<button type="button" data-tab="${m.id}" aria-current="${S.tab===m.id}">
       <span class="lbl">${ico(m.id)}<span><b>${m.label}</b><span>${m.desc}</span></span></span>
       ${counts[m.id] ? `<span class="cnt">${counts[m.id]}</span>` : ""}
     </button>`).join("");

  /* Barra de baixo: as ações do parque */
  document.getElementById("navMob").innerHTML = TABS.map(t =>
    `<button type="button" data-tab="${t.id}" aria-current="${S.tab===t.id}">
       ${ico(t.id)}<span>${t.short}</span>${counts[t.id] ? `<span class="cnt">${counts[t.id]}</span>` : ""}
     </button>`).join("");

  const a = d(S.trip.start), b = d(S.trip.end);
  document.getElementById("railDates").textContent =
    isNaN(a) || isNaN(b) ? "defina as datas" :
    `${a.getDate()} ${MO[a.getMonth()]} — ${b.getDate()} ${MO[b.getMonth()]} ${b.getFullYear()}`;

  const sb = document.getElementById("syncBtn");
  if(sb){
    sb.textContent = rotuloBotao(true);   /* no cabeçalho só cabe a forma curta */
    sb.classList.toggle("pend", pendente());
  }
  const el = document.getElementById("saveState");
  if(el) el.textContent = rotuloSalvo();
}

/* ============================== 5. TELAS ============================== */

/* Antes de embarcar a tela é de preparo; durante, é o dia de hoje; depois,
   é o fechamento de contas. A spec F5 pedia isso e ficou faltando. */
function faseViagem(){
  /* Três telas só existem durante a viagem — e isso as deixava impossíveis de
     conferir antes de embarcar, que é justamente quando dá tempo de consertar.
     O interruptor em Ajustes força a fase para poder testar. */
  if(S.simularViagem) return "durante";
  const a = d(S.trip.start), b = d(S.trip.end);
  if(isNaN(a) || isNaN(b)) return "antes";
  const h = today();
  if(diffDays(h, a) > 0) return "antes";
  return diffDays(h, b) >= 0 ? "durante" : "depois";
}

/* O dia de hoje, do jeito que interessa dentro do parque: onde é, que tempo
   faz, o que está planejado e o que vem a seguir. Editar continua no Roteiro. */
function blocoHojeNoRoteiro(){
  const dias = tripDays();
  let hj = iso(today());
  /* Pré-visualizando antes de embarcar, hoje não é um dia do roteiro: mostra o
     primeiro dia para dar para conferir a tela. */
  if(!dias.includes(hj)){
    if(!S.simularViagem || !dias.length) return "";
    hj = dias[0];
  }

  const day = S.days[hj] || {};
  const pk = parkOf(day.park || "none");
  const itens = mergedDayItems(hj, day);
  const idx = dias.indexOf(hj) + 1;

  /* "a seguir" = a próxima coisa com hora marcada que ainda não passou */
  const agora = new Date();
  const hhmm = String(agora.getHours()).padStart(2,"0") + ":" + String(agora.getMinutes()).padStart(2,"0");
  const proximo = itens.filter(i => i.hora && i.hora > hhmm).sort((a,b) => a.hora.localeCompare(b.hora))[0];

  const blocos = PERIODOS.map(per => {
    const doP = itens.filter(i => i.periodo === per.id);
    if(!doP.length) return "";
    return `<div class="hoje-per">
      <span class="hoje-per-l">${per.label}</span>
      <span class="hoje-per-i">${doP.map(i =>

      ${blocoClima(hj, pk)}
      ${blocoSaida(hj, pk, day.notes||"")}
      ${proximo ? `<div class="hoje-prox"><span class="eyebrow">a seguir</span>

      ${day.notes ? `<p class="hoje-notas">${esc(day.notes)}</p>` : ""}
    </div>
  </div>`;
}

  const days = tripDays();
  const start = d(S.trip.start);
  const falta = isNaN(start) ? null : diffDays(today(), start);

  const ck = progress(allCheckItems().map(c => c.id));
  const shopDone = S.shop.filter(s => s.done).length;
  const orcBRL = S.budget.reduce((t,b) => t + toBRL(b.plan, b.cur), 0);
  const realBRL = S.budget.reduce((t,b) => t + toBRL(b.real, b.cur), 0);

  const planNow = allCheckItems().filter(c => c.grupo === "Disney — janelas de tempo" && !S.checks[c.id]);
  const docNow  = allCheckItems().filter(c => c.grupo === "Documentos" && !S.checks[c.id]);

  const parkDays = days.filter(x => S.days[x] && ["mk","ak","hs","ue"].includes(S.days[x].park)).length;

  let countdown, cdNote;
  if(falta === null){ countdown = "—"; cdNote = "Defina as datas abaixo."; }
  else if(falta > 0){ countdown = falta; cdNote = falta === 1 ? "dia para embarcar" : "dias para embarcar"; }
  else if(falta <= 0 && diffDays(today(), d(S.trip.end)) >= 0){ countdown = "AGORA"; cdNote = "Vocês estão na viagem"; }

      <p style="margin:6px 0 0">Fim de agosto na Flórida é calor alto com umidade e chuva quase todo fim de tarde. Com 4 anos e 1a10m o que funciona é: entrar na abertura, sair por volta das 13h, dormir e piscina no hotel, e voltar à noite só se ainda houver energia. Tentar ficar o dia inteiro derruba a família no dia seguinte. Some a isso os dois trechos de estrada entre Miami e Orlando, que consomem um dia cada, e sobram quatro dias de parque em dez de viagem — que é exatamente o desenho do roteiro sugerido.</p>
    </div>

  </div>`;

/* Os três cards de configuração da viagem, hoje em Ajustes › Viagem. */
function blocoViagem(){
  return `
    <div class="card">
      <div class="card-hd"><h2>Datas e cotação</h2></div>
      <div class="card-bd">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px">
          <label class="f"><span>Ida</span><input type="date" data-trip="start" value="${esc(S.trip.start)}"></label>
          <label class="f"><span>Volta</span><input type="date" data-trip="end" value="${esc(S.trip.end)}"></label>
          <label class="f"><span>Cotação do dólar</span><input type="number" step="0.01" min="0" data-trip="rate" value="${S.trip.rate}"></label>
        </div>
        <p style="font-size:12.5px;color:var(--fg-dim);margin:10px 0 0">Use a cotação real do seu cartão, já com IOF — é ela que vale no orçamento, não a do noticiário.</p>

        <label class="item" style="margin-top:14px;align-items:flex-start">
          <input type="checkbox" data-simular ${S.simularViagem ? "checked" : ""}>
          <span class="txt">
            <b>Ver como fica durante a viagem</b>
            <p>Duas telas só aparecem entre ${S.trip.start ? fmtDia(S.trip.start) : "a ida"} e ${S.trip.end ? fmtDia(S.trip.end) : "a volta"}: o <b>dia de hoje</b> no topo da Home e o <b>Onde estacionei</b>. Ligue aqui para conferir agora — não muda dado nenhum, e não sincroniza. O botão <b>+ Gasto</b> fica sempre visível.</p>
          </span>
        </label>
      </div>
    </div>

    <div class="card">
      <div class="card-hd">
        <h2>Quem vai</h2>
        <button class="btn ghost sm" type="button" data-act="addFam">+ pessoa</button>
      </div>
      <div class="card-bd">
        <div class="tw"><table>
          <thead><tr><th>Nome</th><th>Tipo</th><th class="num">Altura (cm)</th><th></th></tr></thead>
          <tbody>${S.family.map(f => `
            <tr>
              <td data-l="Nome"><input type="text" data-fam="${f.id}" data-k="nome" value="${esc(f.nome)}"></td>
              <td data-l="Tipo"><select data-fam="${f.id}" data-k="tipo">
                ${["adulto","crianca","bebe"].map(t => `<option value="${t}" ${f.tipo===t?"selected":""}>${t==="adulto"?"Adulto":t==="crianca"?"Criança":"Bebê"}</option>`).join("")}
              </select></td>
              <td class="num" data-l="Altura (cm)"><input type="number" min="0" max="230" data-fam="${f.id}" data-k="altura" value="${f.altura}"></td>
              <td style="width:34px"><button class="del" type="button" data-act="delFam" data-id="${f.id}" aria-label="Remover">×</button></td>
            </tr>`).join("")}</tbody>
        </table></div>
        <p style="font-size:12.5px;color:var(--fg-dim);margin:10px 0 0">A altura alimenta os avisos da aba <b>Parques</b>: cada brinquedo mostra se as crianças passam na régua ou quantos centímetros faltam. Meça com o tênis que ela vai usar — é assim que medem na fila.</p>
      </div>
    </div>

    <div class="card">
      <div class="card-hd">
        <h2>Hospedagem</h2>
        <button class="btn ghost sm" type="button" data-act="addHotel">+ hotel</button>
      </div>
      <div class="card-bd">
        ${S.hotels.map(h => `
        <div style="padding:10px 0;border-bottom:1px solid var(--line-soft)">
          <div class="row" style="align-items:flex-end">
            <label class="f" style="flex:1;min-width:140px"><span>Nome</span>
              <input type="text" data-hotel="${h.id}" data-k="nome" value="${esc(h.nome)}"></label>
            <label class="f" style="flex:1;min-width:120px"><span>Cidade</span>
              <input type="text" data-hotel="${h.id}" data-k="cidade" value="${esc(h.cidade)}"></label>
            <label class="f" style="flex:2;min-width:180px"><span>Endereço (opcional)</span>
              <input type="text" data-hotel="${h.id}" data-k="endereco" value="${esc(h.endereco)}" placeholder="rua, número — deixe em branco para buscar só pelo nome"></label>
            <button class="del" type="button" data-act="delHotel" data-id="${h.id}" aria-label="Remover">×</button>
          </div>
          <div class="row" style="align-items:flex-end;margin-top:8px">
            <label class="f" style="flex:1;min-width:130px"><span>Entrada</span>
              <input type="date" data-hotel="${h.id}" data-k="de" value="${esc(h.de||"")}"></label>
            <label class="f" style="flex:1;min-width:130px"><span>Saída</span>
              <input type="date" data-hotel="${h.id}" data-k="ate" value="${esc(h.ate||"")}"></label>
            <span class="eyebrow" style="flex:2;min-width:180px;padding-bottom:9px">os dias nessa faixa saem daqui no roteiro e no mapa</span>
          </div>
          ${mapEmbedBlock([h.endereco || (h.nome + " " + h.cidade)], {height:170, label:"Mapa de " + h.nome})}
        </div>`).join("")}
        <p style="font-size:12.5px;color:var(--fg-dim);margin:10px 0 0">Assim que reservar, preencha o endereço — o mapa fica mais preciso do que buscar só pelo nome do hotel. As datas de entrada e saída definem <b>de onde cada dia sai</b>: todo dia do roteiro começa na hospedagem daquele período. Sem datas, o app adivinha pela cidade do dia, o que erra nos dias livres e nos de estrada.</p>
      </div>
    </div>
`;
}

function viewChecklist(){
  const items = allCheckItems();
  const grupos = [];
  items.forEach(i => { if(!grupos.includes(i.grupo)) grupos.push(i.grupo); });

  return `
  <h1>Checklist pré-viagem</h1>
  <p class="sub">Organizado por natureza da tarefa, não por data — mas os itens de <b>janela de tempo da Disney</b> têm prazo fixo e são os que travam a viagem se passarem.</p>

  <div class="stack">
  ${grupos.map(g => {
    const its = items.filter(i => i.grupo === g);
    const p = progress(its.map(i => i.id));
    const cls = p.pct === 100 ? "ok" : p.pct >= 50 ? "warn" : "crit";
    return cardGrupo("ck:" + g, esc(g), `<span class="pill ${cls}">${p.done}/${p.total}</span>`, `
        <div class="bar c-${cls}" style="margin:0 0 8px"><i style="width:${p.pct}%"></i></div>
        ${its.map(i => `
          <label class="item ${S.checks[i.id]?"done":""}">
            <input type="checkbox" data-check="${esc(i.id)}" ${S.checks[i.id]?"checked":""}>
            <span class="txt">
              <b>${esc(i.titulo)}</b>
              ${i.det ? `<p>${esc(i.det)}</p>` : ""}
            </span>
            ${i.custom ? `<button class="del" type="button" data-act="delCheck" data-id="${esc(i.id)}" aria-label="Remover">×</button>` : ""}
          </label>`).join("")}
        <div class="row" style="margin-top:12px">
          <input type="text" placeholder="Adicionar item em “${esc(g)}”…" data-newcheck="${esc(g)}" style="flex:1;min-width:180px">
          <button class="btn ghost sm" type="button" data-act="addCheck" data-grupo="${esc(g)}">Adicionar</button>
        </div>`);

  </div>`;
