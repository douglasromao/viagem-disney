/* ============================== 8a1. DOCUMENTOS ==============================
   Passaporte, visto, ingresso, reserva. O que se mostra num balcão precisa
   abrir sem sinal — então o arquivo mora no aparelho, em IndexedDB, e nunca
   sobe para servidor nenhum (mesma razão do ADR 0005, agravada pelo conteúdo:
   scan de passaporte em nuvem com chave compartilhada é risco que a viagem não
   precisa correr).

   localStorage não serve: são 5 MB no total e o arquivo viraria base64.
   IndexedDB guarda Blob nativo e aguenta dezenas de MB.

   No state fica só o índice (nome, categoria, tipo, tamanho) — o binário fica
   no banco do navegador, e a chave `docs` está em LOCAL_ONLY. */

const DOC_CATS = [
  {id:"imigracao", label:"Imigração",  dica:"Passaporte, visto, passagem, comprovante de hospedagem"},
  {id:"parques",   label:"Parques",    dica:"Ingressos, comprovantes de reserva, Lightning Lane"},
  {id:"hotel",     label:"Hotel",      dica:"Reservas, vouchers, confirmação de check-in"},
  {id:"carro",     label:"Carro",      dica:"Locação, seguro, habilitação"},
  {id:"saude",     label:"Saúde",      dica:"Seguro viagem, receitas, carteira de vacinação"},
  {id:"outros",    label:"Outros",     dica:""}
];
const DOC_MAX = 25 * 1024 * 1024;     /* 25 MB por arquivo já é folgado */

/* ---- IndexedDB: um armazém só, chave = id do documento ---- */
let _db = null;
function docsDB(){
  if(_db) return _db;
  _db = new Promise((ok, erro) => {
    const req = indexedDB.open("disneytrip-docs", 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains("arquivos")) db.createObjectStore("arquivos");
    };
    req.onsuccess = () => ok(req.result);
    req.onerror  = () => erro(req.error);
  });
  return _db;
}
async function docPut(id, blob){
  const db = await docsDB();
  return new Promise((ok, erro) => {
    const tx = db.transaction("arquivos", "readwrite");
    tx.objectStore("arquivos").put(blob, id);
    tx.oncomplete = () => ok();
    tx.onerror = () => erro(tx.error);
  });
}
async function docGet(id){
  const db = await docsDB();
  return new Promise((ok, erro) => {
    const req = db.transaction("arquivos", "readonly").objectStore("arquivos").get(id);
    req.onsuccess = () => ok(req.result || null);
    req.onerror = () => erro(req.error);
  });
}
async function docDel(id){
  const db = await docsDB();
  return new Promise((ok) => {
    const tx = db.transaction("arquivos", "readwrite");
    tx.objectStore("arquivos").delete(id);
    tx.oncomplete = () => ok();
    tx.onerror = () => ok();
  });
}

const docFmt = (b) => b >= 1048576 ? (b/1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b/1024)) + " KB";
const docEhImagem = (t) => /^image\//.test(t || "");

function docMsg(txt, tom){
  const el = document.getElementById("docMsg");
  if(!el) return;
  el.textContent = txt;
  el.style.color = tom === "err" ? "var(--crit)" : tom === "ok" ? "var(--ok)" : "var(--fg-dim)";
}

async function adicionarDocs(arquivos, cat){
  const lista = [...(arquivos || [])];
  if(!lista.length) return;
  let entraram = 0, grandes = [];
  for(const f of lista){
    if(f.size > DOC_MAX){ grandes.push(f.name); continue; }
    const id = uid("doc");
    try{
      await docPut(id, f);
      S.docs.push({id, nome:f.name || "documento", cat, tipo:f.type || "", tam:f.size, at:Date.now()});
      entraram++;
    }catch(e){
      docMsg("Não foi possível guardar “" + (f.name||"o arquivo") + "”: " + (e && e.name || "erro"), "err");
    }
  }
  if(entraram){ save("docs"); render(); }
  docMsg(
    grandes.length
      ? `${entraram} guardado(s). Fora do limite de 25 MB: ${grandes.join(", ")}.`
      : entraram ? `${entraram} documento(s) guardado(s) neste aparelho.` : "",
    grandes.length ? "err" : "ok");
}

/* Abre numa aba nova a partir do Blob: funciona offline e não depende de rede. */
/* Abre qualquer id do IndexedDB, esteja ou não no índice de documentos —
   a foto do carro não é um documento da viagem. */
async function abrirDocId(id){
  const blob = await docGet(id);
  if(!blob) return;
  const url = URL.createObjectURL(blob);
  window.open(url, "_blank");
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

async function abrirDoc(id){
  const d = S.docs.find(x => x.id === id);
  const blob = await docGet(id);
  if(!blob){ docMsg("O arquivo não está mais neste aparelho. Adicione de novo.", "err"); return; }
  const url = URL.createObjectURL(blob);
  const w = window.open(url, "_blank");
  if(!w) docMsg("O navegador bloqueou a janela. Permita pop-ups para abrir o documento.", "err");
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/* Compartilhar é como o documento chega no celular de outra pessoa — não existe
   nuvem aqui de propósito. */
async function compartilharDoc(id){
  const d = S.docs.find(x => x.id === id);
  const blob = await docGet(id);
  if(!blob || !d) return;
  const arq = new File([blob], d.nome, {type: d.tipo || "application/octet-stream"});
  if(navigator.canShare && navigator.canShare({files:[arq]})){
    try{ await navigator.share({files:[arq], title:d.nome}); }
    catch(e){ if(e && e.name !== "AbortError") docMsg("Não foi possível compartilhar.", "err"); }
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = d.nome; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function removerDoc(id){
  const d = S.docs.find(x => x.id === id);
  if(!confirm(`Remover “${d ? d.nome : "este documento"}” deste aparelho?`)) return;
  await docDel(id);
  S.docs = S.docs.filter(x => x.id !== id);
  save("docs"); render();
  docMsg("Documento removido.", "ok");
}

/* ============================== 8a2. PREVISÃO DO TEMPO ==============================
   Open-Meteo: sem chave, com CORS e HTTPS. Chave embutida num app público seria
   chave exposta — por isso não uso serviço que exige uma.

   O que a previsão alcança tem limite: ~16 dias à frente. Dia além disso não
   tem dado, e a tela diz isso em vez de inventar. */

const CLIMA_URL = "https://api.open-meteo.com/v1/forecast";
/* Todos os parques de Orlando ficam a poucos km: um ponto serve para os cinco.
   Miami é o outro. */
const CLIMA_LOCAIS = [
  {id:"orl", lat:28.4177, lng:-81.5812},
  {id:"mia", lat:25.7907, lng:-80.1300}
];
const localDoParque = (pk) => pk === "mia" ? "mia" : "orl";

/* Códigos WMO agrupados no que muda a decisão da família: dá para ficar na fila
   ou não. Detalhe além disso é ruído. */
function climaCod(c){
  if(c === 0) return {i:"☀️", t:"Sol"};
  if(c <= 2)  return {i:"🌤️", t:"Sol entre nuvens"};
  if(c === 3) return {i:"☁️", t:"Nublado"};
  if(c <= 48) return {i:"🌫️", t:"Névoa"};
  if(c <= 57) return {i:"🌦️", t:"Garoa"};
  if(c <= 67) return {i:"🌧️", t:"Chuva"};
  if(c <= 77) return {i:"🌨️", t:"Neve"};
  if(c <= 82) return {i:"🌧️", t:"Pancadas"};
  if(c <= 86) return {i:"🌨️", t:"Neve"};
  return {i:"⛈️", t:"Trovoada"};
}

let buscandoClima = false;

/* Guardado em LOCAL_ONLY: previsão é dado de fora, envelhece em horas e não faz
   sentido viajar no sync nem inchar o payload. */
async function buscarClima(forcar){
  if(buscandoClima || !comRede) return;
  const c = S.clima || {};
  const idade = Date.now() - (c.at || 0);
  if(!forcar && c.at && idade < 3*3600*1000) return;   /* 3h basta */

  buscandoClima = true;
  try{
    const q = new URLSearchParams({
      latitude:  CLIMA_LOCAIS.map(l => l.lat).join(","),
      longitude: CLIMA_LOCAIS.map(l => l.lng).join(","),
      daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
      timezone: "America/New_York",
      forecast_days: "16"
    });
    const res = await fetch(CLIMA_URL + "?" + q, {cache:"no-store"});
    if(!res.ok) throw new Error("http " + res.status);
    const body = await res.json();
    const lista = Array.isArray(body) ? body : [body];

    const dias = {};
    lista.forEach((loc, i) => {
      const id = (CLIMA_LOCAIS[i] || {}).id;
      const d = loc && loc.daily;
      if(!id || !d) return;
      d.time.forEach((iso, k) => {
        /* a borda do alcance vem com null: não guarda meia previsão */
        if(d.temperature_2m_max[k] == null) return;
        (dias[iso] = dias[iso] || {})[id] = {
          max: Math.round(d.temperature_2m_max[k]),
          min: Math.round(d.temperature_2m_min[k]),
          chuva: d.precipitation_probability_max[k] ?? null,
          cod: d.weather_code[k]
        };
      });
    });
    S.clima = {at: Date.now(), dias};
    save(false);
    render();
  }catch(e){
    /* Sem previsão o app inteiro continua funcionando: não vale mostrar erro. */
    console.warn("clima:", e && e.message);
  }finally{
    buscandoClima = false;
  }
}

function climaDoDia(iso, pk){
  const d = ((S.clima || {}).dias || {})[iso];
  return d ? d[localDoParque(pk)] || null : null;
}

/* Faixa da previsão no card do dia. Sem dado, diz por quê. */
function blocoClima(iso, pk){
  const c = climaDoDia(iso, pk);
  if(!c){
    const temAlgo = Object.keys((S.clima || {}).dias || {}).length;
    return `<div class="clima clima-vazio">${temAlgo
      ? "Previsão ainda não alcança este dia — ela vai até uns 16 dias à frente."
      : `<button class="btn ghost sm" type="button" data-act="clima">Ver previsão</button>`}</div>`;
  }
  const k = climaCod(c.cod);
  const quente = c.max >= 34;
  return `<div class="clima">
    <span class="clima-i" aria-hidden="true">${k.i}</span>
    <span class="clima-t"><b>${c.max}°</b> <span class="clima-min">${c.min}°</span></span>
    <span class="clima-d">${k.t}</span>
    ${c.chuva != null ? `<span class="pill ${c.chuva >= 50 ? "warn" : "neutral"}">${c.chuva}% chuva</span>` : ""}
    ${quente ? `<span class="pill crit">calor forte</span>` : ""}
    <button class="clima-upd" type="button" data-act="clima" title="Atualizar previsão" aria-label="Atualizar previsão">↻</button>
  </div>`;
}

/* ============================== 8b. AGENDA E CALENDÁRIO ==============================
   Lembretes viram arquivo .ics e quem dispara é o Calendário do aparelho
   (ADR 0009). Espelho de build/agenda.js, que roda os mesmos 13 asserts fora
   do navegador. */

const PARQUE = {
  mk:"Magic Kingdom", ak:"Animal Kingdom", hs:"Hollywood Studios",
  ue:"Epic Universe", ds:"Disney Springs", mia:"Miami",
  off:"Estrada / compras", none:"Descanso"
};

const partes = (isoDia) => isoDia.split("-").map(Number);
const ddmm = (isoDia) => { const [,m,dd] = partes(isoDia); return String(dd).padStart(2,"0")+"/"+String(m).padStart(2,"0"); };

/* Dias da viagem, inclusive nas duas pontas. Teto de 60 pelo mesmo motivo do
   daysRange do app: viagem digitada errada não vira loop infinito. */
function diasDaViagem(trip){
  const out = [];
  if(!trip || !trip.start || !trip.end) return out;
  const [ay,am,ad] = partes(trip.start);
  const [by,bm,bd] = partes(trip.end);
  const fim = new Date(by, bm-1, bd);
  for(let cur = new Date(ay, am-1, ad); cur <= fim && out.length < 60; cur.setDate(cur.getDate()+1)){
    out.push(cur.getFullYear()+"-"+String(cur.getMonth()+1).padStart(2,"0")+"-"+String(cur.getDate()).padStart(2,"0"));
  }
  return out;
}

function construirAgenda(S, agora){
  const out = [];
  const t = agora instanceof Date ? agora.getTime() : Number(agora);
  const dining = (S && S.dining) || [];
  const days = (S && S.days) || {};

  /* 1 · briefing das 07h, um por dia de viagem. Dia sem parque não toca. */
  diasDaViagem(S && S.trip).forEach(isoDia => {
    const dia = days[isoDia];
    if(!dia || dia.park === "none") return;
    const [y,m,dd] = partes(isoDia);
    const itens = (dia.items || []).length;
    const reservas = dining.filter(r => r.dia === isoDia && r.hora)
      .map(r => "Reserva " + r.hora + " " + r.nome);
    const linha = [];
    if(itens) linha.push(itens + (itens === 1 ? " programa" : " programas"));
    linha.push(...reservas);
    out.push({
      id:"briefing:" + isoDia,
      at:new Date(y, m-1, dd, 7, 0, 0, 0),
      titulo:"Hoje: " + (PARQUE[dia.park] || "Dia livre"),
      corpo:linha.length ? linha.join(" · ") : String(dia.notes || "").trim()
    });
  });

  dining.forEach(r => {
    if(!r.dia) return;
    const [y,m,dd] = partes(r.dia);

    /* 2 · abertura da janela de 60 dias, 06:50 — dez minutos antes da Disney
       abrir. Só para o que ainda não está reservado, e só se ainda não passou:
       a janela que abriu em junho não adianta lembrar. */
    if(!r.done){
      const at = new Date(y, m-1, dd-60, 6, 50, 0, 0);
      if(at.getTime() > t) out.push({
        id:"janela:" + r.id,
        at,
        titulo:"Abre hoje: " + r.nome,
        corpo:"Reserva para " + ddmm(r.dia) + " libera às 7h. Abra o app da Disney."
      });
    }

    /* 3 · uma hora antes da reserva, reservada ou não. Hora negativa cai no
       dia anterior sozinha — é o que se quer para reserva às 00:30. */
    if(r.hora){
      const [hh,mi] = r.hora.split(":").map(Number);
      out.push({
        id:"antes:" + r.id,
        at:new Date(y, m-1, dd, hh-1, mi, 0, 0),
        titulo:"Em 1h: " + r.nome,
        corpo:r.hora + (r.local ? " · " + r.local : "")
      });
    }
  });

  out.sort((a,b) => a.at - b.at || (a.id < b.id ? -1 : 1));
  return out;
}

/* ---------- .ics (RFC 5545) ---------- */

/* Ponto e vírgula, vírgula, barra e quebra de linha são estruturais no formato. */
function icsEsc(t){
  return String(t == null ? "" : t)
    .replace(/\\/g, "\\\\").replace(/;/g, "\\;")
    .replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
}

/* Hora FLUTUANTE de propósito: sem Z e sem TZID, o alarme toca às 7h de onde o
   aparelho estiver. A viagem cruza BRT → EDT e é isso que se quer. */
function icsData(dt){
  const p = (n) => String(n).padStart(2, "0");
  return dt.getFullYear() + p(dt.getMonth()+1) + p(dt.getDate())
       + "T" + p(dt.getHours()) + p(dt.getMinutes()) + "00";
}

/* O formato limita a linha a 75 octetos; continuação começa com espaço. */
function icsDobra(linha){
  const b = [];
  let atual = "";
  for(const ch of linha){
    const cand = atual + ch;
    if(new TextEncoder().encode(cand).length > 73){ b.push(atual); atual = " " + ch; }
    else atual = cand;
  }
  b.push(atual);
  return b.join("\r\n");
}

function gerarIcs(){
  const ag = construirAgenda(S, Date.now());
  const carimbo = icsData(new Date());
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Viagem Disney//PT",
             "CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Viagem Disney"];
  ag.forEach(x => {
    const fim = new Date(x.at.getTime() + 15*60000);
    L.push("BEGIN:VEVENT");
    /* UID estável: reimportar substitui em vez de duplicar. */
    L.push(icsDobra("UID:" + x.id.replace(/[^a-zA-Z0-9:_-]/g, "-") + "@disneytrip"));
    L.push("DTSTAMP:" + carimbo + "Z");
    L.push("DTSTART:" + icsData(x.at));
    L.push("DTEND:" + icsData(fim));
    L.push(icsDobra("SUMMARY:" + icsEsc(x.titulo)));
    if(x.corpo) L.push(icsDobra("DESCRIPTION:" + icsEsc(x.corpo)));
    L.push("BEGIN:VALARM","TRIGGER:PT0S","ACTION:DISPLAY",
           icsDobra("DESCRIPTION:" + icsEsc(x.titulo)),"END:VALARM");
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return {texto: L.join("\r\n") + "\r\n", total: ag.length};
}

async function baixarIcs(){
  const msg = document.getElementById("icsMsg");
  const diz = (t,c) => { if(msg){ msg.textContent = t; msg.style.color = c; } };
  const {texto, total} = gerarIcs();

  if(!total){ diz("Nada para exportar ainda. Defina os dias do roteiro e o horário das reservas.", "var(--warn)"); return; }

  const nome = "viagem-disney.ics";
  const arq = new File([texto], nome, {type:"text/calendar"});

  /* No iOS o compartilhamento é o caminho que chega ao Calendário; o link com
     download só funciona bem no computador. Tenta o nativo e cai para o link. */
  if(navigator.canShare && navigator.canShare({files:[arq]})){
    try{
      await navigator.share({files:[arq], title:"Viagem Disney"});
      diz(total + " lembretes exportados. Escolha “Calendário” para importar.", "var(--ok)");
      return;
    }catch(e){ if(e && e.name === "AbortError"){ diz("Exportação cancelada.", "var(--fg-dim)"); return; } }
  }
  try{
    const url = URL.createObjectURL(new Blob([texto], {type:"text/calendar"}));
    const a = document.createElement("a");
    a.href = url; a.download = nome; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    diz(total + " lembretes salvos em " + nome + ". Abra o arquivo para importar no Calendário.", "var(--ok)");
  }catch(e){ diz("Este navegador não deixou baixar o arquivo.", "var(--crit)"); }
}

/* ============================== 9. TEMA ============================== */

function toggleTheme(){
  const root = document.documentElement;
  const cur = root.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  root.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
}

    console.assert(p.sync === undefined, "payload NÃO pode carregar a chave do servidor");
    console.assert(p.mapsKey === undefined, "payload NÃO pode carregar a chave do Maps");
    console.assert(p.tab === undefined && p.parkFilter === undefined, "payload não deve carregar preferências de tela");
    console.assert(p.updatedBy === "Celular" && p.checks && p.trip, "payload precisa levar os dados e a autoria");
    console.assert(JSON.stringify(payload()).indexOf("SEGREDO") === -1, "a chave do sync vazou no payload");
    console.assert(JSON.stringify(payload()).indexOf("CHAVE-DO-MAPA") === -1, "a chave do Maps vazou no payload");
    console.assert(encodeState().indexOf("SEGREDO") === -1 && encodeState().indexOf("CHAVE-DO-MAPA") === -1 &&
      atob(encodeState()).indexOf("SEGREDO") === -1 && atob(encodeState()).indexOf("CHAVE-DO-MAPA") === -1,
      "alguma chave vazou no código de transferência");

    const u = syncUrls();
    console.assert(u.read.endsWith("/latest") && !u.write.endsWith("/latest"), "jsonbin: leitura usa /latest, escrita não");
    console.assert(u.headers["X-Master-Key"] === "SEGREDO", "jsonbin: cabeçalho da chave");
    /* endpoint próprio: o cliente concatena /trip (docs/API.md §3) */
    S.sync.provider = "generic"; S.sync.header = "Authorization"; S.sync.url = "https://x.dev/v/";
    const g = syncUrls();
    console.assert(g.read === "https://x.dev/v/trip" && g.read === g.write,
      "generic: mesma URL para ler e gravar, com /trip e sem barra final — veio " + g.read);
    console.assert(g.headers.Authorization === "SEGREDO", "generic: cabeçalho configurável");
    S.sync.url = "https://x.dev/v/trip";
    console.assert(syncUrls().read === "https://x.dev/v/trip",
      "URL já colada com /trip não pode virar /trip/trip");

    /* ---- F3: os quatro estados visíveis, sempre com texto ---- */
    {
      const redeBak = comRede;
      S.sync.url = "https://x.dev/v"; S.updatedAt = 10; S.lastSync = 10;
      comRede = true;
      console.assert(rotuloSalvo() === "salvo", "em dia e com rede = salvo");
      S.updatedAt = 20;
      console.assert(rotuloSalvo() === "salvo · sync pendente", "pendente com rede");
      comRede = false;
      console.assert(rotuloSalvo() === "salvo · offline", "pendente sem rede tem que dizer offline");
      console.assert(rotuloBotao(false) === "Offline •" && rotuloBotao(true) === "Off •",
        "o botão também precisa mostrar offline, não só o rótulo");
      S.updatedAt = 10; S.lastSync = 10;
      console.assert(rotuloBotao(false) === "Offline", "sem pendência offline não leva bolinha");
      S.sync.url = "";
      console.assert(rotuloBotao(false) === "Configurar sync", "sem servidor, o botão convida a configurar");
      comRede = redeBak;
    }

    /* pendente() só liga com sync configurado e alteração posterior */
    S.sync.url = ""; S.updatedAt = 10; S.lastSync = 5;
    console.assert(pendente() === false, "sem servidor não existe pendência");
    S.sync.url = "https://x.dev/v";
    console.assert(pendente() === true, "alteração após o último sync = pendente");
    S.lastSync = 10;
    console.assert(pendente() === false, "sincronizado = sem pendência");
  } finally { S = bak; }
})();

/* Fora do selfTest de propósito: ele é síncrono, e torná-lo async faria o
   `finally` restaurar o state depois do render() lá embaixo — o app abriria
   mostrando dado de teste. */
comprimirImagem(new Blob(["x"], {type:"application/pdf"})).then(r =>
  console.assert(r instanceof Blob, "arquivo que não é imagem tem que passar direto pelo compressor"));

/* ============================== 11. INÍCIO ============================== */
render();
buscarClima(false);
buscarFilas(false);

/* Service worker: offline completo (ADR 0008). Só sob http(s) — abrir o arquivo
   direto do Finder (file://) não registra, e não precisa. */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .catch(e => console.warn("service worker não registrou:", e && e.message));
  });
}
</script>
