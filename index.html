function viewRoteiro(){
  const days = tripDays();
  if(!days.length) return `<h1>Roteiro</h1><p class="sub">Defina as datas de ida e volta em <b>Ajustes › Viagem</b>.</p>`;
  const marcadas = S.dining.filter(r => r.done).length;
  const cab = `<h1>Roteiro</h1>` + barraSeg("roteiro", {reservas: marcadas + "/" + S.dining.length});
  return cab + (segAtual("roteiro") === "reservas" ? roteiroReservas(days) : roteiroDias(days));
}

function roteiroDias(days){
  const t = iso(today());
  const opts = Object.keys(PARKS);

  /* Um dia por vez: 10 cards empilhados viravam uma rolagem enorme, e cada um
     carregava o próprio mapa. Agora é uma aba por dia e um mapa só. */
  const sel = days.includes(S.diaSel) ? S.diaSel : (days.includes(t) ? t : days[0]);
  const idx = days.indexOf(sel);
  const day = S.days[sel] || {};
  const p = parkOf(day.park || "none");
  const dd = d(sel);
  const itens = mergedDayItems(sel, day);
  const sugestoes = [...new Set([...(ATTR[p]||[]).map(a=>a[0]), ...S.dining.map(r=>r.nome)])].filter(Boolean);

  const abas = days.map((dt,i) => {
    const dia = S.days[dt] || {};
    const pk = parkOf(dia.park || "none");
    const n = mergedDayItems(dt, dia).length;
    const x = d(dt);
    return `<button class="chip diachip pk ${PARKS[pk].cls}" type="button" data-dia="${dt}"
              aria-pressed="${dt===sel}" title="${esc(PARKS[pk].n)}">
      <span class="parkicon xs">${parkIconSvg(pk)}</span>
      <span class="diachip-d">${String(x.getDate()).padStart(2,"0")}/${String(x.getMonth()+1).padStart(2,"0")}</span>
      <span class="diachip-w">${WD[x.getDay()].slice(0,3)}${dt===t?" · hoje":""}</span>
      ${(() => { const c = climaDoDia(dt, pk); return c ? `<span class="diachip-c">${climaCod(c.cod).i}${c.max}°</span>` : ""; })()}
      ${n ? `<span class="diachip-n">${n}</span>` : ""}
    </button>`;
  }).join("");

  const linhaItem = (it) => it.fonte === "dining" ? `
    <div class="dayitem dayitem-dining">
      <span class="mv"></span>
      <input type="time" data-din="${it.id}" data-k="hora" value="${esc(it.hora||"")}" aria-label="Horário da reserva">
      <span class="dayitem-name"><span class="pill accent" style="margin-right:6px">restaurante</span>${esc(it.nome)}</span>
      <button class="del" type="button" data-act="unassignDining" data-id="${it.id}" aria-label="Tirar deste dia" title="Tirar deste dia (continua em Restaurantes)">×</button>
    </div>` : `
    <div class="dayitem${it.attr ? " dayitem-attr" : ""}"${it.attr ? ` title="veio da aba Parques — desmarcar lá tira daqui"` : ""}>
      <span class="mv">
        <button type="button" data-act="mvItem" data-dt="${sel}" data-id="${it.id}" data-dir="-1" aria-label="Subir">↑</button>
        <button type="button" data-act="mvItem" data-dt="${sel}" data-id="${it.id}" data-dir="1" aria-label="Descer">↓</button>
      </span>
      <input type="text" data-item="${sel}|${it.id}" data-k="nome" value="${esc(it.nome)}" list="sug-${sel}" aria-label="Programa">
      <button class="pin${it.end ? " tem" : ""}" type="button" data-act="itemLocal" data-id="${it.id}"
        aria-expanded="${S.itemAberto === it.id}"
        aria-label="${it.end ? "Endereço definido" : "Definir endereço"}" title="Endereço e busca">📍</button>
      <button class="del" type="button" data-act="delItem" data-dt="${sel}" data-id="${it.id}" aria-label="Remover">×</button>
    </div>
    ${S.itemAberto === it.id ? `
    <div class="itemlocal">
      <label class="f"><span>Endereço ou nome exato do lugar</span>
        <input type="text" data-item="${sel}|${it.id}" data-k="end" value="${esc(it.end||"")}"
          placeholder="ex.: 5156 International Dr, Orlando FL"></label>
      <p>Sem endereço, o mapa procura por <b>${esc(it.nome || "o nome do item")}${p === "none" ? "" : (p === "mia" ? " Miami FL" : " Orlando FL")}</b> — o que erra quando o nome é comum. Use a busca para achar o endereço certo e cole aqui.</p>
      <div class="row" style="gap:8px">
        <a class="btn ghost sm" href="${googleUrl(it.nome + (p === "none" ? "" : (p === "mia" ? " Miami FL" : " Orlando FL")))}" target="_blank" rel="noopener noreferrer">Buscar no Google ↗</a>
        <a class="btn ghost sm" href="${mapUrl((it.end && it.end.trim()) ? it.end : it.nome + (p === "none" ? "" : (p === "mia" ? " Miami FL" : " Orlando FL")))}" target="_blank" rel="noopener noreferrer">Ver no Maps ↗</a>
      </div>
      <label class="semmapa">
        <input type="checkbox" data-item="${sel}|${it.id}" data-k="semMapa" ${it.semMapa ? "checked" : ""}>
        <span>Não é um lugar — deixar fora do mapa <b>(voo, trecho, “a decidir”)</b></span>
      </label>
    </div>` : ""}`;

  const blocos = PERIODOS.map(per => {
    const doPeriodo = itens.filter(i => i.periodo === per.id);
    if(!doPeriodo.length) return "";        /* bloco vazio não vira ruído */
    return `<div class="periodo">
      <div class="periodo-hd">${per.label}<span>${doPeriodo.length}</span></div>
      ${doPeriodo.map(linhaItem).join("")}
    </div>`;
  }).join("");

  return `
  <p class="sub">${days.length} dias: voo na madrugada de 23/08, pouso em Miami às 7h de 24/08 e direto para Orlando de carro, quatro parques com descanso entre eles, volta a Miami em 30/08 e voo de volta às 19h de 01/09. Clique em <b>Aplicar sugestão</b> para preencher com esse plano e depois ajuste à vontade.</p>

  <div class="row" style="margin-bottom:14px">
    <button class="btn" type="button" data-act="sugestao">Aplicar sugestão</button>
    <button class="btn ghost" type="button" data-act="limparRoteiro">Limpar roteiro</button>
  </div>

  <div class="diasbar">${abas}</div>

  <div class="day pk ${PARKS[p].cls} ${sel===t?"today":""}">
    <div class="parkbar"></div>
    <div class="day-hd">
      <span class="row" style="gap:9px">
        <span class="parkicon sm">${parkIconSvg(p)}</span>
        <span><span class="dt" style="display:block">${String(dd.getDate()).padStart(2,"0")} ${MO[dd.getMonth()]}</span>
        <span class="wd">${WD[dd.getDay()]}${sel===t?" · hoje":""} · d${idx+1} de ${days.length}</span></span>
      </span>
    </div>
    <div class="day-bd">
      <div class="row" style="justify-content:flex-end;margin:-4px 0 8px">${btnFoto(p, "", "📷 Foto deste dia")}</div>
      <select data-day="${sel}" data-k="park" aria-label="Parque do dia">
        ${opts.map(o => `<option value="${o}" ${p===o?"selected":""}>${PARKS[o].n}</option>`).join("")}
      </select>
      ${blocoClima(sel, p)}

      <div class="f"><span>Programação do dia</span>
        <datalist id="sug-${sel}">${sugestoes.map(x => `<option value="${esc(x)}">`).join("")}</datalist>
        <div class="dayitems">
          ${blocos || `<p style="font-size:13px;color:var(--fg-dim);margin:2px 0 10px">Nada marcado ainda. Marque atrações na aba <b>Parques</b> e elas entram aqui sozinhas, ou escreva abaixo.</p>`}
          <div class="dayitem dayitem-add" style="grid-template-columns:22px 92px minmax(0,1fr) 26px">
            <span class="mv"></span>
            <select data-newitemper="${sel}" aria-label="Período do novo item">
              ${PERIODOS.map(x => `<option value="${x.id}" ${x.id===PERIODO_PADRAO?"selected":""}>${x.label}</option>`).join("")}
            </select>
            <input type="text" data-newitemname="${sel}" list="sug-${sel}" placeholder="atração, passeio, descanso…" aria-label="Nome do novo item">
            <input type="hidden" data-newitemtime="${sel}">
            <button class="btn ghost sm" type="button" data-act="addItem" data-dt="${sel}">+</button>
          </div>
        </div>
        <p style="font-size:12px;color:var(--fg-faint);margin:6px 0 0">Reservas com dia marcado em <b>Roteiro › Reservas</b> entram aqui sozinhas, com a hora exata. As setas mudam a ordem dentro do período.</p>
      </div>

      <label class="f"><span>Notas do dia</span>
        <textarea rows="2" data-day="${sel}" data-k="notes" placeholder="rope drop, o que levar, hora de sair…">${esc(day.notes||"")}</textarea></label>
      ${blocoSaida(sel, p, day.notes||"")}
      ${mapEmbedBlock(dayStops(p, day.notes||"", itens, sel), {height:190, label:"Mapa do dia " + (idx+1)})}
    </div>
  </div>
  `;
}

          <span class="parkicon sm">${parkIconSvg(pk)}</span>

          <span class="eyebrow" style="display:block">${esc(PARKS[pk].n)}${idx >= 0 ? " · dia " + (idx+1) : ""}</span></span>
        </span>
        <span class="pill neutral">${fs.length}</span>
      </div>
      <div class="card-bd">
        <div class="galeria">
          ${fs.map(f => `
          <figure class="foto">
            <img data-fotoimg="${f.id}" alt="${esc(f.attr ? nomeDoAttr(f.attr) : PARKS[parkOf(f.park||"none")].n)}">
            <figcaption>
              ${f.attr ? `<span class="foto-tag">${esc(nomeDoAttr(f.attr))}</span>` : ""}
              <span class="foto-h">${new Date(f.at).toTimeString().slice(0,5)}${f.lat ? " · GPS" : ""}</span>
            </figcaption>
            <span class="foto-acoes">

function viewParques(){
  const pk = ATTR[S.parkFilter] ? S.parkFilter : "mk";
  const list = ATTR[pk];
  const cls = PARKS[pk].cls;

  const filtered = list.filter((a,i) => {
    if(S.onlyPlan && !a[3].includes("P")) return false;
    if(S.onlyKid){
      const hs = heightInfo(a[2]);
      if(hs && !hs.some(h => h.ok)) return false;
    }
    return true;
  });

  const ids = list.map((a,i) => attrId(pk,i,a[0]));
  const p = progress(ids);

  const lands = [];
  filtered.forEach(a => { if(!lands.includes(a[1])) lands.push(a[1]); });

  const planTotal = Object.keys(ATTR).reduce((t,k) =>
    t + ATTR[k].filter(a => a[3].includes("P")).length, 0);

  return `
  <h1>Parques e atrações</h1>
  <p class="sub">Marque o que a família quer fazer. As etiquetas <span class="pill accent">planejar antes</span> são as ${planTotal} coisas que não se resolvem na hora — exigem reserva, compra de fila ou fila virtual no app.</p>

  ${["mk","hs","ak","ue"].includes(pk) ? (() => {
    const f = S.filas || {};
    const idade = f.at ? Math.round((Date.now() - f.at)/60000) : null;
    const fresco = f.at && Date.now() - f.at < 30*60*1000;

  <div class="filters">
    ${Object.keys(PARKS).filter(k => ATTR[k]).map(k =>
      `<button class="chip pkchip pk ${PARKS[k].cls}" type="button" data-park="${k}" aria-pressed="${pk===k}">
        <span class="parkicon xs">${parkIconSvg(k)}</span>${PARKS[k].n}</button>`).join("")}

  ${!diaDoParque(pk) ? `<div class="warnbox" style="margin-bottom:14px">
    <b>Nenhum dia do roteiro está marcado como ${esc(PARKS[pk].n)}</b>
    <p style="margin:6px 0 0">Marcar aqui continua valendo como “a família quer fazer”, mas nada entra no roteiro enquanto não existir um dia com esse parque. Defina o parque de algum dia em <b>Roteiro › Dias</b> e as marcadas entram sozinhas.</p>
  </div>` : ""}

  <div class="filters">

    <button class="chip" type="button" data-act="tgKid" aria-pressed="${S.onlyKid}">Só o que as crianças pegam</button>
  </div>

  <div class="card pk ${cls}" style="margin-bottom:16px">
    <div class="parkbar"></div>
    <div class="card-hd">
      <span class="row" style="gap:12px"><span class="parkicon sm">${parkIconSvg(pk)}</span><h2>Suas marcadas no mapa</h2></span>
    </div>
    <div class="card-bd">

const fmtDia = (i) => { const x = d(i); return isNaN(x) ? i : String(x.getDate()).padStart(2,"0") + "/" + String(x.getMonth()+1).padStart(2,"0"); };

function fmtWhen(ms){
  if(!ms) return "nunca";
  const dt = new Date(ms);
  const hoje = iso(today()) === iso(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()));
  const hora = String(dt.getHours()).padStart(2,"0") + ":" + String(dt.getMinutes()).padStart(2,"0");
  return hoje ? "hoje " + hora : `${String(dt.getDate()).padStart(2,"0")} ${MO[dt.getMonth()]} ${hora}`;
}

/* Tela de mapa: escolhe o dia, marca as paradas, vê o trajeto.
   O iframe do Google exige chave da Maps Embed API (com faturamento). O link
   que abre o app do Google Maps não exige nada e, no celular, é melhor — dá
   trânsito e navegação de verdade. A tela serve dos dois jeitos. */

/* Candidatos a parada do dia: hotel, o parque, e cada item da programação.
   Devolve objetos com id estável para a seleção sobreviver ao render. */
function paradasDoDia(dt){
  const day = S.days[dt] || {};
  const pk = parkOf(day.park || "none");
  const out = [];
  const suf = pk === "mia" ? " Miami FL" : " Orlando FL";

  const hotel = hospedagemDoDia(dt, pk, day.notes);
  if(hotel)
    out.push({id:"hotel", tipo:"hotel", nome: hotel.nome || "Hospedagem",
              busca: enderecoHotel(hotel)});

  const temItens = mergedDayItems(dt, day).filter(ehLugar).length > 0;
  if(pk !== "none" && pk !== "off" && (pk !== "mia" || !temItens))
    out.push({id:"parque", tipo:"parque", nome: PARKS[pk].n,
              busca: PARKS[pk].n + (pk === "mia" ? ", FL" : " Orlando FL")});

  /* Destino do dia de estrada: a hospedagem onde se dorme hoje. Fica para o
     fim da lista, depois das paradas do caminho — a ordem daqui é a ordem em
     que o Google desenha a rota. */
  let destino = null;
  if(pk === "off"){
    const n = day.notes || "";
    const chega = chegadaDoDia(dt);
    const dest = chega && (!hotel || chega.id !== hotel.id)
      ? {id:"para", tipo:"hotel", nome: chega.nome || "Hospedagem", busca: enderecoHotel(chega)}
      : null;
    if(/Orlando\s*→\s*Miami/.test(n)){
      if(!hotel) out.push({id:"de", tipo:"rota", nome:"Orlando", busca:"Orlando, FL"});
      destino = dest || {id:"para", tipo:"rota", nome:"Aeroporto de Miami", busca:"Miami International Airport, FL"};
    }else if(/para Orlando/.test(n)){
      if(!hotel) out.push({id:"de", tipo:"rota", nome:"Aeroporto de Miami", busca:"Miami International Airport, FL"});
      destino = dest || {id:"para", tipo:"rota", nome:"Orlando", busca:"Orlando, FL"};
    }
  }

  mergedDayItems(dt, day).filter(ehLugar).forEach(it => out.push({
    id: it.id, tipo: it.fonte === "dining" ? "reserva" : "item",
    nome: it.nome, periodo: it.periodo,
    /* endereço digitado vence o palpite "nome + cidade", que erra quando o
       lugar tem nome comum */
    busca: (it.end && it.end.trim()) ? it.end.trim() : it.nome + (pk === "none" ? "" : suf),
    temEnd: !!(it.end && it.end.trim())
  }));
  if(destino) out.push(destino);
  return out;
}

/* Sem escolha explícita, marca tudo — é o que quase sempre se quer ver. */
function selMapa(dt, todas){
  const guardado = (S.mapaSel || {})[dt];
  if(!Array.isArray(guardado)) return todas.map(p => p.id);
  return guardado.filter(id => todas.some(p => p.id === id));
}

  const t = iso(today());
  const dt = days.includes(S.mapaDia) ? S.mapaDia : (days.includes(t) ? t : days[0]);
  const day = S.days[dt] || {};
  const pk = parkOf(day.park || "none");
  const dd = d(dt);

  const todas = paradasDoDia(dt);

/* ---------- grupos que abrem e fecham ----------
   Vale para o checklist, compras e orçamento: são cards longos, e num celular
   percorrer 8 grupos abertos para achar um item é rolagem demais. */
const grupoFechado = (chave) => !!(S.grupoFechado || {})[chave];

function alternarGrupo(chave){
  const g = Object.assign({}, S.grupoFechado || {});
  if(g[chave]) delete g[chave]; else g[chave] = true;
  S.grupoFechado = g; save(false); render();
}

/* Cabeçalho clicável, com a seta girando. O conteúdo continua no DOM (fica só
   escondido) para o navegador não perder o foco de um campo em edição. */
function cardGrupo(chave, titulo, extra, corpo){
  const f = grupoFechado(chave);
  return `<div class="card grupo${f ? " fechado" : ""}">
    <button class="card-hd grupo-hd" type="button" data-grupo="${esc(chave)}" aria-expanded="${!f}">

}

function novaLista(){
  const nome = (prompt("Nome da nova lista:") || "").trim();
  if(!nome) return;
  const l = {id:uid("l"), nome, itens:[]};
  S.listas.push(l);
  S.seg = Object.assign({}, S.seg, {listas: l.id});
  save(); render();
}

function apagarLista(id){
  const l = S.listas.find(x => x.id === id);
  if(!l) return;
  if(!confirm(`Apagar a lista “${l.nome}” e os ${l.itens.length} item(ns) dela?`)) return;
  S.listas = S.listas.filter(x => x.id !== id);
  S.seg = Object.assign({}, S.seg, {listas: "checklist"});
  save(); render();
}

function viewListas(){
  const ck = progress(allCheckItems().map(c => c.id));
  const shopDone = S.shop.filter(s => s.done).length;
  const cab = `<h1>Listas</h1>` + barraSeg("listas", {
    checklist: ck.done + "/" + ck.total,
    compras:   shopDone + "/" + S.shop.length
  });
  const seg = segAtual("listas");
  const propria = (S.listas || []).find(l => l.id === seg);
  const corpo = propria ? viewListaPropria(propria)
    : seg === "compras" ? viewCompras()
    : seg === "orcamento" ? viewOrcamento()
    : viewChecklist();
  /* cada view já traz o próprio h1; some, porque o cabeçalho agora é do segmento */
  return cab + corpo.replace(/^\s*<h1>[^<]*<\/h1>/, "");
}

/* As miniaturas vêm do IndexedDB, então não dá para sair no HTML.
   loading="lazy" não serve aqui: com src vindo de blob por JS o navegador adia
   o carregamento e a imagem nunca aparece. Quem observa a rolagem é este
   IntersectionObserver, que também evita criar centenas de blob URLs de uma vez
   num álbum grande. */
function carregarUma(img){
  if(img.dataset.pronta) return;
  img.dataset.pronta = "1";
  docGet(fotoId(img.dataset.fotoimg)).then(b => {
    if(!b) return;
    const url = URL.createObjectURL(b);
    img.onload = img.onerror = () => URL.revokeObjectURL(url);
    img.src = url;
  }).catch(() => {});
}

/* Carrega todas de uma vez, de propósito.
   loading="lazy" não funciona com src vindo de blob por JS, e um
   IntersectionObserver aqui é algo que eu não consegui verificar rodando — não
   vale apoiar o álbum da viagem em comportamento não confirmado. Para algumas
   centenas de fotos, criar as URLs de uma vez é barato, e cada uma é liberada
   assim que a imagem termina de decodificar.

   ponytail: se o álbum passar de uns milhares, aí sim vale carregar sob demanda. */
function carregarMiniaturas(){
  document.querySelectorAll("img[data-fotoimg]:not([data-pronta])").forEach(carregarUma);
  const marcas = document.querySelectorAll("[data-marcadia]:not([data-pronta])");
  if(marcas.length){
    docGet(MARCA_DIA).then(b => {
      if(!b) return;
      const url = URL.createObjectURL(b);
      marcas.forEach(el => {
        el.dataset.pronta = "1";
        el.style.webkitMaskImage = `url("${url}")`;
        el.style.maskImage = `url("${url}")`;
      });
      /* a URL fica viva enquanto as máscaras estiverem na tela */
      setTimeout(() => URL.revokeObjectURL(url), 120000);
    }).catch(() => {});
  }
  /* as capas de dia no calendário vêm do mesmo banco, com outra chave */
  document.querySelectorAll("img[data-capadia]:not([data-pronta])").forEach(img => {
    img.dataset.pronta = "1";
    docGet(capaDiaId(img.dataset.capadia)).then(b => {
      if(!b) return;
      const url = URL.createObjectURL(b);
      img.onload = img.onerror = () => URL.revokeObjectURL(url);
      img.src = url;
    }).catch(() => {});
  });
}

function setTab(t){ S.tab = t; S.menuAberto = false; save(false); render(); window.scrollTo({top:0}); document.getElementById("view").focus({preventScroll:true}); }

document.addEventListener("click", (e) => {
  const tabBtn = e.target.closest("[data-tab]");
  if(tabBtn){ setTab(tabBtn.dataset.tab); return; }

  if(e.target.closest("[data-act=menu]")){ S.menuAberto = true; save(false); render(); return; }
  if(e.target.closest("[data-act=menuFechar]")){ S.menuAberto = false; save(false); render(); return; }

  const risc = e.target.closest("[data-riscar]");
  if(risc){ riscarDia(risc.dataset.riscar); return; }

  if(mapaDiaBtn){ S.mapaDia = mapaDiaBtn.dataset.mapadia; save(false); render(); window.scrollTo({top:0}); return; }

  const diaBtn = e.target.closest("[data-dia]");
  if(diaBtn){ S.diaSel = diaBtn.dataset.dia; save(false); render(); return; }

  const grp = e.target.closest("[data-grupo]");
  if(grp){ alternarGrupo(grp.dataset.grupo); return; }

  const segBtn = e.target.closest("[data-seg]");
  if(segBtn){
    S.seg = S.seg || {};
    S.seg[segBtn.dataset.seg] = segBtn.dataset.segid;
    save(false); render(); window.scrollTo({top:0});
    return;
  }

  const parkBtn = e.target.closest("[data-park]");
  if(parkBtn){ S.parkFilter = parkBtn.dataset.park; save(false); render(); return; }

  const linkBtn = e.target.closest("[data-attrlink]");
  if(linkBtn){ editarLinkAttr(linkBtn.dataset.attrlink); return; }

  if(e.target.closest("[data-act='syncNow']")){
    if(!S.sync.url){ setTab("ajustes"); return; }
    if(S.tab !== "ajustes") setTab("ajustes");
    syncNow();
    return;
  }

  if(e.target.closest("#themeBtn")){ toggleTheme(); return; }

  const act = e.target.closest("[data-act]");
  if(!act) return;
  const a = act.dataset.act;

  if(a === "addFam"){ S.family.push({id:uid("f"), nome:"Nova pessoa", tipo:"adulto", altura:170}); }
  else if(a === "delFam"){ S.family = S.family.filter(f => f.id !== act.dataset.id); }
  else if(a === "delShop"){ S.shop = S.shop.filter(s => s.id !== act.dataset.id); }
  else if(a === "delBud"){ S.budget = S.budget.filter(b => b.id !== act.dataset.id); }
  else if(a === "delDining"){ S.dining = S.dining.filter(r => r.id !== act.dataset.id); }
  else if(a === "unassignDining"){
    const r = S.dining.find(x => x.id === act.dataset.id);
    if(r) r.dia = "";
  }
  else if(a === "addHotel"){ S.hotels.push({id:uid("h"), nome:"Novo hotel", cidade:"", endereco:""}); }
  else if(a === "delHotel"){ S.hotels = S.hotels.filter(h => h.id !== act.dataset.id); }
  else if(a === "delCheck"){ S.extraCheck = S.extraCheck.filter(x => x.id !== act.dataset.id); delete S.checks[act.dataset.id]; }
  else if(a === "tgPlan"){ S.onlyPlan = !S.onlyPlan; save(false); render(); return; }
  else if(a === "tgKid"){ S.onlyKid = !S.onlyKid; save(false); render(); return; }

  else if(a === "baixarJson"){ baixarJson(); return; }
  else if(a === "baixarIcs"){ baixarIcs(); return; }
  else if(a === "ondeEstou"){ pedirLocal(); return; }
  else if(a === "clima"){ buscarClima(true); return; }
  else if(a === "filas"){ buscarFilas(true); return; }
  else if(a === "docAbrir"){ abrirDoc(act.dataset.id); return; }
  else if(a === "docShare"){ compartilharDoc(act.dataset.id); return; }
  else if(a === "docDel"){ removerDoc(act.dataset.id); return; }
  else if(a === "irAjustes"){ setTab("ajustes"); return; }
  else if(a === "simularOff"){ S.simularViagem = false; save(false); render(); return; }
  else if(a === "carroMarcar"){ marcarCarro(); return; }
  else if(a === "carroEsquecer"){ esquecerCarro(); return; }
  else if(a === "carroFotoVer"){ abrirDocId(CARRO_FOTO); return; }
  else if(a === "mapaTodas" || a === "mapaNenhuma"){
    const days = tripDays();
    const t2 = iso(today());
    const dt = days.includes(S.mapaDia) ? S.mapaDia : (days.includes(t2) ? t2 : days[0]);
    S.mapaSel = Object.assign({}, S.mapaSel,
      {[dt]: a === "mapaTodas" ? paradasDoDia(dt).map(p => p.id) : []});
    save(false); render(); return;
  }
  else if(a === "gastoAbrir"){ abrirGasto(); return; }
  else if(a === "gastoFechar"){ fecharGasto(); return; }
  else if(a === "gastoSalvar"){ salvarGasto(); return; }
  else if(a === "gastoDel"){ removerGasto(act.dataset.id); return; }
  else if(a === "recVer"){ abrirDocId(recId(act.dataset.id)); return; }
  else if(a === "fotoVer"){ abrirDocId(fotoId(act.dataset.id)); return; }
  else if(a === "fotoExp"){ exportarFoto(act.dataset.id); return; }
  else if(a === "fotoDel"){ removerFoto(act.dataset.id); return; }
  else if(a === "recTirar"){ recPendente = null; render(); return; }
  else if(a === "verDiaHoje"){
    S.diaSel = iso(today()); S.seg = Object.assign({}, S.seg, {roteiro:"dias"});
    setTab("roteiro"); return;
  }

  else if(a === "addCheck"){
    const g = act.dataset.grupo;
    const inp = document.querySelector(`[data-newcheck="${CSS.escape(g)}"]`);
    const v = inp && inp.value.trim();
    if(!v) return;
    S.extraCheck.push({id:uid("ck"), grupo:g, titulo:v});
  }
  else if(a === "addShop"){
    const c = act.dataset.cat;
    const inp = document.querySelector(`[data-newshop="${CSS.escape(c)}"]`);
    const v = inp && inp.value.trim();
    if(!v) return;
    S.shop.push({id:uid("s"), item:v, cat:c, loja:"A definir", qtd:1, usd:0, prio:2, done:false});
  }
  else if(a === "addBud"){
    const c = act.dataset.cat;
    const inp = document.querySelector(`[data-newbud="${CSS.escape(c)}"]`);
    const v = inp && inp.value.trim();
    if(!v) return;
    S.budget.push({id:uid("b"), label:v, cat:c, plan:0, real:0, cur:"USD"});
  }
  else if(a === "addDining"){
    const inp = document.querySelector("[data-newdining]");
    const v = inp && inp.value.trim();
    if(!v) return;
    S.dining.push({id:uid("d"), nome:v, local:"", nota:"", done:false});
  }

  else if(a === "sugestao"){ aplicarSugestao(); }
  else if(a === "limparRoteiro"){ if(confirm("Limpar todo o roteiro?")) S.days = {}; else return; }

  else if(a === "addItem"){
    const dt = act.dataset.dt;
    const nomeInp = document.querySelector(`[data-newitemname="${CSS.escape(dt)}"]`);
    const horaInp = document.querySelector(`[data-newitemtime="${CSS.escape(dt)}"]`);
    const nome = nomeInp && nomeInp.value.trim();
    if(!nome) return;
    const perInp = document.querySelector(`[data-newitemper="${CSS.escape(dt)}"]`);
    const per = (perInp && perInp.value) || PERIODO_PADRAO;
    S.days[dt] = S.days[dt] || {};
    S.days[dt].items = S.days[dt].items || [];
    S.days[dt].items.push({
      id:uid("it"), nome, attr:null, end:"",
      hora:(horaInp && horaInp.value) || "",
      periodo:per, ord:proximaOrd(dt, per)
    });
  }
  else if(a === "listaNova"){ novaLista(); return; }
  else if(a === "listaDel"){ apagarLista(act.dataset.id); return; }
  else if(a === "litemAdd"){
    const id = act.dataset.id;
    const inp = document.querySelector(`[data-newlitem="${CSS.escape(id)}"]`);
    const v = inp && inp.value.trim();
    if(!v) return;
    const l = S.listas.find(x => x.id === id);
    if(l) l.itens.push({id:uid("li"), texto:v, done:false});
  }
  else if(a === "litemDel"){
    const [lid, iid] = act.dataset.id.split("|");
    const l = S.listas.find(x => x.id === lid);
    if(l) l.itens = l.itens.filter(i => i.id !== iid);
  }
  else if(a === "marcaTirar"){ tirarMarcaDia(); return; }
  else if(a === "calAbrir"){ S.calAberto = true; save(false); render(); return; }
  else if(a === "calFechar"){ S.calAberto = false; save(false); render(); return; }
  else if(a === "itemLocal"){
    S.itemAberto = S.itemAberto === act.dataset.id ? "" : act.dataset.id;
    save(false); render(); return;
  }
  else if(a === "mvItem"){
    moverItem(act.dataset.dt, act.dataset.id, Number(act.dataset.dir));
  }
  else if(a === "delItem"){
    const dt = act.dataset.dt;
    if(S.days[dt] && S.days[dt].items) S.days[dt].items = S.days[dt].items.filter(it => it.id !== act.dataset.id);
  }

  else if(a === "copiar"){
    const box = document.getElementById("expBox");
    box.select(); box.setSelectionRange(0, 999999);
    navigator.clipboard.writeText(box.value)
      .then(() => { act.textContent = "Copiado"; setTimeout(() => act.textContent = "Copiar código", 1600); })
      .catch(() => { act.textContent = "Copie manualmente"; });
    return;
  }
  else if(a === "importar"){ importar(); return; }
  else if(a === "reset"){
    if(!confirm("Isso apaga tudo o que foi marcado e editado. Continuar?")) return;
    S = seed();
  }
  else return;

  save(); render();
});

document.addEventListener("change", (e) => {
  const t = e.target;

  if(t.dataset.sync){
    const k = t.dataset.sync;
    S.sync[k] = t.type === "checkbox" ? t.checked : t.value.trim();
    save(false);
    if(k === "provider") render();
    return;
  }
  if(t.dataset.device !== undefined){ S.device = t.value.trim() || "Sem nome"; save(false); return; }
  if(t.dataset.mapskey !== undefined){ S.mapsKey = t.value.trim(); save(false); render(); return; }

  if(t.dataset.litem){
    const [lid, iid] = t.dataset.litem.split("|");
    const l = S.listas.find(x => x.id === lid);
    const it = l && l.itens.find(i => i.id === iid);
    if(!it) return;
    if(t.type === "checkbox") it.done = t.checked; else it[t.dataset.k] = t.value;
    save(); render(); return;
  }
  if(t.dataset.lista){
    const l = S.listas.find(x => x.id === t.dataset.lista);
    if(l){ l[t.dataset.k] = t.value; save(); render(); }
    return;
  }
  if(t.dataset.marcanova !== undefined){
    definirMarcaDia(t.files && t.files[0]); t.value = ""; return;
  }
  if(t.dataset.capafoto !== undefined){
    fotoDoDia(t.dataset.capafoto, t.files && t.files[0]); t.value = ""; return;
  }
  if(t.dataset.mapapar !== undefined){
    const days = tripDays();
    const t2 = iso(today());
    const dt = days.includes(S.mapaDia) ? S.mapaDia : (days.includes(t2) ? t2 : days[0]);
    const todas = paradasDoDia(dt);
    const atual = new Set(selMapa(dt, todas));
    if(t.checked) atual.add(t.dataset.mapapar); else atual.delete(t.dataset.mapapar);
    /* guarda a ordem das paradas, não a de clique: é ela que vira o trajeto */
    S.mapaSel = Object.assign({}, S.mapaSel, {[dt]: todas.map(p=>p.id).filter(id => atual.has(id))});
    save(false); render(); return;
  }
  if(t.dataset.fotonova !== undefined){
    guardarFoto(t.files && t.files[0], t.dataset.fotopark || "", t.dataset.fotoattr || "");
    t.value = ""; return;
  }
  if(t.dataset.recnovo !== undefined){
    escolherRecibo(t.files && t.files[0]); t.value = ""; return;
  }
  if(t.dataset.recdepois){
    anexarRecibo(t.dataset.recdepois, t.files && t.files[0]); t.value = ""; return;
  }
  if(t.dataset.simular !== undefined){
    S.simularViagem = t.checked; save(false); render(); return;
  }
  if(t.dataset.carrofoto !== undefined){
    fotoCarro(t.files && t.files[0]); t.value = ""; return;
  }
  if(t.dataset.carro){
    S.carro = Object.assign({}, S.carro, {[t.dataset.carro]: t.value});
    save(); return;
  }

  if(t.dataset.docup !== undefined){
    adicionarDocs(t.files, t.dataset.docup);
    t.value = "";                       /* deixa re-escolher o mesmo arquivo */
    return;
  }

  if(t.dataset.check !== undefined){
    if(t.checked) S.checks[t.dataset.check] = true; else delete S.checks[t.dataset.check];
    espelharNoRoteiro(t.dataset.check, t.checked);
    save(); renderNav();
    const wrap = t.closest(".item, .attr");
    if(wrap) wrap.classList.toggle("done", t.checked);
    if(S.tab === "checklist" || S.tab === "inicio") render();
    return;
  }
  if(t.dataset.shopchk !== undefined){
    const s = S.shop.find(x => x.id === t.dataset.shopchk);
    if(s){ s.done = t.checked; save(); render(); }
    return;
  }
  if(t.dataset.trip){
    const k = t.dataset.trip;
    S.trip[k] = k === "rate" ? (parseFloat(t.value) || 0) : t.value;
    save(); render(); return;
  }
  if(t.dataset.fam){
    const f = S.family.find(x => x.id === t.dataset.fam);
    if(f){ f[t.dataset.k] = t.dataset.k === "altura" ? (parseInt(t.value,10)||0) : t.value; save(); }
    return;
  }
  if(t.dataset.day){
    const dt = t.dataset.day;
    S.days[dt] = S.days[dt] || {};
    S.days[dt][t.dataset.k] = t.value;
    save();
    if(t.dataset.k === "park") render();
    return;
  }
  if(t.dataset.item){
    const [dt, id] = t.dataset.item.split("|");
    const items = S.days[dt] && S.days[dt].items;
    const it = items && items.find(x => x.id === id);
    if(!it) return;
    it[t.dataset.k] = t.type === "checkbox" ? t.checked : t.value;
    save(); render(); return;
  }
  if(t.dataset.shop){
    const s = S.shop.find(x => x.id === t.dataset.shop);
    if(!s) return;
    const k = t.dataset.k;

  if(t.dataset.bud){

    save(); render(); return;
  }
  if(t.dataset.din){
    const r = S.dining.find(x => x.id === t.dataset.din);
    if(!r) return;

/* ============================== 8. AÇÕES ============================== */
/* sugerirRoteiro() e ROTEIRO_NOTAS ficam na seção 1 — o seed() precisa deles
   antes de S existir, e const não é hoisted como function declaration. */

/* Marcar uma atração em Parques cria o item no dia daquele parque; desmarcar
   tira. Só atrações (id "at|…") — item de checklist não vira programa de dia.
   Sem dia marcado com aquele parque, não inventa dia: a tela de Parques avisa. */
function espelharNoRoteiro(id, marcado){
  const pk = parqueDoAttr(id);
  if(!pk) return;

  if(!marcado){
    tripDays().forEach(dt => {
      const day = S.days[dt];
      if(day && day.items) day.items = day.items.filter(it => it.attr !== id);
    });
    return;
  }

  const dt = diaDoParque(pk);
  if(!dt) return;                               /* avisado na tela de Parques */
  S.days[dt] = S.days[dt] || {};
  S.days[dt].items = S.days[dt].items || [];
  if(S.days[dt].items.some(it => it.attr === id)) return;   /* já está lá */
  S.days[dt].items.push({
    id: uid("it"), nome: nomeDoAttr(id), attr: id,
    hora: "", periodo: PERIODO_PADRAO, ord: proximaOrd(dt, PERIODO_PADRAO)
  });
}

/* Sobe ou desce um item. Dentro do período, troca com o vizinho; na borda do
   bloco, pula para o período de cima ou de baixo. Assim uma seta só resolve
   ordem e faixa do dia, e a linha não precisa de um seletor de período. */
function moverItem(dt, id, dir){
  const day = S.days[dt];
  if(!day || !day.items) return;
  const alvo = day.items.find(i => i.id === id);
  if(!alvo) return;

  const porOrd = (a,b) => (a.ord ?? 999) - (b.ord ?? 999);
  const doPeriodo = (p) => day.items.filter(i => i !== alvo && periodoDoItem(i) === p).sort(porOrd);

  const per = periodoDoItem(alvo);
  const grupo = day.items.filter(i => periodoDoItem(i) === per).sort(porOrd);
  const i = grupo.indexOf(alvo), j = i + dir;

  if(j >= 0 && j < grupo.length){                      /* troca com o vizinho */
    grupo[i] = grupo[j]; grupo[j] = alvo;
    grupo.forEach((it,k) => it.ord = k);               /* renumera: sem buracos */
    return;
  }

  const pi = idxPeriodo(per) + dir;                    /* na borda: muda de faixa */
  if(pi < 0 || pi >= PERIODOS.length) return;          /* topo da madrugada, fim da noite */
  const destino = doPeriodo(PERIODOS[pi].id);
  alvo.periodo = PERIODOS[pi].id;
  if(dir < 0) destino.push(alvo); else destino.unshift(alvo);
  destino.forEach((it,k) => it.ord = k);
  doPeriodo(per).forEach((it,k) => it.ord = k);        /* fecha o buraco na origem */
}

function aplicarSugestao(){
  const plano = sugerirRoteiro(S.trip);
  if(!plano){ alert("O roteiro sugerido precisa de pelo menos 6 dias. Ajuste as datas na aba Início."); return; }

  /* Itens já cadastrados no dia não se perdem ao reaplicar a sugestão. */
  Object.keys(plano).forEach(dt => { plano[dt].items = (S.days[dt] && S.days[dt].items) || []; });

  S.days = plano;
}

/* ---------- sincronização ----------
   Merge por registro: docs/specs/F2-sync-offline.md · ADR 0003.
   Espelho de build/merge.js, que roda os mesmos testes fora do navegador. */

/* Coleções sincronizáveis. Arrays com id casam por id; mapas são LWW por chave. */
const COLS = ["family","hotels","shop","budget","dining","extraCheck","gastos","listas"];
const MAPS = ["checks","riscados","attrLinks"];
/* Objetos de campos soltos: cada campo é um caminho próprio, como trip:rate. */
const OBJS = ["trip","carro"];

/* u e del PRECISAM viajar, senão o merge não existe entre aparelhos.
   photos e version ficam (ADR 0005 e token do servidor é por aparelho). */
const LOCAL_ONLY = ["tab","parkFilter","onlyPlan","onlyKid","sync","device",
                    "lastSync","seg","diaSel","clima","filas","docs","gastoAberto",
                    "simularViagem","menuAberto","mapaDia","mapaSel","itemAberto","calAberto",
                    "diaFoto","marcaDia","grupoFechado","fotos","mapsKey"];
/* listas NÃO entra: lista própria é dado da viagem e sincroniza. */
/* riscados NÃO entra: riscar o dia é ritual de família e tem que aparecer nos
   dois celulares. A foto do dia (diaFoto) fica, porque é binário. */
/* `seg` já está aí de propósito: qual segmento está aberto é preferência
   deste aparelho, não algo para sincronizar. */

const clone = (v) => v === undefined ? undefined : JSON.parse(JSON.stringify(v));

/* Todo caminho sincronizável presente no state. */
function caminhos(S){
  const out = [];
  for(const o of OBJS) for(const k of Object.keys(S[o] || {})) out.push(o + ":" + k);
  for(const c of COLS) for(const r of S[c] || []) if(r && r.id) out.push(c + ":" + r.id);
  for(const m of MAPS) for(const k of Object.keys(S[m] || {})) out.push(m + ":" + k);
  for(const isoD of Object.keys(S.days || {})){
    const dia = S.days[isoD] || {};
    for(const k of Object.keys(dia)) if(k !== "items") out.push("days:" + isoD + ":" + k);
    for(const it of dia.items || []) if(it && it.id) out.push("days:" + isoD + ":items:" + it.id);
  }
  return out;
}

/* Corta só nos separadores estruturais: id de check tem "|" e pode ter o que quiser. */
function parse(p){
  const i = p.indexOf(":");
  const raiz = p.slice(0, i), resto = p.slice(i + 1);
  if(raiz !== "days") return {raiz, id:resto};
  const j = resto.indexOf(":");
  const campo = resto.slice(j + 1);
  return campo.slice(0, 6) === "items:"
    ? {raiz, iso:resto.slice(0, j), item:campo.slice(6)}
    : {raiz, iso:resto.slice(0, j), campo};
}

function ler(S, p){
  const q = parse(p);
  if(OBJS.includes(q.raiz)) return (S[q.raiz] || {})[q.id];
  if(COLS.includes(q.raiz)) return (S[q.raiz] || []).find(r => r && r.id === q.id);
  if(MAPS.includes(q.raiz)) return (S[q.raiz] || {})[q.id];
  if(q.raiz === "days"){
    const dia = (S.days || {})[q.iso];
    if(!dia) return undefined;
    return q.item ? (dia.items || []).find(it => it && it.id === q.item) : dia[q.campo];
  }
  return undefined;
}

function escrever(S, p, v){
  const q = parse(p);
  if(OBJS.includes(q.raiz)){ (S[q.raiz] = S[q.raiz] || {})[q.id] = v; return; }
  if(COLS.includes(q.raiz)){ porId(S[q.raiz] = S[q.raiz] || [], q.id, v); return; }
  if(MAPS.includes(q.raiz)){ (S[q.raiz] = S[q.raiz] || {})[q.id] = v; return; }
  if(q.raiz === "days"){
    S.days = S.days || {};
    const dia = S.days[q.iso] = S.days[q.iso] || {};
    if(q.item) porId(dia.items = dia.items || [], q.item, v);
    else dia[q.campo] = v;
  }
}

function apagar(S, p){
  const q = parse(p);
  if(OBJS.includes(q.raiz)){ if(S[q.raiz]) delete S[q.raiz][q.id]; return; }
  if(COLS.includes(q.raiz)){ semId(S[q.raiz], q.id); return; }
  if(MAPS.includes(q.raiz)){ if(S[q.raiz]) delete S[q.raiz][q.id]; return; }
  if(q.raiz === "days"){
    const dia = (S.days || {})[q.iso];
    if(!dia) return;
    if(q.item) semId(dia.items, q.item); else delete dia[q.campo];
  }
}

function porId(arr, id, v){
  const i = arr.findIndex(r => r && r.id === id);
  if(i >= 0) arr[i] = v; else arr.push(v);
}
function semId(arr, id){
  if(!arr) return;
  const i = arr.findIndex(r => r && r.id === id);
  if(i >= 0) arr.splice(i, 1);
}

const carimbo = (x, p) => Math.max(((x.u || {})[p]) || 0, ((x.del || {})[p]) || 0);

/* Pura: nada de I/O, Date.now() nem variável global. Empate vai para "a" (o local),
   que é determinístico e evita ping-pong entre dois aparelhos. */
function merge(a, b){
  const R = clone(a);
  R.u = R.u || {}; R.del = R.del || {};
  const todos = new Set([].concat(
    caminhos(a), caminhos(b),
    Object.keys(a.u || {}), Object.keys(a.del || {}),
    Object.keys(b.u || {}), Object.keys(b.del || {})
  ));
  for(const p of todos){
    const ca = carimbo(a, p), cb = carimbo(b, p);

    /* Sem carimbo nenhum nos dois lados = dado anterior a esta fase. Preserva. */
    if(!ca && !cb){
      const v = ler(a, p) !== undefined ? ler(a, p) : ler(b, p);
      if(v !== undefined) escrever(R, p, clone(v));
      continue;
    }

    const vence = ca >= cb ? a : b, perde = vence === a ? b : a;
    const morto = (vence.del || {})[p] !== undefined;
    /* Se o vencedor não tem lápide mas também não tem o dado, cai para o outro lado:
       só lápide apaga registro, ausência não. */
    const v = morto ? undefined
            : (ler(vence, p) !== undefined ? ler(vence, p) : ler(perde, p));

    if(v === undefined){
      apagar(R, p); delete R.u[p]; R.del[p] = Math.max(ca, cb);
    }else{
      escrever(R, p, clone(v)); delete R.del[p]; R.u[p] = Math.max(ca, cb);
    }
  }
  R.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  return R;
}

/* Retrato dos caminhos antes de um handler mexer no state. Em captura, então
   roda antes de qualquer listener de bolha. */
let retratoAntes = null;

function retrato(){
  const m = {};
  for(const p of caminhos(S)) m[p] = JSON.stringify(ler(S, p));
  return m;
}

/* Diferença entre o retrato e o agora vira carimbo (mudou) ou lápide (sumiu). */
function carimbar(antes){
  const agora = Date.now();
  const depois = retrato();
  S.u = S.u || {}; S.del = S.del || {};
  for(const p in depois){
    if(antes[p] !== depois[p]){ S.u[p] = agora; delete S.del[p]; }
  }
  for(const p in antes){
    if(!(p in depois)){ S.del[p] = agora; delete S.u[p]; }
  }
}

["click","change","input"].forEach(ev =>
  document.addEventListener(ev, () => { retratoAntes = retrato(); }, true));

function payload(){
  const p = {};
  Object.keys(S).forEach(k => { if(!LOCAL_ONLY.includes(k)) p[k] = S[k]; });
  p.updatedAt = S.updatedAt;
  p.updatedBy = S.device;
  return p;
}

function syncUrls(){
  const base = S.sync.url.replace(/\/+$/,"");
  if(S.sync.provider === "jsonbin"){
    return { read: base + "/latest", write: base,
             headers: {"X-Master-Key": S.sync.token, "X-Bin-Meta":"false"} };
  }
  const h = {};
  if(S.sync.token) h[S.sync.header || "Authorization"] = S.sync.token;
  /* O contrato (docs/API.md) é GET/PUT em /trip. Aceita a URL base ou já com o
     caminho, para não depender de o usuário lembrar de colar o final certo. */
  const alvo = /\/trip$/.test(base) ? base : base + "/trip";
  return { read: alvo, write: alvo, headers: h };
}

function syncMsg(txt, tone){
  const el = document.getElementById("syncMsg");
  if(!el) return;
  el.textContent = txt;
  el.style.color = tone === "ok" ? "var(--ok)" : tone === "err" ? "var(--crit)" : "var(--fg-dim)";
}

/* Traduz a falha para algo acionável em vez de "Failed to fetch". */
function syncErro(e, res){
  if(res){
    if(res.status === 401 || res.status === 403) return "Chave recusada pelo servidor. Confira a X-Master-Key.";
    if(res.status === 404) return "Endereço não encontrado. Confira o Bin ID na URL.";
    if(res.status === 429) return "Muitas requisições seguidas. Espere um minuto e tente de novo.";
    return `O servidor respondeu ${res.status}.`;
  }
  return "Não foi possível falar com o servidor. Se você está na página publicada no claude.ai, o sync não funciona lá — ela bloqueia chamadas externas. Hospede o arquivo ou abra-o do computador.";
}

let sincronizando = false;

/* Merge no cliente + version opaca do servidor. Não existe "forçar": com merge
   por registro, forçar é justamente a maneira de perder dado (ADR 0003). */
async function syncNow(){
  if(sincronizando) return;
  if(!S.sync.url){ syncMsg("Configure a URL do servidor primeiro.", "err"); return; }
  if(!comRede){ syncMsg("Sem rede agora. Suas alterações estão salvas e sobem sozinhas quando a conexão voltar.", "err"); return; }
  sincronizando = true;
  renderNav();

  const u = syncUrls();
  const jb = S.sync.provider === "jsonbin";

  try{
    for(let tentativa = 1; tentativa <= 3; tentativa++){
      syncMsg(tentativa === 1 ? "Sincronizando…" : `Alguém gravou antes — remesclando (${tentativa}/3)…`);

      /* 1 · lê o remoto */
      let remoto = null, versaoRemota = null, res = null;
      try{
        res = await fetch(u.read, {headers: u.headers, cache:"no-store"});
      }catch(e){ syncMsg(syncErro(e, null), "err"); return; }

      if(res.status === 404){
        remoto = null;                       /* servidor vazio: primeiro envio */
      }else if(!res.ok){
        syncMsg(syncErro(null, res), "err"); return;
      }else{
        let body;
        try{ body = await res.json(); }
        catch(e){ syncMsg("O servidor respondeu algo que não é JSON válido.", "err"); return; }
        if(jb){
          remoto = (body && body.record !== undefined) ? body.record : body;
        }else{
          remoto = body ? body.data : null;
          versaoRemota = body ? body.version : null;
        }
        if(!remoto || typeof remoto !== "object" || !remoto.trip) remoto = null;
      }

      /* 2 · mescla (função pura, testada em build/merge.js) */
      const local = payload();
      const junto = remoto ? merge(local, remoto) : local;

      /* 3 · grava, respeitando a version que acabamos de ler */
      const envio = jb ? junto : {version: versaoRemota, data: junto};
      let put;
      try{
        put = await fetch(u.write, {
          method:"PUT",
          headers: Object.assign({"Content-Type":"application/json"}, u.headers),
          body: JSON.stringify(envio)
        });
      }catch(e){ syncMsg(syncErro(e, null), "err"); return; }

      if(put.status === 409){ continue; }        /* corrida: relê e remescla */
      if(!put.ok){ syncMsg(syncErro(null, put), "err"); return; }

      let resp = null;
      try{ resp = await put.json(); }catch(e){}

      aplicarMerge(junto);
      const quantos = remoto ? Object.keys(remoto.u || {}).length : 0;
      syncMsg(remoto
        ? `Sincronizado. Nada se perdeu — os dois lados foram combinados.`
        : `Enviado. O servidor agora tem a versão deste aparelho (${S.device}).`, "ok");
      return;
    }
    syncMsg("Outro aparelho gravou três vezes seguidas durante a sincronização. Tente de novo em alguns segundos.", "err");
  }finally{
    sincronizando = false;
    renderNav();
  }
}

/* ---------- gatilhos de sincronização (F3) ----------
   Não existe fila de operações: S.u e S.del já SÃO a fila, e o merge resolve o
   resto. O que falta é só o gatilho. */

let redeTimer;

/* Debounce de 3s: entrar e sair de Wi-Fi dispara o listener várias vezes
   seguidas, e a trava `sincronizando` sozinha não evita a rajada. */
function agendarSync(){
  clearTimeout(redeTimer);
  redeTimer = setTimeout(() => {
    if(comRede && pendente() && !sincronizando) syncNow();
  }, 3000);
}

function marcarRede(ligada){
  const mudou = comRede !== ligada;
  comRede = ligada;
  if(mudou) renderNav();
  if(ligada){ agendarSync(); buscarClima(false); buscarFilas(false); }
}

if(NATIVE && Capacitor.Plugins && Capacitor.Plugins.Network){
  const Rede = Capacitor.Plugins.Network;
  Rede.getStatus().then(st => marcarRede(!!st.connected)).catch(() => {});
  Rede.addListener("networkStatusChange", st => marcarRede(!!st.connected));
}else{
  addEventListener("online",  () => marcarRede(true));
  addEventListener("offline", () => marcarRede(false));
}

/* App voltando do segundo plano. Sem retry agressivo: se falhar, espera o
   próximo evento de rede — com 4 aparelhos e o botão manual à mão, o próximo
   evento é backoff suficiente. */
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible") agendarSync();
});

/* Aplica o resultado do merge sem carimbar de novo: os carimbos já vieram
   prontos de dentro do merge, e recarimbar aqui marcaria tudo como local. */
function aplicarMerge(junto){
  const manter = {};
  LOCAL_ONLY.forEach(k => manter[k] = S[k]);
  S = Object.assign(seed(), junto, manter);
  S.lastSync = S.updatedAt = junto.updatedAt || Date.now();
  retratoAntes = null;
  save(false);
  render();
}

async function baixarJson(){
  const nome = "viagem-disney-" + iso(today()) + ".json";

  const diz = (t,c) => { if(msg){ msg.textContent = t; msg.style.color = c; } };

    catch(err){
      const c = err && err.code;
      diz(c === "declined" ? "Download cancelado." :
          c === "too_large" ? "Arquivo grande demais para salvar aqui — use o código de transferência." :
          "Não foi possível salvar por aqui. Use o código de transferência abaixo.", "var(--crit)");
    }
    return;
  }

function encodeState(){
  return btoa(unescape(encodeURIComponent(JSON.stringify(payload()))));
}

function importar(){
  const box = document.getElementById("impBox");
  const msg = document.getElementById("impMsg");
  const raw = box.value.trim();
  if(!raw){ msg.textContent = "Cole o código antes de importar."; msg.style.color = "var(--crit)"; return; }
  let obj;
  try{
    obj = JSON.parse(decodeURIComponent(escape(atob(raw))));
  }catch(err){
    try{ obj = JSON.parse(raw); }
    catch(err2){ msg.textContent = "Código inválido. Copie de novo do outro aparelho, sem cortar nenhuma parte."; msg.style.color = "var(--crit)"; return; }
  }
  if(!obj || typeof obj !== "object" || !obj.trip || !Array.isArray(obj.shop)){
    msg.textContent = "Esse código não é de um planejador de viagem.";
    msg.style.color = "var(--crit)"; return;
  }
  if(!confirm("Isso substitui os dados deste aparelho. Continuar?")) return;
  const manter = {};
  LOCAL_ONLY.forEach(k => manter[k] = S[k]);
  S = Object.assign(seed(), obj, manter);
  S.tab = "ajustes";
  save(); render();
  const m2 = document.getElementById("impMsg");
  m2.textContent = "Dados importados."; m2.style.color = "var(--ok)";
}

/* ============================== 8a. LOCALIZAÇÃO ==============================
   Espelho de build/geo.js, que roda os mesmos asserts fora do navegador.
   A posição só é lida quando a tela pede — nada em segundo plano (F7). */

const PARK_GEO = {
  mk:  {lat:28.4177, lng:-81.5812, r:1200},
  ak:  {lat:28.3580, lng:-81.5901, r:1400},
  hs:  {lat:28.3575, lng:-81.5583, r:1000},
  ue:  {lat:28.4730, lng:-81.4650, r:1200},
  ds:  {lat:28.3700, lng:-81.5190, r:900},
  mia: {lat:25.7907, lng:-80.1300, r:8000}
};

const R_TERRA = 6371000; // raio médio, metros
const rad = (g) => g * Math.PI / 180;

/* Haversine. Esfera, não elipsoide: erra ~0,3% e ninguém vai notar num raio de 1 km. */
function distancia(lat1, lng1, lat2, lng2){
  const dLat = rad(lat2 - lat1), dLng = rad(lng2 - lng1);
  const a = Math.sin(dLat/2) ** 2
          + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng/2) ** 2;
  return 2 * R_TERRA * Math.asin(Math.min(1, Math.sqrt(a)));
}

/* Chave do lugar cujo raio contém o ponto. Empate de distância desempata pelo nome
   da chave, para que a mesma coordenada devolva sempre a mesma resposta. */
function parqueAtual(lat, lng, geo = PARK_GEO){
  let melhor = null, dMelhor = Infinity;
  for(const k of Object.keys(geo)){
    const g = geo[k];
    const d = distancia(lat, lng, g.lat, g.lng);
    if(d > g.r) continue;
    if(d < dMelhor || (d === dMelhor && k < melhor)){ melhor = k; dMelhor = d; }
  }
  return melhor;
}

/* Lugar mais próximo, mesmo fora do raio — a tela usa para dizer a distância
   quando você ainda está a caminho. Devolve null só se a tabela estiver vazia. */
function maisProximo(lat, lng, geo = PARK_GEO){
  let melhor = null, dMelhor = Infinity;
  for(const k of Object.keys(geo)){
    const g = geo[k];
    const d = distancia(lat, lng, g.lat, g.lng);
    if(d < dMelhor || (d === dMelhor && k < melhor)){ melhor = k; dMelhor = d; }
  }
  return melhor === null ? null : {chave: melhor, dist: dMelhor};
}

/* Última posição lida nesta sessão. Não persiste: posição velha engana mais
   do que ajuda, e no dia seguinte estaria errada. */
let ondeEstou = null;   // {chave, dist, dentro} ou null
let pedindoLocal = false;

function localDisponivel(){
  return typeof navigator !== "undefined" && !!navigator.geolocation
      && (typeof isSecureContext === "undefined" || isSecureContext);
}

function pedirLocal(){
  if(pedindoLocal || !localDisponivel()) return;
  pedindoLocal = true;
  const el = document.getElementById("localMsg");
  if(el) el.textContent = "Procurando…";
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const {latitude:la, longitude:ln} = pos.coords;
      const dentro = parqueAtual(la, ln);
      const perto = maisProximo(la, ln);
      ondeEstou = perto ? {chave: dentro || perto.chave, dist: perto.dist, dentro: !!dentro, lat: la, lng: ln} : null;
      pedindoLocal = false;
      /* estando no parque, já abre a lista dele */
      if(dentro && ATTR[dentro]) S.parkFilter = dentro;
      save(false); render();
    },
    (err) => {
      pedindoLocal = false;
      const e2 = document.getElementById("localMsg");
      if(e2) e2.textContent = err && err.code === 1
        ? "Permissão negada. Dá para usar o app normalmente sem isso."
        : "Não foi possível obter a localização agora.";
    },
    {enableHighAccuracy:true, timeout:12000, maximumAge:60000}
  );
}

/* "no Magic Kingdom", mas "em Miami": cidade não leva artigo. */
const prepLocal = (k) => k === "mia" ? "em" : "no";

/* Bloco da aba Hoje. Fora de qualquer raio conhecido não mostra nada —
   silêncio é melhor que ruído. */
function blocoLocal(){
  if(!localDisponivel()) return "";
  if(!ondeEstou){
    return `<div class="card"><div class="card-bd" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <button class="btn ghost sm" type="button" data-act="ondeEstou">Onde eu estou?</button>
      <span id="localMsg" style="font-size:13px;color:var(--fg-dim)">Mostra em que parque você está e a distância até ele.</span>
    </div></div>`;
  }
  const nome = PARKS[ondeEstou.chave] ? PARKS[ondeEstou.chave].n : ondeEstou.chave;
  const km = ondeEstou.dist >= 1000
    ? (ondeEstou.dist/1000).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " km"
    : Math.round(ondeEstou.dist) + " m";
  return `<div class="card pk ${PARKS[ondeEstou.chave] ? PARKS[ondeEstou.chave].cls : ""}">
    <div class="parkbar"></div>
    <div class="card-bd" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span class="parkicon sm">${parkIconSvg(parkOf(ondeEstou.chave))}</span>
      <span style="flex:1;min-width:150px">
        <b style="display:block">${ondeEstou.dentro ? "Você está " + prepLocal(ondeEstou.chave) + " " + esc(nome) : esc(nome)}</b>
        <span style="font-size:13px;color:var(--fg-dim)">${ondeEstou.dentro ? "a lista de atrações já abriu neste parque" : "a " + km + " daqui"}</span>
      </span>
      <button class="btn ghost sm" type="button" data-act="ondeEstou">Atualizar</button>
    </div>
  </div>`;
}

/* ============================== 8a-2. TEMPO DE FILA ==============================
   Vem do queue-times.com por proxy na Edge Function — a API deles não manda
   CORS, então o navegador não chama direto. É fonte não-oficial: pode cair, e
   quando cai o app simplesmente não mostra fila nenhuma.

   Casar os nomes é o problema real: eles escrevem "Expedition Everest - Legend
   of the Forbidden Mountain" e aqui está "Expedition Everest". Medido contra as
   119 atrações, o casador acerta 78% — e o que sobra é parada, show, playground
   e trilha, que não têm fila mesmo. */

const FILA_STOP = new Set(["the","a","an","of","and","at","her","his","to","in","on","with","railroad","presented","by"]);

function filaToks(nome){
  return String(nome||"")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/\(.*?\)/g," ")        /* (fogos), (playground) */
    .split(/[—–]/)[0]                /* corta a explicação após o travessão */
    .replace(/[^a-z0-9 ]/g," ")
    .split(/\s+/)
    .filter(w => w && !FILA_STOP.has(w));
}

/* Melhor candidato por sobreposição de palavras: quanto do MEU nome aparece no
   deles. Abaixo de 60% é chute, e chute aqui vira fila errada na tela. */
function acharFila(nome, lista){
  const a = filaToks(nome);
  if(!a.length || !lista || !lista.length) return null;
  const seta = new Set(a);
  let melhor = null, score = 0;
  for(const r of lista){
    const b = r._t || (r._t = filaToks(r.n));
    if(!b.length) continue;
    let inter = 0;
    for(const w of seta) if(b.includes(w)) inter++;
    const s = inter / seta.size;
    if(s > score || (s === score && melhor && b.length < melhor._t.length)){ score = s; melhor = r; }
  }
  return score >= 0.6 ? melhor : null;
}

/* ---------- recibo do gasto ----------
   Foto de recibo não precisa de 3 MB: reduz para 1400px e JPEG 0,72 antes de
   guardar. Fica legível para conferir a fatura, salva na hora e não enche o
   IndexedDB numa viagem de dez dias.

   A foto fica no aparelho, como todo binário (ADR 0010). O gasto sincroniza. */
const recId = (id) => "rec-" + id;

/* tipo="image/png" preserva transparência — JPEG não tem canal alfa, e uma
   silhueta reencodada em JPEG deixa de recortar quando usada como máscara. */
function comprimirImagem(arquivo, maxLado = 1400, q = 0.72, tipo = "image/jpeg"){
  return new Promise((ok) => {
    if(!/^image\//.test(arquivo.type || "")) return ok(arquivo);
    const url = URL.createObjectURL(arquivo);
    const img = new Image();
    img.onload = () => {
      const escala = Math.min(1, maxLado / Math.max(img.width, img.height));
      /* já é pequena: não reencoda para não perder qualidade à toa */
      if(escala === 1 && arquivo.size < 900*1024){ URL.revokeObjectURL(url); return ok(arquivo); }
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * escala);
      c.height = Math.round(img.height * escala);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => { URL.revokeObjectURL(url); ok(b || arquivo); }, tipo, q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); ok(arquivo); };
    img.src = url;
  });
}

/* Segura a foto escolhida até o gasto ser salvo — antes disso ele não tem id. */
let recPendente = null;

async function escolherRecibo(arquivo){
  if(!arquivo) return;
  const m = document.getElementById("gastoMsg");
  if(m){ m.textContent = "Preparando a foto…"; m.style.color = "var(--fg-dim)"; }
  recPendente = await comprimirImagem(arquivo);
  render();   /* mostra a miniatura na folha */
}

/* Anexa depois, direto da lista, sem reabrir a folha. */
async function anexarRecibo(id, arquivo){
  if(!arquivo) return;
  const g = S.gastos.find(x => x.id === id);
  if(!g) return;
  const blob = await comprimirImagem(arquivo);
  await docPut(recId(id), blob);
  g.rec = blob.size;
  save(); render();
}

let buscandoFilas = false;

async function buscarFilas(forcar){
  if(buscandoFilas || !comRede || !S.sync.url) return;
  const f = S.filas || {};
  if(!forcar && f.at && Date.now() - f.at < 4*60*1000) return;   /* 4 min */
  buscandoFilas = true;
  try{
    const u = syncUrls();
    const res = await fetch(u.read + "/filas", {headers: u.headers, cache:"no-store"});
    if(!res.ok) throw new Error("http " + res.status);
    const body = await res.json();
    if(!body || !body.parques) throw new Error("resposta vazia");
    S.filas = {at: Date.now(), parques: body.parques};
    save(false); render();
  }catch(e){
    /* Fonte não-oficial: sem fila o app inteiro continua igual. */
    console.warn("filas:", e && e.message);
  }finally{ buscandoFilas = false; }
}

/* Etiqueta ao lado da atração. Só aparece com dado fresco: fila de 3 horas
   atrás é pior que fila nenhuma. */
function pillFila(pk, nome){
  const f = S.filas || {};
  if(!f.at || Date.now() - f.at > 30*60*1000) return "";
  const r = acharFila(nome, (f.parques || {})[pk]);
  if(!r) return "";
  if(!r.a) return `<span class="pill neutral" title="fechada agora">fechada</span>`;
  const cls = r.w >= 60 ? "crit" : r.w >= 30 ? "warn" : "ok";
  return `<span class="pill ${cls}" title="tempo de fila agora">${r.w} min</span>`;
}

/* ============================== 8a-1. ONDE ESTACIONEI ==============================
   Estacionamento de parque tem o tamanho de um bairro, e vocês saem de lá às
   22h com duas crianças cansadas. Um toque grava a coordenada; a foto da placa
   da fileira é o que realmente resolve, porque GPS não distingue fileira B12 de
   B14. A coordenada sincroniza (é dado da viagem); a foto fica no aparelho. */

const CARRO_FOTO = "carro-foto";

function marcarCarro(){
  if(!localDisponivel()){ carroMsg("Este navegador não dá a localização.", "err"); return; }
  carroMsg("Pegando a localização…");
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const perto = maisProximo(pos.coords.latitude, pos.coords.longitude);
      S.carro = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        at: Date.now(),
        onde: perto && perto.dist < 4000 ? perto.chave : "",
        nota: (S.carro && S.carro.nota) || ""
      };
      save(); render();
      carroMsg("Local do carro guardado.", "ok");
    },
    (err) => carroMsg(err && err.code === 1
      ? "Permissão de localização negada."
      : "Não foi possível obter a localização agora.", "err"),
    {enableHighAccuracy:true, timeout:12000, maximumAge:0}
  );
}

async function fotoCarro(arquivo){
  if(!arquivo) return;
  try{
    await docPut(CARRO_FOTO, arquivo);
    S.carro = Object.assign({}, S.carro, {foto: Date.now()});
    save(); render();
    carroMsg("Foto guardada neste aparelho.", "ok");
  }catch(e){ carroMsg("Não foi possível guardar a foto.", "err"); }
}

async function esquecerCarro(){
  if(!confirm("Esquecer onde o carro está?")) return;
  await docDel(CARRO_FOTO);
  S.carro = {};
  save(); render();
}

function carroMsg(t, tom){
  const el = document.getElementById("carroMsg");
  if(!el) return;
  el.textContent = t;
  el.style.color = tom === "err" ? "var(--crit)" : tom === "ok" ? "var(--ok)" : "var(--fg-dim)";
}

const horasDesde = (ms) => {
  const min = Math.round((Date.now() - ms) / 60000);
  if(min < 1) return "agora";
  if(min < 60) return "há " + min + " min";
  const h = Math.floor(min/60);
  return "há " + h + "h" + (min%60 ? String(min%60).padStart(2,"0") : "");
};

function blocoCarro(){
  if(faseViagem() !== "durante") return "";
  const c = S.carro || {};
  const tem = c.lat != null && c.lng != null;
  return `
  <div class="card">
    <div class="card-hd">
      <h2>Onde estacionei</h2>
      ${tem ? `<button class="btn ghost sm" type="button" data-act="carroEsquecer">Esquecer</button>` : ""}
    </div>
    <div class="card-bd">
      ${tem ? `
        <p style="margin:0 0 10px;font-size:14px">
          <b>${c.onde && PARKS[c.onde] ? esc(PARKS[c.onde].n) : "Local guardado"}</b>
          <span style="color:var(--fg-dim)"> · ${horasDesde(c.at)}</span>
        </p>
        ${c.nota ? `<p style="margin:0 0 10px;font-size:13.5px">${esc(c.nota)}</p>` : ""}
        <div class="row" style="gap:8px">
          <a class="btn ghost sm" href="${mapUrl(c.lat + "," + c.lng)}" target="_blank" rel="noopener noreferrer">Ver no mapa ↗</a>
          ${c.foto ? `<button class="btn ghost sm" type="button" data-act="carroFotoVer">Ver a foto</button>` : ""}
          <label class="btn ghost sm" style="cursor:pointer">${c.foto ? "Trocar foto" : "Foto da fileira"}
            <input type="file" accept="image/*" capture="environment" data-carrofoto hidden></label>
        </div>
        <label class="f" style="margin-top:10px"><span>Fileira, setor, referência</span>
          <input type="text" data-carro="nota" value="${esc(c.nota||"")}" placeholder="ex.: Heroes 12, perto do ponto do trenzinho"></label>
      ` : `
        <p style="font-size:13.5px;color:var(--fg-dim);margin:0 0 10px">Ao estacionar, toque abaixo. Guarda a coordenada e, se quiser, uma foto da placa da fileira — GPS acha o estacionamento, mas não distingue a fileira B12 da B14.</p>
        <button class="btn" type="button" data-act="carroMarcar">Marquei aqui</button>
      `}
      <p id="carroMsg" style="font-size:12.5px;margin:10px 0 0;color:var(--fg-dim)"></p>
    </div>
  </div>`;
}

/* ============================== 8a-4. CONTAGEM NO CALENDÁRIO ==============================
   Abre ao tocar na capa. Antes da viagem, cada dia vira um X que a criança
   risca — o X é desenhado, não aparece pronto, porque riscar é o ritual.
   Nos dias da viagem, cada dia recebe uma foto que vira a capa daquele dia.

   Os riscos SINCRONIZAM (o ritual é da família); a foto fica no aparelho,
   como todo binário (ADR 0010). */

const capaDiaId = (i) => "capadia-" + i;

/* Marca dos dias da viagem, escolhida pelo dono do aparelho.
   Fica no IndexedDB deste celular e NUNCA entra no index.html publicado — é o
   que permite usar uma arte de terceiros sem distribuí-la num site público. */
const MARCA_DIA = "marca-dia";

/* A marca entra como MÁSCARA, não como imagem: assim a silhueta assume a cor
   do parque do dia e continua legível nos dois temas — colada como imagem, um
   PNG preto some no tema escuro e engole o número do dia. */
function marcaSuportada(){
  return typeof CSS !== "undefined" && CSS.supports &&
    (CSS.supports("mask-image", "url(x)") || CSS.supports("-webkit-mask-image", "url(x)"));
}

async function definirMarcaDia(arquivo){
  if(!arquivo) return;
  try{
    await pedirPersistencia();
    /* PNG e sem atalho de "já é pequena": a marca precisa do alfa intacto */
    const blob = await comprimirImagem(arquivo, 256, 1, "image/png");
    await docPut(MARCA_DIA, blob);
    S.marcaDia = blob.size; save(false); render();
  }catch(e){ console.warn("marca do dia:", e && e.message); }
}
async function tirarMarcaDia(){
  await docDel(MARCA_DIA);
  S.marcaDia = 0; save(false); render();
}

/* Do começo da semana de hoje até o fim da viagem, alinhado por dia da semana
   para ler como calendário. */
function diasDoCalendario(){
  const fim = d(S.trip.end);
  if(isNaN(fim)) return [];
  const hj = today();
  const ini = new Date(hj.getFullYear(), hj.getMonth(), hj.getDate() - hj.getDay());
  const out = [];
  for(let x = new Date(ini); x <= fim; x.setDate(x.getDate() + 1)) out.push(iso(new Date(x)));
  /* fecha a última semana para o grid não ficar com buraco */
  while(out.length % 7) {
    const u = d(out[out.length-1]);
    out.push(iso(new Date(u.getFullYear(), u.getMonth(), u.getDate() + 1)));
  }
  return out;
}

const ehDiaDaViagem = (i) => tripDays().includes(i);

function riscarDia(i){
  S.riscados = Object.assign({}, S.riscados);
  if(S.riscados[i]) delete S.riscados[i]; else S.riscados[i] = true;
  save();
  render();
}

async function fotoDoDia(i, arquivo){
  if(!arquivo) return;
  try{
    await pedirPersistencia();
    const blob = await comprimirImagem(arquivo, 1200, 0.82);
    await docPut(capaDiaId(i), blob);
    S.diaFoto = Object.assign({}, S.diaFoto, {[i]: blob.size});
    save(false); render();
  }catch(e){ console.warn("capa do dia:", e && e.message); }
}

function folhaCalendario(){
  if(!S.calAberto) return "";
  const dias = diasDoCalendario();
  if(!dias.length) return "";

  const hj = iso(today());
  const faltam = Math.max(0, diffDays(today(), d(S.trip.start)));
  const riscados = dias.filter(x => S.riscados[x] && !ehDiaDaViagem(x)).length;
  const comFoto = Object.keys(S.diaFoto || {}).length;

  const cel = (i) => {
    const dd = d(i);
    const daViagem = ehDiaDaViagem(i);
    const passou = i < hj;
    const foraDoFim = d(i) > d(S.trip.end);
    if(foraDoFim) return `<div class="cal-c cal-vazia"></div>`;

    if(daViagem){
      const tem = (S.diaFoto || {})[i];
      /* Sem foto, o dia mostra o ícone do PARQUE daquele dia — diz mais que um
         símbolo genérico, e usa as silhuetas próprias que o app já desenha
         (nada de personagem registrado, ADR 0007). */
      const pkDia = parkOf((S.days[i] || {}).park || "none");
      return `<label class="cal-c cal-viagem pk ${PARKS[pkDia].cls}${tem ? " tem" : ""}${i===hj ? " hoje" : ""}"
          title="${i} · ${esc(PARKS[pkDia].n)}">
        <span class="cal-n">${dd.getDate()}</span>
        ${tem
          ? `<img data-capadia="${i}" alt="${esc(PARKS[pkDia].n)}">`
          : (S.marcaDia && marcaSuportada())
            ? `<span class="cal-marca" data-marcadia="1" aria-hidden="true"></span>`
            : `<span class="cal-pico">${parkIconSvg(pkDia)}</span>`}
        <input type="file" accept="image/*" capture="environment" data-capafoto="${i}" hidden>
      </label>`;
    }
    return `<button class="cal-c cal-conta${S.riscados[i] ? " risca" : ""}${i===hj ? " hoje" : ""}${passou ? " passou" : ""}"
        type="button" data-riscar="${i}" aria-pressed="${!!S.riscados[i]}" title="${i}">
      <span class="cal-n">${dd.getDate()}</span>
      <svg class="cal-x" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M9 9 L31 31"/><path d="M31 9 L9 31"/>
      </svg>
    </button>`;
  };

  return `
  <div class="folha-fundo" data-act="calFechar"></div>
  <div class="folha folha-cal" role="dialog" aria-label="Contagem para a viagem">
    <div class="folha-hd">
      <b>${faltam > 0 ? `Faltam ${faltam} dia${faltam===1?"":"s"}` : "A viagem começou"}</b>
      <button class="del" type="button" data-act="calFechar" aria-label="Fechar">×</button>
    </div>
    <div class="folha-bd">
      <p class="cal-dica">Risque um X a cada dia que passa. Nos dias da viagem, toque para escolher a foto daquele dia.</p>
      <div class="cal-sem">${["dom","seg","ter","qua","qui","sex","sáb"].map(x=>`<span>${x}</span>`).join("")}</div>
      <div class="cal-grade">${dias.map(cel).join("")}</div>
      <div class="cal-pe">
        <span>${riscados} dia${riscados===1?"":"s"} riscado${riscados===1?"":"s"}</span>
        <span>${comFoto} de ${tripDays().length} dias com foto</span>
      </div>
      <div class="cal-marca-cfg">
        <label class="btn ghost sm" style="cursor:pointer">${S.marcaDia ? "Trocar marca" : "Usar uma imagem nos dias da viagem"}
          <input type="file" accept="image/*" data-marcanova hidden></label>
        ${S.marcaDia ? `<button class="btn ghost sm" type="button" data-act="marcaTirar">Voltar ao ícone do parque</button>` : ""}
        <p>A imagem fica <b>só neste aparelho</b> e não vai para o site publicado — é por isso que dá para usar uma arte que você tem sem distribuí-la. Cada celular escolhe a sua.</p>
      </div>
    </div>
  </div>`;
}

/* ============================== 8a-3. FOTOS DA VIAGEM ==============================
   Foto tirada aqui entra etiquetada sozinha: dia do roteiro, parque, atração
   (quando vem da lista) e coordenada, se houver permissão. É isso que permite o
   álbum categorizado depois.

   LIMITE QUE NÃO DÁ PARA CONTORNAR: um PWA no iOS não escreve no app Fotos —
   não existe API. A foto fica no IndexedDB deste aparelho, e o botão de
   exportar abre o compartilhar do sistema, de onde "Salvar Imagem" leva ao rolo.
   Por isso a tela avisa, e por isso pedimos armazenamento persistente. */

const fotoId = (id) => "foto-" + id;
const FOTO_LADO = 2000;      /* memória de viagem merece mais que recibo */
const FOTO_Q = 0.85;

/* Reduz a chance de o navegador despejar os dados sozinho quando o disco apertar. */
async function pedirPersistencia(){
  try{
    if(navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted()))
      await navigator.storage.persist();
  }catch(e){}
}

/* Etiquetas do momento: de onde a foto veio decide o que dá para saber. */
function etiquetasAgora(park, attr){
  const hj = iso(today());
  const dias = tripDays();
  const dia = dias.includes(hj) ? hj : (S.diaSel && dias.includes(S.diaSel) ? S.diaSel : "");
  const pk = park || (dia ? (S.days[dia] || {}).park : "") || (ondeEstou && ondeEstou.dentro ? ondeEstou.chave : "");
  return {
    dia, park: pk || "", attr: attr || "",
    lat: ondeEstou ? ondeEstou.lat : null,
    lng: ondeEstou ? ondeEstou.lng : null
  };
}

async function guardarFoto(arquivo, park, attr){
  if(!arquivo) return;
  fotoMsg("Guardando…");
  try{
    await pedirPersistencia();
    const blob = await comprimirImagem(arquivo, FOTO_LADO, FOTO_Q);
    const f = Object.assign({id:uid("f"), at:Date.now(), tam:blob.size, nome:arquivo.name || ""},
                            etiquetasAgora(park, attr));
    await docPut(fotoId(f.id), blob);
    S.fotos.push(f);
    save("fotos");
    render();
    fotoMsg(`Guardada${f.attr ? " em " + esc(nomeDoAttr(f.attr)) : f.park && PARKS[f.park] ? " em " + esc(PARKS[f.park].n) : ""} · ${docFmt(blob.size)}`, "ok");
  }catch(e){
    fotoMsg(/quota|Quota/.test(String(e && e.name)) ? "Sem espaço no aparelho. Exporte e remova algumas fotos." : "Não foi possível guardar a foto.", "err");
  }
}

async function removerFoto(id){
  const f = S.fotos.find(x => x.id === id);
  if(!confirm("Remover esta foto do aparelho? Se ela não foi exportada, some para sempre.")) return;
  await docDel(fotoId(id));
  S.fotos = S.fotos.filter(x => x.id !== id);
  save("fotos"); render();
}

/* Exportar é o único caminho para o rolo do iPhone. */
async function exportarFoto(id){
  const f = S.fotos.find(x => x.id === id);
  const blob = await docGet(fotoId(id));
  if(!blob || !f) return;
  const nome = "viagem-" + (f.dia || iso(new Date(f.at))) + "-" + id.slice(-4) + ".jpg";
  const arq = new File([blob], nome, {type: blob.type || "image/jpeg"});
  if(navigator.canShare && navigator.canShare({files:[arq]})){
    try{ await navigator.share({files:[arq], title:"Foto da viagem"}); return; }
    catch(e){ if(e && e.name === "AbortError") return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nome; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function fotoMsg(t, tom){
  const el = document.getElementById("fotoMsg");
  if(!el) return;
  el.textContent = t;
  el.style.color = tom === "err" ? "var(--crit)" : tom === "ok" ? "var(--ok)" : "var(--fg-dim)";
}

   As 20 linhas do orçamento são de planejamento: passagem, hotel, ingresso.
   Gasto de viagem é outra coisa — US$ 18 de almoço, na fila, com criança no
   colo. Por isso vira lista própria, com dois toques, e soma por categoria em
   cima do previsto. Isso SINCRONIZA: é dado da viagem, não do aparelho. */

  return S.gastos
    .filter(g => !cat || g.cat === cat)
    .reduce((t,g) => t + toBRL(g.valor||0, g.cur), 0);
}

   contar duas vezes se lançar nos dois lugares; a tela de Orçamento separa as

    try{ await docPut(recId(g.id), recPendente); g.rec = recPendente.size; }

  save();                    /* o caminho sai do diff, não do argumento */

}
