    console.assert(mapEmbedBlock(["Orlando, FL"],{}).indexOf("abrir no Google Maps")!==-1, "sem chave, o link de abrir no Maps continua funcionando");
    S.mapsKey = "FAKEKEY";
    console.assert(mapEmbedBlock(["Orlando, FL"],{}).indexOf("<iframe")!==-1, "com chave, o iframe aparece");
    const muitas = Array.from({length:12}, (_,i) => "Local " + i);
    console.assert(mapEmbedBlock(muitas,{}).indexOf("+3 local")!==-1, "acima de 9 paradas, o excesso é avisado em vez de quebrar o link");
    console.assert(mapEmbedBlock([],{}) === "", "sem paradas não deveria gerar embed nenhum");
    S.mapsKey = bakKey;

    /* ---- F6: tema cartoon ---- */
    {
      /* Olha as folhas de estilo, não o innerHTML: varrer o próprio código-fonte
         faz o teste casar com o regex dele mesmo e falhar sempre. */
      const externos = [...document.querySelectorAll("link[rel=stylesheet], link[as=font], link[rel=preload]")]
        .map(l => l.href).filter(h => /^https?:/i.test(h));
      let importa = false;
      for(const ss of document.styleSheets){
        try{ if([...ss.cssRules].some(r => r.type === 3)) importa = true; }catch(e){}
      }
      console.assert(!externos.length && !importa,
        "nenhuma fonte ou CSS pode vir da rede — offline é requisito. Achei: " + externos.join(", "));
    }
    console.assert(!!document.getElementById("ico-hoje") && !!document.getElementById("ico-ajustes"),
      "o sprite dos ícones das abas precisa estar embutido");
    {
      /* o tema escuro do sistema não pode vencer a escolha manual de claro */
      const raiz = document.documentElement, antes = raiz.getAttribute("data-theme");
      raiz.setAttribute("data-theme", "light");
      const claro = getComputedStyle(raiz).getPropertyValue("--paper").trim();
      raiz.setAttribute("data-theme", "dark");
      const escuro = getComputedStyle(raiz).getPropertyValue("--paper").trim();
      console.assert(claro && escuro && claro !== escuro,
        "claro e escuro têm que dar fundos diferentes, veio " + claro + " e " + escuro);
      if(antes) raiz.setAttribute("data-theme", antes); else raiz.removeAttribute("data-theme");
    }

    /* ---- F5: cinco abas e os segmentos ---- */
    console.assert(TABS.length === 5, "a Tab Bar do iOS comporta 5, veio " + TABS.length);
    TABS.forEach(t => console.assert(typeof VIEWS[t.id] === "function", "aba sem view: " + t.id));
    Object.keys(VIEWS).forEach(k => console.assert(TABS.some(t => t.id === k), "view sem aba: " + k));
    console.assert(LOCAL_ONLY.includes("seg"), "o segmento aberto é preferência de tela, não pode sincronizar");
    Object.keys(SEGS).forEach(a => {
      console.assert(TABS.some(t => t.id === a), "segmento de uma aba que não existe: " + a);
      console.assert(segAtual(a) === SEGS[a][0].id, "sem escolha, cai no primeiro segmento");
    });
    S.seg = {listas:"inventado"};
    console.assert(segAtual("listas") === "checklist", "segmento inválido tem que cair no primeiro, não quebrar");
    S.seg = {listas:"orcamento"};
    console.assert(segAtual("listas") === "orcamento", "segmento válido tem que ser respeitado");
    /* nenhum texto de tela pode mandar o usuário para uma aba que não existe */
    ["hoje","roteiro","parques","listas","ajustes"].forEach(() => {});
    console.assert(!/aba <b>(Início|Backup|Checklist|Compras|Orçamento)<\/b>/.test(document.body.innerHTML),
      "algum texto ainda manda o usuário para uma aba que não existe mais");

    console.assert(LOCAL_ONLY.includes("mapsKey"), "a chave do Maps não pode viajar no sync nem no código de transferência");

    console.assert(landId("mk","Main Street U.S.A.") === landId("mk","Main Street U.S.A."), "landId é determinístico");
    console.assert(!/[^a-z0-9-]/.test(landId("mk","Main Street U.S.A.").replace("land-mk-","")), "landId vira um id de HTML válido mesmo com acento/pontuação");

    /* restaurantes e hotéis viajam no sync — não são preferência de aparelho */
    console.assert(Array.isArray(S.dining) && S.dining.length > 0, "seed() precisa vir com os restaurantes de largada");
    console.assert(S.dining.every(r => r.dia === "" && r.hora === ""), "restaurantes de largada não devem vir com dia/hora chutados");
    console.assert(Array.isArray(S.hotels) && S.hotels.length === 2, "seed() precisa vir com Miami e Orlando em Hospedagem");
    console.assert(!LOCAL_ONLY.includes("dining") && !LOCAL_ONLY.includes("hotels"), "restaurantes e hotéis têm que sincronizar entre aparelhos");

    /* Restaurantes ↔ Roteiro: reserva com dia vira item do dia sozinha, sem duplicar cadastro */
    {
      const bakDining = S.dining;
      S.dining = [
        {id:"r1", nome:"Chef Mickey's", local:"Contemporary", nota:"", done:false, dia:"2026-08-25", hora:"18:30"},
        {id:"r2", nome:"Be Our Guest", local:"Magic Kingdom", nota:"", done:false, dia:"", hora:""},
        {id:"r3", nome:"'Ohana", local:"Polynesian", nota:"", done:false, dia:"2026-08-26", hora:"08:00"}
      ];
      console.assert(diningForDay("2026-08-25").length === 1 && diningForDay("2026-08-25")[0].nome === "Chef Mickey's",
        "só a reserva com dia == 25/08 deve aparecer no dia 25/08");
      console.assert(diningForDay("2026-08-27").length === 0, "reserva sem dia (ou de outro dia) não vaza para dias que não são o dela");

      const diaComItemManual = {items:[{id:"m1", hora:"09:00", nome:"Space Mountain"}]};
      const merge = mergedDayItems("2026-08-25", diaComItemManual);
      console.assert(merge.length === 2, "o dia junta item manual + reserva daquele dia, sem duplicar");
      console.assert(merge[0].nome === "Space Mountain" && merge[1].nome === "Chef Mickey's", "junção fica ordenada por horário, não por origem");
      console.assert(merge[1].fonte === "dining" && merge[0].fonte === "item", "cada item sabe de onde veio, pra tela decidir como desenhar");

      S.dining = bakDining;
    }

    /* sync: as chaves e as preferências de tela nunca podem sair daqui */
    S.sync = {provider:"jsonbin", url:"https://api.jsonbin.io/v3/b/abc", token:"SEGREDO", header:"X-Master-Key", auto:false};
    S.mapsKey = "CHAVE-DO-MAPA";
    S.tab = "compras"; S.device = "Celular";
    const p = payload();
    console.assert(p.sync === undefined, "payload NÃO pode carregar a chave do servidor");
    console.assert(p.mapsKey === undefined, "payload NÃO pode carregar a chave do Maps");
    console.assert(p.tab === undefined && p.parkFilter === undefined, "payload não deve carregar preferências de tela");
    console.assert(p.updatedBy === "Celular" && p.checks && p.trip, "payload precisa levar os dados e a autoria");
    console.assert(JSON.stringify(payload()).indexOf("SEGREDO") === -1, "a chave do sync vazou no payload");
    console.assert(JSON.stringify(payload()).indexOf("CHAVE-DO-MAPA") === -1, "a chave do Maps vazou no payload");
    console.assert(encodeState().indexOf("SEGREDO") === -1 && encodeState().indexOf("CHAVE-DO-MAPA") === -1 &&
      atob(encodeState()).indexOf("SEGREDO") === -1 && atob(encodeState()).indexOf("CHAVE-DO-MAPA") === -1,
      "alguma chave vazou no código de transferência");

    const u = syncUrls();
    console.assert(u.read.endsWith("/latest") && !u.write.endsWith("/latest"), "jsonbin: leitura usa /latest, escrita não");
    console.assert(u.headers["X-Master-Key"] === "SEGREDO", "jsonbin: cabeçalho da chave");
    /* endpoint próprio: o cliente concatena /trip (docs/API.md §3) */
    S.sync.provider = "generic"; S.sync.header = "Authorization"; S.sync.url = "https://x.dev/v/";
    const g = syncUrls();
    console.assert(g.read === "https://x.dev/v/trip" && g.read === g.write,
      "generic: mesma URL para ler e gravar, com /trip e sem barra final — veio " + g.read);
    console.assert(g.headers.Authorization === "SEGREDO", "generic: cabeçalho configurável");
    S.sync.url = "https://x.dev/v/trip";
    console.assert(syncUrls().read === "https://x.dev/v/trip",
      "URL já colada com /trip não pode virar /trip/trip");

    /* ---- F3: os quatro estados visíveis, sempre com texto ---- */
    {
      const redeBak = comRede;
      S.sync.url = "https://x.dev/v"; S.updatedAt = 10; S.lastSync = 10;
      comRede = true;
      console.assert(rotuloSalvo() === "salvo", "em dia e com rede = salvo");
      S.updatedAt = 20;
      console.assert(rotuloSalvo() === "salvo · sync pendente", "pendente com rede");
      comRede = false;
      console.assert(rotuloSalvo() === "salvo · offline", "pendente sem rede tem que dizer offline");
      console.assert(rotuloBotao(false) === "Offline •" && rotuloBotao(true) === "Off •",
        "o botão também precisa mostrar offline, não só o rótulo");
      S.updatedAt = 10; S.lastSync = 10;
      console.assert(rotuloBotao(false) === "Offline", "sem pendência offline não leva bolinha");
      S.sync.url = "";
      console.assert(rotuloBotao(false) === "Configurar sync", "sem servidor, o botão convida a configurar");
      comRede = redeBak;
    }

    /* pendente() só liga com sync configurado e alteração posterior */
    S.sync.url = ""; S.updatedAt = 10; S.lastSync = 5;
    console.assert(pendente() === false, "sem servidor não existe pendência");
    S.sync.url = "https://x.dev/v";
    console.assert(pendente() === true, "alteração após o último sync = pendente");
    S.lastSync = 10;
    console.assert(pendente() === false, "sincronizado = sem pendência");
  } finally { S = bak; }
})();

/* ============================== 11. INÍCIO ============================== */
render();

/* Service worker: offline completo (ADR 0008). Só sob http(s) — abrir o arquivo
   direto do Finder (file://) não registra, e não precisa. */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .catch(e => console.warn("service worker não registrou:", e && e.message));
  });
}
</script>
